[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal4d"
dynamic = ["version"]
description = "Bayesian intervention abduction and interventional prediction for deformable-object dynamics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Florian Pfaff" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.24",
  "packaging>=23",
  "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/IPS-Stuttgart/Causal4D"
Documentation = "https://github.com/IPS-Stuttgart/Causal4D/tree/main/docs"
Issues = "https://github.com/IPS-Stuttgart/Causal4D/issues"
Citation = "https://github.com/IPS-Stuttgart/Causal4D/blob/main/CITATION.cff"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pre-commit>=3.7,<5",
  "pytest>=8",
  "ruff>=0.15.22,<0.17",
  "twine>=5",
]
phystwin = [
  "bayesian-phystwin>=0.4,<0.5",
]
vision = [
  "opencv-python>=4.8",
  "pillow>=9.5",
  "torch>=2.0",
]
warp = [
  "torch>=2.0",
  "warp-lang>=1.0",
]
pyrecest = [
  "pyrecest>=2.4.1",
]

[project.scripts]
causal4d = "causal4d.cli.root:main"

[tool.setuptools.dynamic]
version = { attr = "causal4d.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
causal4d = [
    "__init__.pyi",
    "py.typed",
    "contract_data/evidence_decision_v1/*.json",
    "contract_data/evidence_decision_v1/vectors/*.json",
    "contract_data/observation_belief_v1/*.json",
    "contract_data/observation_belief_v1/vectors/*.json",
    "contract_data/provider_v2_factors_v1/*.json",
    "contract_data/provider_v2_factors_v1/vectors/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_unused_ignores = true
