name: Fix guarded BPT provider boundary once

on:
  push:
    branches:
      - agent/consume-guarded-bpt-selection-v2

permissions:
  contents: write

concurrency:
  group: fix-guarded-bpt-provider-boundary-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'IPS-Stuttgart/Causal4D'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/consume-guarded-bpt-selection-v2
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Route the handoff through the versioned provider facade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path


          def replace_exact(
              path: Path,
              old: str,
              new: str,
              *,
              count: int = 1,
          ) -> None:
              text = path.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f"{path}: expected {count} occurrences of {old!r}, found {actual}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")


          source = Path("src/causal4d/guarded_bpt_belief_handoff_v2.py")
          replace_exact(
              source,
              "    from bayesian_phystwin.guarded_belief_selection_v2 import (\n"
              "        GuardedBeliefSelectionReceiptV2,\n"
              "    )\n"
              "    from bayesian_phystwin.provider_runtime_identity_v1 import (\n"
              "        Prob4DRuntimeIdentityV1,\n"
              "    )\n",
              "    from bayesian_phystwin.causal4d_guarded_belief_provider_v1 import (\n"
              "        GuardedBeliefSelectionReceiptV2,\n"
              "        Prob4DRuntimeIdentityV1,\n"
              "    )\n",
          )

          test = Path("tests/test_guarded_bpt_belief_handoff_v2.py")
          replace_exact(
              test,
              "    selection = ModuleType(\n"
              "        \"bayesian_phystwin.guarded_belief_selection_v2\"\n"
              "    )\n"
              "    selection.GuardedBeliefSelectionReceiptV2 = _FakeSelection\n\n"
              "    runtime = ModuleType(\n"
              "        \"bayesian_phystwin.provider_runtime_identity_v1\"\n"
              "    )\n"
              "    runtime.Prob4DRuntimeIdentityV1 = _FakeRuntimeIdentity\n",
              "    guarded_provider = ModuleType(\n"
              "        \"bayesian_phystwin.causal4d_guarded_belief_provider_v1\"\n"
              "    )\n"
              "    guarded_provider.GuardedBeliefSelectionReceiptV2 = _FakeSelection\n"
              "    guarded_provider.Prob4DRuntimeIdentityV1 = _FakeRuntimeIdentity\n",
          )
          replace_exact(
              test,
              "    monkeypatch.setitem(\n"
              "        sys.modules,\n"
              "        \"bayesian_phystwin.guarded_belief_selection_v2\",\n"
              "        selection,\n"
              "    )\n"
              "    monkeypatch.setitem(\n"
              "        sys.modules,\n"
              "        \"bayesian_phystwin.provider_runtime_identity_v1\",\n"
              "        runtime,\n"
              "    )\n",
              "    monkeypatch.setitem(\n"
              "        sys.modules,\n"
              "        \"bayesian_phystwin.causal4d_guarded_belief_provider_v1\",\n"
              "        guarded_provider,\n"
              "    )\n",
          )

          boundary = Path("tests/test_bpt_provider_import_boundary.py")
          replace_exact(
              boundary,
              "_DEDICATED_PROVIDER_REQUIREMENTS = {\n"
              "    \"bayesian_phystwin.causal4d_belief_provider_v3\": (\n"
              "        \"CAUSAL4D_REQUIRE_BPT_BELIEF_PROVIDER_V3\"\n"
              "    ),\n",
              "_DEDICATED_PROVIDER_REQUIREMENTS = {\n"
              "    \"bayesian_phystwin.causal4d_belief_provider_v3\": (\n"
              "        \"CAUSAL4D_REQUIRE_BPT_BELIEF_PROVIDER_V3\"\n"
              "    ),\n"
              "    \"bayesian_phystwin.causal4d_guarded_belief_provider_v1\": (\n"
              "        \"CAUSAL4D_REQUIRE_GUARDED_BPT_PROVIDER\"\n"
              "    ),\n",
          )

          registry_path = Path("ci/bayesian_phystwin_provider_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          modules = registry["modules"]
          module_name = "bayesian_phystwin.causal4d_guarded_belief_provider_v1"
          if any(entry.get("module") == module_name for entry in modules):
              raise SystemExit("guarded provider is already registered")
          insertion = next(
              index
              for index, entry in enumerate(modules)
              if entry["module"] == "bayesian_phystwin.causal4d_tree_block_provider_v1"
          )
          modules.insert(
              insertion,
              {
                  "module": module_name,
                  "api_version": 1,
                  "role": "guarded_complete_belief_handoff",
                  "lifecycle": "production_additive",
                  "local_contract_module": None,
              },
          )
          registry_path.write_text(
              json.dumps(registry, indent=2) + "\n",
              encoding="utf-8",
          )

          registry_test = Path("tests/test_bpt_provider_registry.py")
          replace_exact(
              registry_test,
              "    assert \"bayesian_phystwin.causal4d_belief_provider_v2\" in modules\n"
              "    assert \"bayesian_phystwin.causal4d_tree_block_provider_v1\" in modules\n",
              "    assert \"bayesian_phystwin.causal4d_belief_provider_v2\" in modules\n"
              "    assert (\n"
              "        \"bayesian_phystwin.causal4d_guarded_belief_provider_v1\"\n"
              "        in modules\n"
              "    )\n"
              "    assert \"bayesian_phystwin.causal4d_tree_block_provider_v1\" in modules\n",
          )

          docs = Path("docs/bayesian_phystwin_provider.md")
          replace_exact(
              docs,
              "- `bayesian_phystwin.causal4d_belief_provider_v2` for additive model-averaged\n"
              "  endpoints and source-calibrated horizon discrepancy moments;\n"
              "- `bayesian_phystwin.causal4d_tree_block_provider_v1` for strict claim-bearing\n",
              "- `bayesian_phystwin.causal4d_belief_provider_v2` for additive model-averaged\n"
              "  endpoints and source-calibrated horizon discrepancy moments;\n"
              "- `bayesian_phystwin.causal4d_guarded_belief_provider_v1` for exact Prob4D\n"
              "  runtime, candidate-construction, complete-belief guard, and selected-belief\n"
              "  receipt identities;\n"
              "- `bayesian_phystwin.causal4d_tree_block_provider_v1` for strict claim-bearing\n",
          )
          replace_exact(
              docs,
              "Registered tree-block covariance queries use their own additive provider and\n"
              "local validation contract. The rollout-bank backend and resumable cache execute\n",
              "Registered tree-block covariance queries use their own additive provider and\n"
              "local validation contract. Guarded handoff v2 imports runtime and complete-belief\n"
              "selection contracts only through its dedicated versioned facade; an older pinned\n"
              "wheel may omit that additive module unless the paired compatibility lane sets\n"
              "`CAUSAL4D_REQUIRE_GUARDED_BPT_PROVIDER=1`. The rollout-bank backend and resumable\n"
              "cache execute\n",
          )
          replace_exact(
              docs,
              "CAUSAL4D_REQUIRE_TREE_BLOCK_QUERY_PROVIDER=1 python -m pytest -q \\\n"
              "  tests/test_bpt_tree_block_query_provider_integration.py \\\n"
              "  tests/test_tree_block_query_provider_contract.py \\\n"
              "  tests/test_tree_block_belief_query.py\n",
              "CAUSAL4D_REQUIRE_TREE_BLOCK_QUERY_PROVIDER=1 python -m pytest -q \\\n"
              "  tests/test_bpt_tree_block_query_provider_integration.py \\\n"
              "  tests/test_tree_block_query_provider_contract.py \\\n"
              "  tests/test_tree_block_belief_query.py\n"
              "CAUSAL4D_REQUIRE_GUARDED_BPT_PROVIDER=1 python -m pytest -q \\\n"
              "  tests/test_guarded_bpt_belief_handoff_v2.py \\\n"
              "  tests/test_bpt_provider_import_boundary.py\n",
          )
          PY

          python -m pip install -e '.[dev]'
          files=(
            src/causal4d/guarded_bpt_belief_handoff_v2.py
            tests/test_guarded_bpt_belief_handoff_v2.py
            tests/test_bpt_provider_import_boundary.py
            tests/test_bpt_provider_registry.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m pytest -q -p no:cacheprovider \
            tests/test_guarded_bpt_belief_handoff_v2.py \
            tests/test_bpt_provider_import_boundary.py \
            tests/test_bpt_provider_registry.py
          git diff --check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-guarded-bpt-provider-boundary-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Route guarded handoff through versioned provider'
          git push origin HEAD:agent/consume-guarded-bpt-selection-v2
