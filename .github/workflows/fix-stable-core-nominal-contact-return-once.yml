name: Fix stable-core nominal-contact return once

on:
  push:
    branches:
      - agent/stable-core-typing-ratchet

permissions:
  contents: write

concurrency:
  group: fix-stable-core-nominal-contact-return-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'IPS-Stuttgart/Causal4D'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/stable-core-typing-ratchet
          fetch-depth: 1
          persist-credentials: true

      - name: Apply the exact return-type narrowing
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/causal4d/intervention_abduction.py)" = \
            285fbe4644b0321da4eeb67bfc7b48049fd1541b
          python - <<'PY'
          from pathlib import Path

          path = Path("src/causal4d/intervention_abduction.py")
          text = path.read_text(encoding="utf-8")
          old = "    return np.asarray(selected, dtype=np.int64)\n"
          new = """    return cast(
              np.ndarray,
              np.asarray(selected, dtype=np.int64),
          )
          """
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one nominal-contact return, found {text.count(old)}"
              )
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Validate the permanent repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m ruff format src/causal4d/intervention_abduction.py
          python -m ruff check src/causal4d/intervention_abduction.py
          python scripts/ci/run_stable_core_mypy.py
          PYTHONPATH=src:. python -m pytest -q \
            tests/test_causal4d_intervention_abduction.py \
            tests/test_stable_core_typing_policy.py
          git diff --check

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-stable-core-nominal-contact-return-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Narrow nominal-contact hypothesis return type'
          git push origin HEAD:agent/stable-core-typing-ratchet
