name: PokeFlex initial-state matching audit

on:
  push:
    paths:
      - .github/requests/pokeflex-initial-state-matching-gpuserver4090-v1.json
      - .github/workflows/pokeflex-initial-state-matching-gpuserver4090.yml
      - src/causal4d_public/pokeflex_initial_state_matching.py
      - scripts/remote/run_pokeflex_initial_state_matching_gpuserver4090.py
      - scripts/ci/verify_pokeflex_initial_state_matching.py
      - tests/test_pokeflex_initial_state_matching.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokeflex-initial-state-matching-gpuserver4090-v1
  cancel-in-progress: false

jobs:
  contract:
    name: Hosted reset-matching contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install focused dependencies
        run: python -m pip install -e . pytest ruff
      - name: Validate implementation and information boundary
        run: |
          ruff check \
            src/causal4d_public/pokeflex_initial_state_matching.py \
            scripts/remote/run_pokeflex_initial_state_matching_gpuserver4090.py \
            scripts/ci/verify_pokeflex_initial_state_matching.py \
            tests/test_pokeflex_initial_state_matching.py
          ruff format --check \
            src/causal4d_public/pokeflex_initial_state_matching.py \
            scripts/remote/run_pokeflex_initial_state_matching_gpuserver4090.py \
            scripts/ci/verify_pokeflex_initial_state_matching.py \
            tests/test_pokeflex_initial_state_matching.py
          pytest -q tests/test_pokeflex_initial_state_matching.py

  audit:
    name: Audit reset compatibility on gpuserver4090
    needs: contract
    runs-on: [self-hosted, Linux, X64, nvidia-smi, gpuserver4090]
    timeout-minutes: 120
    env:
      DATASET_ROOT: /mnt/seagate10tb/florianpfaff/datasets/pokeflex
      OUTPUT: artifacts/pokeflex-initial-state-matching-v1/result.json
      SALT: causal4d-pokeflex-logged-active-probe-v1
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true
      - name: Assert exact clean revision
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
      - name: Select isolated Python runtime
        run: |
          python3 -m venv .venv-reset-match
          .venv-reset-match/bin/python -m pip install --disable-pip-version-check -e .
      - name: Run earliest-mesh-only audit
        run: |
          .venv-reset-match/bin/python \
            scripts/remote/run_pokeflex_initial_state_matching_gpuserver4090.py \
            --dataset-root "${DATASET_ROOT}" \
            --output "${OUTPUT}" \
            --salt "${SALT}"
      - name: Independently verify retained result
        run: |
          .venv-reset-match/bin/python \
            scripts/ci/verify_pokeflex_initial_state_matching.py "${OUTPUT}"
      - name: Publish exact scientific summary
        if: always()
        run: |
          if test -f "${OUTPUT}"; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("artifacts/pokeflex-initial-state-matching-v1/result.json")
          result = json.loads(output.read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("# PokeFlex reset-matching audit\n\n")
              stream.write(f"- status: `{result['decision']['status']}`\n")
              stream.write(f"- source caliper: `{result['source']['caliper']:.8f}`\n")
              stream.write(
                  "- calibration passing-query fraction: "
                  f"`{result['calibration']['passing_query_fraction']:.4f}`\n"
              )
              stream.write(
                  "- target passing-query fraction: "
                  f"`{result['target']['passing_query_fraction']:.4f}`\n"
              )
              stream.write(
                  "- selected-response authorized: "
                  f"`{result['decision']['selected_response_experiment_authorized']}`\n"
              )
              stream.write("- challenge outcomes read: `0`\n")
          PY
          fi
      - name: Upload source-frozen reset-matching evidence
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: pokeflex-initial-state-matching-v1-${{ github.run_id }}
          path: artifacts/pokeflex-initial-state-matching-v1
          if-no-files-found: error
          retention-days: 90
