name: Temporary format active-causal scripts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-format-active-causal.yml"
      - "scripts/experiments/active_causal_belief_adaptivity.py"
      - "scripts/ci/verify_active_causal_belief_adaptivity.py"

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "ruff>=0.15.22,<0.17"
      - name: Format scripts
        run: |
          ruff format \
            scripts/experiments/active_causal_belief_adaptivity.py \
            scripts/ci/verify_active_causal_belief_adaptivity.py
          ruff format --check \
            scripts/experiments/active_causal_belief_adaptivity.py \
            scripts/ci/verify_active_causal_belief_adaptivity.py
      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatted-active-causal-${{ github.run_id }}
          path: |
            scripts/experiments/active_causal_belief_adaptivity.py
            scripts/ci/verify_active_causal_belief_adaptivity.py
          if-no-files-found: error
          retention-days: 1
