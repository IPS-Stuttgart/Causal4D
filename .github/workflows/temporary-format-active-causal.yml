name: Temporary format active-causal scripts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-format-active-causal.yml"
      - "scripts/experiments/active_causal_belief_adaptivity.py"
      - "scripts/ci/verify_active_causal_belief_adaptivity.py"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "ruff>=0.15.22,<0.17"
      - name: Format and publish scripts
        run: |
          set -euo pipefail
          ruff format \
            scripts/experiments/active_causal_belief_adaptivity.py \
            scripts/ci/verify_active_causal_belief_adaptivity.py
          ruff format --check \
            scripts/experiments/active_causal_belief_adaptivity.py \
            scripts/ci/verify_active_causal_belief_adaptivity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/experiments/active_causal_belief_adaptivity.py \
            scripts/ci/verify_active_causal_belief_adaptivity.py
          if ! git diff --cached --quiet; then
            git commit -m "Format active-causal experiment"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
