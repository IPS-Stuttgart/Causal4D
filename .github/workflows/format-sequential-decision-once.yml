# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Format sequential decision files once

on:
  push:
    branches:
      - feature/active-decision-identification-v1
    paths:
      - ".github/workflows/format-sequential-decision-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/active-decision-identification-v1
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format and commit only the registered Python files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.16.5
          files=(
            scripts/experiments/active_decision_identification.py
            scripts/experiments/sequential_decision_identification.py
            src/causal4d/sequential_decision_identification.py
            tests/test_sequential_decision_identification.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            allowed=false
            for expected in "${files[@]}"; do
              if test "$path" = "$expected"; then
                allowed=true
              fi
            done
            test "$allowed" = true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "Files already formatted"
          else
            git commit -m "Format sequential decision-identification files"
            git push origin HEAD:feature/active-decision-identification-v1
          fi
