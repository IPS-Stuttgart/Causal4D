name: PokeFlex five-bout structure

on:
  push:
    branches:
      - science/public-deformable-dataset-admissibility-20260831
    paths:
      - .github/workflows/pokeflex-five-bout-structure.yml
      - scripts/remote/analyze_pokeflex_contact_bouts.py

permissions:
  contents: read

concurrency:
  group: pokeflex-five-bout-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Source-only repeated-poke structural gate
    runs-on: [self-hosted, Linux, X64, gpuserver6000]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify and execute bounded analysis
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          /usr/bin/python3 -m py_compile scripts/remote/analyze_pokeflex_contact_bouts.py
          output=pokeflex-five-bout-structure
          mkdir -p "$output"
          /usr/bin/python3 scripts/remote/analyze_pokeflex_contact_bouts.py \
            --inputs /mnt/lexar4tb/datasets/pokeflex/inputs \
            --targets /mnt/lexar4tb/datasets/pokeflex/targets \
            --output "$output/result.json"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner=${RUNNER_NAME}"
          } > "$output/runner.txt"
          sha256sum "$output"/* > "$output/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pokeflex-five-bout-structure-${{ github.run_id }}
          path: pokeflex-five-bout-structure
          if-no-files-found: error
          retention-days: 30
