name: BayesianPhysTwin evidence-decision admission

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evidence-decision-admission.yml"
      - "docs/evidence-decision-admission-v1.md"
      - "src/causal4d/evidence_decision_v1.py"
      - "tests/test_evidence_decision_v1.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/evidence-decision-admission.yml"
      - "docs/evidence-decision-admission-v1.md"
      - "src/causal4d/evidence_decision_v1.py"
      - "tests/test_evidence_decision_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BPT_CONTRACT_REVISION: 4ee702f5130cfedbea7bce6be5e72483c92f63da
  BPT_SCHEMA_SHA256: d5615258c6cf666d0ed9684a87930989adf91817fe99b0387e83a31479dcd465
  SYNTHETIC_CAUSAL4D_REVISION: "2222222222222222222222222222222222222222"
  SYNTHETIC_PROB4D_REVISION: "3333333333333333333333333333333333333333"

jobs:
  installed-boundary:
    name: Pinned producer and installed Causal4D admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact BayesianPhysTwin contract source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ env.BPT_CONTRACT_REVISION }}
          path: vendor/BayesianPhysTwin
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            vendor/BayesianPhysTwin/pyproject.toml
      - name: Install both wheel boundaries
        run: python -m pip install . ./vendor/BayesianPhysTwin
      - name: Verify schema bytes and generated admission
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          from importlib.resources import files
          from pathlib import Path

          from bayesian_phystwin.v1 import (
              DecisionMetricV1,
              EvidenceDecisionV1,
              RepositoryState,
              write_evidence_decision,
          )
          from causal4d.evidence_decision_v1 import (
              EVIDENCE_DECISION_JSON_SCHEMA_SHA256,
              admit_causal_claim_v1,
              load_evidence_decision_v1,
          )

          schema = files("bayesian_phystwin").joinpath(
              "contract_data",
              "evidence_decision_v1",
              "evidence-decision-v1.schema.json",
          )
          schema_sha256 = hashlib.sha256(schema.read_bytes()).hexdigest()
          expected_schema_sha256 = os.environ["BPT_SCHEMA_SHA256"]
          assert schema_sha256 == expected_schema_sha256
          assert EVIDENCE_DECISION_JSON_SCHEMA_SHA256 == expected_schema_sha256

          bpt_revision = os.environ["BPT_CONTRACT_REVISION"]
          causal4d_revision = os.environ["SYNTHETIC_CAUSAL4D_REVISION"]
          prob4d_revision = os.environ["SYNTHETIC_PROB4D_REVISION"]
          decision = EvidenceDecisionV1(
              claim_id="contract.causal-admission",
              protocol_id="evidence-decision-causal-admission-v1",
              status="pass",
              run_classification="confirmatory",
              claim_authorized=True,
              evidence_level=3,
              metric=DecisionMetricV1(
                  name="synthetic_contract_metric",
                  comparison="reference_contract",
                  rule="observed_value_ge_threshold",
                  observed_value=1.0,
                  threshold_value=1.0,
                  unit="dimensionless",
              ),
              run_manifest_id="4" * 64,
              evidence_fingerprint="5" * 64,
              evidence_summary_sha256="6" * 64,
              repositories=(
                  RepositoryState(
                      repository="IPS-Stuttgart/BayesianPhysTwin",
                      revision=bpt_revision,
                      dirty=False,
                      role="primary",
                  ),
                  RepositoryState(
                      repository="IPS-Stuttgart/Causal4D",
                      revision=causal4d_revision,
                      dirty=False,
                      role="downstream",
                  ),
                  RepositoryState(
                      repository="IPS-Stuttgart/Prob4D",
                      revision=prob4d_revision,
                      dirty=False,
                      role="observation",
                  ),
              ),
              limitations=(
                  "synthetic contract vector; not scientific evidence",
              ),
              metadata={"synthetic": True},
              created_utc="2026-08-10T12:00:00+00:00",
          )
          output = Path("decision.json")
          write_evidence_decision(output, decision)

          validated = load_evidence_decision_v1(output)
          admission = admit_causal_claim_v1(
              validated,
              claim_id="contract.causal-admission",
              protocol_id="evidence-decision-causal-admission-v1",
              expected_bayesian_phystwin_revision=bpt_revision,
              expected_causal4d_revision=causal4d_revision,
              expected_prob4d_revision=prob4d_revision,
              minimum_evidence_level=3,
              require_prob4d_binding=True,
          )
          assert admission.decision.decision_id == decision.decision_id
          assert admission.bayesian_phystwin.role == "primary"
          assert admission.causal4d.role == "downstream"
          assert admission.prob4d is not None
          assert admission.prob4d.role == "observation"
          PY
      - name: Exercise installed command-line admission
        working-directory: ${{ runner.temp }}
        run: >-
          python -m causal4d.evidence_decision_v1
          decision.json
          --claim-id contract.causal-admission
          --protocol-id evidence-decision-causal-admission-v1
          --expected-bayesian-phystwin-revision "${BPT_CONTRACT_REVISION}"
          --expected-causal4d-revision "${SYNTHETIC_CAUSAL4D_REVISION}"
          --expected-prob4d-revision "${SYNTHETIC_PROB4D_REVISION}"
          --minimum-evidence-level 3
          --require-prob4d-binding
          > admission-receipt.json
      - name: Upload admission receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-decision-admission-receipt
          path: ${{ runner.temp }}/admission-receipt.json
          retention-days: 14
