name: Repair PokeFlex workflow hygiene

on:
  pull_request:
    paths:
      - ".github/workflows/repair-pokeflex-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install policy test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.4.2

      - name: Apply deterministic hygiene repair
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          workflow = Path(
              ".github/workflows/"
              "pokeflex-probe-challenge-fold-audit-gpuserver4090.yml"
          )
          text = workflow.read_text(encoding="utf-8")
          text = text.replace(
              "uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1\n",
              "uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1\n",
          )
          text = text.replace(
              "uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a\n",
              "uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0\n",
          )
          workflow.write_text(text, encoding="utf-8")

          registry_path = Path(".github/self-hosted-jobs.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          entry = {
              "authorization_model": "reviewed-file-main",
              "dataset_access": "verified-public-pokeflex-zip-central-directory-metadata-only",
              "job": "audit",
              "purpose": "Metadata-only PokeFlex probe/challenge fold feasibility audit",
              "runner_labels": [
                  "self-hosted",
                  "Linux",
                  "X64",
                  "gpuserver4090",
              ],
              "secrets_allowed": False,
              "workflow": "pokeflex-probe-challenge-fold-audit-gpuserver4090.yml",
          }
          keys = {(item["workflow"], item["job"]) for item in registry["jobs"]}
          key = (entry["workflow"], entry["job"])
          if key not in keys:
              registry["jobs"].append(entry)
          registry["jobs"].sort(key=lambda item: (item["workflow"], item["job"]))
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify repaired policies
        run: |
          python -m pytest -q \
            tests/test_github_action_pins.py \
            tests/test_self_hosted_workflow_policy.py

      - name: Commit repair to source branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/pokeflex-probe-challenge-fold-audit-gpuserver4090.yml \
            .github/self-hosted-jobs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Register and annotate PokeFlex self-hosted audit"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
