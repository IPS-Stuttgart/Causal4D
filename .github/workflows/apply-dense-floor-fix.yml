name: Apply dense floor compatibility fix

on:
  push:
    branches:
      - agent/registered-cross-branch-stability-gate

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[dense-floor-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply and format exact fix
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .agent-fix/dense-singleton.patch.b64 > /tmp/dense-singleton.patch
          git apply --check /tmp/dense-singleton.patch
          git apply /tmp/dense-singleton.patch
          python -m pip install 'ruff==0.16.3'
          python -m ruff format src/causal4d/dense_likelihood.py
          python -m ruff check src/causal4d/dense_likelihood.py tests/test_dense_likelihood_batched.py
          git diff --check

      - name: Build wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv build-venv
          build-venv/bin/python -m pip install build
          build-venv/bin/python -m build --wheel --outdir dist-floor

      - name: Verify exact declared dependency floors
        shell: bash
        run: |
          set -euo pipefail
          python -m venv floor-venv
          floor-venv/bin/python -m pip install \
            'numpy==1.24.0' \
            'packaging==23.0' \
            'scipy==1.10.0' \
            'pytest==8.0.0'
          artifact=$(find dist-floor -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$artifact"
          floor-venv/bin/python -m pip install --no-deps "$artifact"
          floor-venv/bin/python -m pytest -q tests/test_dense_likelihood_batched.py

      - name: Commit verified fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .agent-fix/dense-singleton.patch.b64
          rm .github/workflows/apply-dense-floor-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/causal4d/dense_likelihood.py .agent-fix/dense-singleton.patch.b64 .github/workflows/apply-dense-floor-fix.yml
          git commit -m 'Preserve legacy singleton dense batching at dependency floors [dense-floor-fix-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
