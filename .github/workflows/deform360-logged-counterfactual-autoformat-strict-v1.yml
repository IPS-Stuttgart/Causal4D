name: Format strict logged-counterfactual implementation v1

on:
  push:
    branches:
      - science/deform360-logged-counterfactual-v1
    paths:
      - .github/workflows/deform360-logged-counterfactual-autoformat-strict-v1.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: science/deform360-logged-counterfactual-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Format strict implementation
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.5'
          files=(
            src/causal4d_public/deform360_logged_counterfactual.py
            src/causal4d_public/deform360_logged_counterfactual_strict.py
            scripts/experiments/deform360_logged_counterfactual_source_v1.py
            tests/test_deform360_logged_counterfactual.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          rm .github/workflows/deform360-logged-counterfactual-autoformat-strict-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}" .github/workflows/deform360-logged-counterfactual-autoformat-strict-v1.yml
          git commit -m 'Format strict logged counterfactual implementation'
          git push origin HEAD:science/deform360-logged-counterfactual-v1
