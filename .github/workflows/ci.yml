name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Ruff, formatting, and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff and capture diagnostics
        id: ruff
        shell: bash
        run: |
          set +e
          python -m ruff --version > ruff-version.txt 2>&1
          version_status=$?
          cat ruff-version.txt
          python -m ruff check . > ruff-output.txt 2>&1
          ruff_status=$?
          cat ruff-output.txt
          printf '%s\n' "$ruff_status" > ruff-exit-status.txt
          if (( version_status != 0 )); then
            exit "$version_status"
          fi
          exit "$ruff_status"
      - name: Upload Ruff failure diagnostics
        if: ${{ failure() && steps.ruff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ruff-version.txt
            ruff-output.txt
            ruff-exit-status.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Select changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/ci/changed_python_files.py \
            --base "${BASE_SHA:-}" --head "${GITHUB_SHA}" > changed-python.txt
          cat changed-python.txt
      - name: Check formatting incrementally
        run: |
          mapfile -t files < changed-python.txt
          if (( ${#files[@]} )); then
            python -m ruff format --check "${files[@]}"
          else
            echo "No changed Python files require a formatting check."
          fi
      - name: Type-check stable contracts and CI utilities
        run: |
          python -m mypy --python-version 3.12 \
            scripts/ci \
            src/causal4d/atomic_io.py \
            src/causal4d/result_bundle_publication.py \
            src/causal4d/trusted_pickle.py \
            src/causal4d/immutable_array.py \
            src/causal4d/immutable_json.py \
            src/causal4d/low_rank_numerics.py \
            src/causal4d/contracts.py \
            src/causal4d/counterfactual.py \
            src/causal4d/grouped_likelihood.py \
            src/causal4d/intervention_abduction.py \
            src/causal4d/observation_evidence.py \
            src/causal4d/api/v1.py \
            src/causal4d/provider_contract.py \
            src/causal4d/replay_provider_contract.py

  core:
    name: Core-only / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and development dependencies only
        run: python -m pip install -e ".[dev]"
      - name: Assert optional runtimes are absent
        run: |
          python - <<'PY'
          import importlib.util

          forbidden = ("bayesian_phystwin", "cv2", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into core job: {present}")
          PY
      - name: Run core-compatible default suite
        run: |
          python -m pytest \
            --junitxml="pytest-core-${{ matrix.python-version }}.xml"
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pytest-core-${{ matrix.python-version }}
          path: pytest-core-${{ matrix.python-version }}.xml

  pinned-bpt:
    name: Pinned Bayesian-PhysTwin installed-wheel integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Check out pinned Bayesian-PhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: 573ecd9b09a8145b680738c5e5f36415feefbfe3
          path: _bpt
          persist-credentials: false
      - name: Build Causal4D and pinned provider wheels
        run: |
          python -m pip install --upgrade build pip
          wheelhouse="$RUNNER_TEMP/pinned-bpt-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m build --wheel --outdir "$wheelhouse" .
          python -m build --wheel --outdir "$wheelhouse" ./_bpt
          test "$(find "$wheelhouse" -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
      - name: Install isolated wheels
        run: |
          wheelhouse="$RUNNER_TEMP/pinned-bpt-wheelhouse"
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install --upgrade pip
          artifact-venv/bin/python -m pip install "$wheelhouse"/*.whl pytest
          artifact-venv/bin/python -m pip check
      - name: Run pinned-provider integration tests
        env:
          CAUSAL4D_REQUIRE_BPT_PROVIDER: "1"
        run: artifact-venv/bin/python scripts/ci/run_bpt_integration_tests.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: dist/

  installed-artifact:
    name: Installed ${{ matrix.kind }} and all CLI help
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [wheel, sdist]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Install isolated ${{ matrix.kind }}
        shell: bash
        run: |
          python -m venv artifact-venv
          artifact-venv/bin/python -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            artifact=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          else
            artifact=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          fi
          test -n "$artifact"
          artifact-venv/bin/python -m pip install "$artifact"
          artifact-venv/bin/python -m pip check
      - name: Assert base installation has no optional providers
        run: |
          artifact-venv/bin/python - <<'PY'
          import importlib.util

          forbidden = ("bayesian_phystwin", "cv2", "torch", "warp")
          present = [name for name in forbidden if importlib.util.find_spec(name)]
          if present:
              raise SystemExit(f"optional dependencies leaked into base artifact: {present}")
          PY
      - name: Verify every installed command renders help
        run: |
          PATH="$PWD/artifact-venv/bin:$PATH" \
            artifact-venv/bin/python scripts/ci/check_console_help.py \
              --pyproject pyproject.toml

  bundles:
    name: Produce, archive, and consume result bundles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install base package
        run: python -m pip install -e .
      - name: Produce deterministic smoke bundles
        run: |
          causal4d benchmark counterfactual \
            --output-dir build/bundles/counterfactual \
            --seeds 0 \
            --frames 18 \
            --training-repeats 1 \
            --parameter-grid-count 3
          causal4d benchmark latent-contact \
            --output-dir build/bundles/latent-contact \
            --seeds 0 \
            --frames 18 \
            --training-repeats 1 \
            --parameter-grid-count 3 \
            --contact-parameter-particles 4
      - name: Verify produced bundles
        run: |
          python scripts/ci/verify_result_bundle.py \
            build/bundles/counterfactual/manifest.json
          python scripts/ci/verify_result_bundle.py \
            build/bundles/latent-contact/manifest.json
      - name: Archive and consume bundles in a clean location
        run: |
          mkdir -p build/archives build/consumed
          tar -C build/bundles -czf build/archives/counterfactual.tar.gz counterfactual
          tar -C build/bundles -czf build/archives/latent-contact.tar.gz latent-contact
          tar -C build/consumed -xzf build/archives/counterfactual.tar.gz
          tar -C build/consumed -xzf build/archives/latent-contact.tar.gz
          python scripts/ci/verify_result_bundle.py \
            build/consumed/counterfactual/manifest.json
          python scripts/ci/verify_result_bundle.py \
            build/consumed/latent-contact/manifest.json
      - name: Upload smoke bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: result-bundle-smoke
          path: build/archives/*.tar.gz

  frozen-manifest:
    name: Frozen milestone manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate frozen inventory and checked-in checksums
        run: |
          python scripts/ci/verify_frozen_manifest.py \
            milestones/v0.3.0-causal4d-aip

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, core, pinned-bpt, build, installed-artifact, bundles, frozen-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist
      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
