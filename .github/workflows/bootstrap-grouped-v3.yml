name: Publish grouped normalized likelihood v3 on current main

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grouped-v3-current-main-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/grouped-v3-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the content-addressed publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and publish the exact current-main implementation
        env:
          BASE_SHA: a82f7ca093b71d1480e52e2b11b8b77c3b007620
          EXPECTED_TARGET_SHA: 4aa560ab74066c13efb5ae7d73102de4c244561e
          GH_TOKEN: ${{ github.token }}
          PATCH_BASE64_SHA256: 19aa47cd39ed18f993bc03fa24cd0466f31565dc4a735ff7030d59db33d89284
          PATCH_SHA256: 7cfb45840626a31a590d249fd2cfa3ab70c6b220188f458c6535a95dc83c55a9
          TARGET_BRANCH: agent/grouped-normalized-v3-review
        run: |
          set -euo pipefail

          remote_main="$(
            git ls-remote origin refs/heads/main | awk '{print $1}'
          )"
          remote_target="$(
            git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}'
          )"
          test "$remote_main" = "$BASE_SHA"
          test "$remote_target" = "$EXPECTED_TARGET_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

          cp .agent/grouped-v3-a82.patch.gz.b64 \
            "$RUNNER_TEMP/grouped-v3-a82.patch.gz.b64"
          echo "$PATCH_BASE64_SHA256  $RUNNER_TEMP/grouped-v3-a82.patch.gz.b64" | \
            sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/grouped-v3-a82.patch.gz.b64" > \
            "$RUNNER_TEMP/grouped-v3-a82.patch.gz"
          echo "$PATCH_SHA256  $RUNNER_TEMP/grouped-v3-a82.patch.gz" | \
            sha256sum --check --strict
          gzip --decompress --stdout \
            "$RUNNER_TEMP/grouped-v3-a82.patch.gz" > \
            "$RUNNER_TEMP/grouped-v3-a82.patch"

          git checkout -B "$TARGET_BRANCH" "$BASE_SHA"
          git apply --index --whitespace=error-all \
            "$RUNNER_TEMP/grouped-v3-a82.patch"

          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            docs/grouped_normalized_likelihood_v3.md \
            docs/structured_grouped_likelihood.md \
            src/causal4d/__init__.py \
            src/causal4d/cli/abduct_phystwin_intervention.py \
            src/causal4d/grouped_likelihood.py \
            src/causal4d/intervention_abduction.py \
            src/causal4d/observation_evidence.py \
            tests/test_factual_likelihood_semantics.py \
            tests/test_grouped_normalized_v3.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

          verify_postimage() {
            expected_blob="$1"
            path="$2"
            actual_blob="$(git hash-object "$path")"
            test "$actual_blob" = "$expected_blob"
          }
          verify_postimage \
            b60a5bed04cf5ebb18d53c42f2dc4589ce5050fc \
            docs/grouped_normalized_likelihood_v3.md
          verify_postimage \
            a37e80a14d836c5b0bb0e93a1b576fe2f343fd25 \
            docs/structured_grouped_likelihood.md
          verify_postimage \
            f3e3c60ba1659b07dbf5314fd5590250b0529dfc \
            src/causal4d/__init__.py
          verify_postimage \
            08c127d8d36595aa2eef8c332222716cdd26cd2f \
            src/causal4d/cli/abduct_phystwin_intervention.py
          verify_postimage \
            8e6bb0081201e080bf7717a8411fe1ad4912cde6 \
            src/causal4d/grouped_likelihood.py
          verify_postimage \
            9c006c00f07e793683e828a5b5a7ee93eedf5f7e \
            src/causal4d/intervention_abduction.py
          verify_postimage \
            6d92d8063e2123441a7f3a534a371ef5c46b2da7 \
            src/causal4d/observation_evidence.py
          verify_postimage \
            0f8ff6268326afdc4547e4b59f6003dffa7a1d5a \
            tests/test_factual_likelihood_semantics.py
          verify_postimage \
            031e110e3d04021607651b70f2f801b9cd1c1604 \
            tests/test_grouped_normalized_v3.py

          git diff --cached --check
          python -m compileall -q src tests

          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add grouped covariance-normalized likelihood v3" \
            -m "Rebase the opt-in grouped full-covariance normalized score onto registered-query structured factual abduction and the interventional-contrast API. Add contributor caps, reliability tempering, explicit likelihood power, source-covariance conditioning diagnostics, and invariant tests while preserving legacy defaults and the registered physical-study artifact identity."

          remote_main_after_build="$(
            git ls-remote origin refs/heads/main | awk '{print $1}'
          )"
          remote_target_after_build="$(
            git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}'
          )"
          test "$remote_main_after_build" = "$BASE_SHA"
          test "$remote_target_after_build" = "$EXPECTED_TARGET_SHA"

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push \
            --force origin "HEAD:refs/heads/$TARGET_BRANCH"
