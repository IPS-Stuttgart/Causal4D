name: Publish rebased grouped normalized likelihood v3

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: grouped-v3-rebased-publisher
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'agent/grouped-v3-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the content-addressed publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and publish the exact combined implementation
        env:
          BASE_SHA: de5116f0bd7e6c04c1ccd4af6b5f4cc8b089f65f
          EXPECTED_TARGET_SHA: de5116f0bd7e6c04c1ccd4af6b5f4cc8b089f65f
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA256: 4712e2415882409cc8b292d5c3addc1fa612de37b39f26d66d56c094f8299fb2
          TARGET_BRANCH: agent/grouped-normalized-v3
        run: |
          set -euo pipefail

          remote_main="$(
            git ls-remote origin refs/heads/main | awk '{print $1}'
          )"
          test "$remote_main" = "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"

          base64 --decode .agent/grouped-v3-rebased.patch.gz.b64 > \
            "$RUNNER_TEMP/grouped-v3-rebased.patch.gz"
          echo "$PATCH_SHA256  $RUNNER_TEMP/grouped-v3-rebased.patch.gz" | \
            sha256sum --check --strict
          gzip --decompress --stdout \
            "$RUNNER_TEMP/grouped-v3-rebased.patch.gz" > \
            "$RUNNER_TEMP/grouped-v3-rebased.patch"

          git checkout -B "$TARGET_BRANCH" "$BASE_SHA"
          git apply --index --whitespace=error-all \
            "$RUNNER_TEMP/grouped-v3-rebased.patch"

          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            docs/grouped_normalized_likelihood_v3.md \
            docs/structured_grouped_likelihood.md \
            src/causal4d/__init__.py \
            src/causal4d/cli/abduct_phystwin_intervention.py \
            src/causal4d/grouped_likelihood.py \
            src/causal4d/intervention_abduction.py \
            src/causal4d/observation_evidence.py \
            tests/test_factual_likelihood_semantics.py \
            tests/test_grouped_normalized_v3.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

          verify_postimage() {
            expected_blob="$1"
            path="$2"
            actual_blob="$(git hash-object "$path")"
            test "$actual_blob" = "$expected_blob"
          }
          verify_postimage \
            e61c3118fc42b151689814d19b05ddc4ce6c2505 \
            docs/grouped_normalized_likelihood_v3.md
          verify_postimage \
            0b3bccffa6701f21bdac06edea07fa87059196d6 \
            docs/structured_grouped_likelihood.md
          verify_postimage \
            94cf4810176ca842d3a0e266ebf06cc77e4dff9a \
            src/causal4d/__init__.py
          verify_postimage \
            08c127d8d36595aa2eef8c332222716cdd26cd2f \
            src/causal4d/cli/abduct_phystwin_intervention.py
          verify_postimage \
            8e6bb0081201e080bf7717a8411fe1ad4912cde6 \
            src/causal4d/grouped_likelihood.py
          verify_postimage \
            9c006c00f07e793683e828a5b5a7ee93eedf5f7e \
            src/causal4d/intervention_abduction.py
          verify_postimage \
            6d92d8063e2123441a7f3a534a371ef5c46b2da7 \
            src/causal4d/observation_evidence.py
          verify_postimage \
            0f8ff6268326afdc4547e4b59f6003dffa7a1d5a \
            tests/test_factual_likelihood_semantics.py
          verify_postimage \
            031e110e3d04021607651b70f2f801b9cd1c1604 \
            tests/test_grouped_normalized_v3.py

          git diff --cached --check
          python -m compileall -q src tests

          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add grouped covariance-normalized likelihood v3" \
            -m "Rebase the opt-in grouped full-covariance normalized score onto registered-query structured factual abduction. Add contributor caps, reliability tempering, explicit likelihood power, source-covariance conditioning diagnostics, and invariant tests while preserving legacy defaults and the registered physical-study artifact identity."

          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_TARGET_SHA" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
