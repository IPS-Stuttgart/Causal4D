name: Agent version 0.6 development bootstrap

on:
  push:
    branches:
      - agent/version-0-6-dev0-bootstrap-20260818

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Apply development-version transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = root / path
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one occurrence of {old!r}, found {count}'
                  )
              file_path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/causal4d/__init__.py',
              '__version__ = "0.5.0"',
              '__version__ = "0.6.0.dev0"',
          )
          replace_once('CITATION.cff', 'version: 0.5.0', 'version: 0.6.0.dev0')

          status_path = root / 'ci/project_status_v2.json'
          status = json.loads(status_path.read_text(encoding='utf-8'))
          current = status['packages']['causal4d']['required_version']
          if current != '0.5.0':
              raise SystemExit(f'unexpected active project-status version: {current!r}')
          status['packages']['causal4d']['required_version'] = '0.6.0.dev0'
          status_path.write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'tests/test_three_repository_project_status.py',
              'assert summary["versions"] == {"causal4d": "0.5.0"}',
              'assert summary["versions"] == {"causal4d": "0.6.0.dev0"}',
          )

          policy_path = root / 'tests/test_release_metadata_policy.py'
          policy = policy_path.read_text(encoding='utf-8')
          old = '''    if summary.unreleased_changes_present:\n        with pytest.raises(ReleaseMetadataError, match="empty Unreleased"):\n            inspect_repository(ROOT, tag=f"v{summary.package_version}")\n    elif summary.prerelease:\n        with pytest.raises(ReleaseMetadataError, match="cannot be published"):\n            inspect_repository(ROOT, tag=f"v{summary.package_version}")\n'''
          new = '''    if summary.prerelease:\n        with pytest.raises(ReleaseMetadataError, match="cannot be published"):\n            inspect_repository(ROOT, tag=f"v{summary.package_version}")\n    elif summary.unreleased_changes_present:\n        with pytest.raises(ReleaseMetadataError, match="empty Unreleased"):\n            inspect_repository(ROOT, tag=f"v{summary.package_version}")\n'''
          if policy.count(old) != 1:
              raise SystemExit('release-policy ordering block did not match exactly once')
          policy_path.write_text(policy.replace(old, new), encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## Unreleased\n\n'
          entry = (
              '### Changed\n\n'
              '- Mark post-0.5 development builds as `0.6.0.dev0` across package, citation,\n'
              '  and active project-status metadata. Development heads remain non-publishable\n'
              '  until the populated Unreleased section is curated into a final release.\n\n'
          )
          if entry not in changelog:
              if changelog.count(marker) != 1:
                  raise SystemExit('unexpected Unreleased heading count')
              changelog_path.write_text(
                  changelog.replace(marker, marker + entry, 1),
                  encoding='utf-8',
              )
          PY
          rm .github/workflows/agent-version-0-6-dev0-bootstrap.yml

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q -e '.[dev]'
          python3 -m pytest -q \
            tests/test_release_metadata_policy.py \
            tests/test_release_metadata_workflow_policy.py \
            tests/test_three_repository_project_status.py \
            tests/test_package_contract.py
          python3 scripts/ci/check_release_metadata.py \
            --root . \
            --output /tmp/release-metadata.json
          python3 -m ruff check \
            tests/test_release_metadata_policy.py \
            tests/test_three_repository_project_status.py
          python3 -m ruff format --check \
            tests/test_release_metadata_policy.py \
            tests/test_three_repository_project_status.py

      - name: Commit validated change and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            CHANGELOG.md \
            CITATION.cff \
            ci/project_status_v2.json \
            src/causal4d/__init__.py \
            tests/test_release_metadata_policy.py \
            tests/test_three_repository_project_status.py \
            .github/workflows/agent-version-0-6-dev0-bootstrap.yml
          git commit -m 'Mark main as 0.6.0 development'
          git push origin HEAD
