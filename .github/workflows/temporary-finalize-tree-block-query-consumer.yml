name: Temporary finalize tree-block query consumer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-finalize-tree-block-query-consumer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/tree-block-query-provider-consumer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Verify exact reviewed head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"

      - name: Finalize contracts, tests and quality registration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fixture = Path('tests/test_tree_block_belief_query.py')
          text = fixture.read_text(encoding='utf-8')
          old = '        replace(valid, covariance=np.asarray([[1.0 + 0.0j]]))\n'
          new = (
              '        replace(\n'
              '            valid,\n'
              '            covariance=np.asarray([[1.0 + 0.0j]]),\n'
              '            row_labels=("x",),\n'
              '            output_units=("m",),\n'
              '        )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('complex covariance fixture target changed')
          fixture.write_text(text.replace(old, new), encoding='utf-8')

          integration = Path(
              'tests/test_bpt_tree_block_query_provider_integration.py'
          )
          text = integration.read_text(encoding='utf-8')
          old = '''def _require_provider_installation() -> None:
              if importlib.util.find_spec("bayesian_phystwin") is not None:
                  return
              if os.environ.get(_REQUIRE_ENV) == "1":
                  pytest.fail("the required BayesianPhysTwin provider is not installed")
              pytest.skip("BayesianPhysTwin is not installed in the core-only environment")
          '''
          new = '''def _require_provider_installation() -> None:
              module = "bayesian_phystwin.causal4d_tree_block_provider_v1"
              try:
                  available = importlib.util.find_spec(module) is not None
              except ModuleNotFoundError:
                  available = False
              if available:
                  return
              if os.environ.get(_REQUIRE_ENV) == "1":
                  pytest.fail("the required BayesianPhysTwin provider is not installed")
              pytest.skip("the tree-block query provider is not installed")
          '''
          if text.count(old) != 1:
              raise SystemExit('integration preflight target changed')
          integration.write_text(text.replace(old, new), encoding='utf-8')

          replacements = {
              '.github/workflows/ci.yml': (
                  '            src/causal4d/provider_contract.py \\\n'
                  '            src/causal4d/replay_provider_contract.py',
                  '            src/causal4d/provider_contract.py \\\n'
                  '            src/causal4d/tree_block_query_provider_contract.py \\\n'
                  '            src/causal4d/tree_block_belief_query.py \\\n'
                  '            src/causal4d/replay_provider_contract.py',
              ),
              '.github/workflows/merge-gate.yml': (
                  '            src/causal4d/belief_provider_v2_contract.py \\\n'
                  '            src/causal4d/replay_provider_contract.py',
                  '            src/causal4d/belief_provider_v2_contract.py \\\n'
                  '            src/causal4d/tree_block_query_provider_contract.py \\\n'
                  '            src/causal4d/tree_block_belief_query.py \\\n'
                  '            src/causal4d/replay_provider_contract.py',
              ),
              '.github/workflows/exact-head-validation.yml': (
                  '            src/causal4d/belief_provider_v2_contract.py \\\n'
                  '            src/causal4d/replay_provider_contract.py',
                  '            src/causal4d/belief_provider_v2_contract.py \\\n'
                  '            src/causal4d/tree_block_query_provider_contract.py \\\n'
                  '            src/causal4d/tree_block_belief_query.py \\\n'
                  '            src/causal4d/replay_provider_contract.py',
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'quality registration target changed: {name}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = (
              '- Add a registered Causal4D consumer for strict claim-bearing '
              'tree-block\n'
              '  posterior queries, including independent provider/result '
              'revalidation,\n'
              '  immutable query covariance, and an exact installed-wheel '
              'provider pin.\n'
          )
          anchor = '### Added\n\n'
          if entry not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('changelog Added anchor changed')
              text = text.replace(anchor, anchor + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          Path(
              '.github/workflows/'
              'temporary-finalize-tree-block-query-consumer.yml'
          ).unlink()
          PY

          python -m pip install --disable-pip-version-check --no-cache-dir -e ".[dev]"
          files=(
            src/causal4d/tree_block_query_provider_contract.py
            src/causal4d/tree_block_belief_query.py
            tests/test_tree_block_query_provider_contract.py
            tests/test_tree_block_belief_query.py
            tests/test_bpt_tree_block_query_provider_integration.py
            tests/test_tree_block_query_provider_workflow_policy.py
            tests/test_bpt_provider_registry.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m mypy --python-version 3.12 \
            src/causal4d/tree_block_query_provider_contract.py \
            src/causal4d/tree_block_belief_query.py
          python -m pytest -q \
            tests/test_tree_block_query_provider_contract.py \
            tests/test_tree_block_belief_query.py \
            tests/test_bpt_tree_block_query_provider_integration.py \
            tests/test_tree_block_query_provider_workflow_policy.py \
            tests/test_bpt_provider_registry.py \
            tests/test_bpt_provider_import_boundary.py
          python -m compileall -q src tests scripts
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize tree-block query provider consumer'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
