name: Fix Deform360 point-cloud pilot verification

on:
  push:
    branches:
      - fix/deform360-pcd-pilot-verification-v3
    paths:
      - "ops/fix-deform360-pcd-pilot-verification-request.json"

permissions:
  contents: write

concurrency:
  group: fix-deform360-pcd-pilot-verification-v3
  cancel-in-progress: false

jobs:
  patch:
    name: Correct verification ordering and advance request identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/deform360-pcd-pilot-verification-v3
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Apply the bounded operational patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          workflow_path = Path(
              ".github/workflows/deform360-official-pcd-source-pilot.yml"
          )
          workflow = workflow_path.read_text(encoding="utf-8")
          clean_check = (
              '          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"\n'
              '          test -z "$(git status --porcelain=v1)"\n'
              "          /usr/bin/python3 - <<'PY'\n"
          )
          replacement = (
              '          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"\n'
              "          /usr/bin/python3 - <<'PY'\n"
          )
          if workflow.count(clean_check) != 1:
              raise SystemExit("expected exactly one post-initialization clean-worktree check")
          workflow = workflow.replace(clean_check, replacement, 1)

          old_request_id = (
              "2026-08-30-gpuserver4090-official-pcd-source-pilot-v2"
          )
          new_request_id = (
              "2026-08-31-gpuserver4090-official-pcd-source-pilot-v3"
          )
          if workflow.count(old_request_id) != 1:
              raise SystemExit("workflow request identity is not the reviewed v2 value")
          workflow = workflow.replace(old_request_id, new_request_id, 1)

          mismatch = (
              '          if request != expected:\n'
              '              raise SystemExit("source-pilot request differs from the reviewed value")\n'
          )
          mismatch_replacement = (
              '          if request != expected:\n'
              '              print(\n'
              '                  json.dumps(\n'
              '                      {"actual": request, "expected": expected},\n'
              '                      indent=2,\n'
              '                      sort_keys=True,\n'
              '                  )\n'
              '              )\n'
              '              raise SystemExit("source-pilot request differs from the reviewed value")\n'
          )
          if workflow.count(mismatch) != 1:
              raise SystemExit("request mismatch guard changed unexpectedly")
          workflow = workflow.replace(mismatch, mismatch_replacement, 1)
          workflow_path.write_text(workflow, encoding="utf-8")

          request_path = Path("ops/deform360-official-pcd-source-pilot-request.json")
          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("request_id") != old_request_id:
              raise SystemExit("request file is not the reviewed v2 request")
          request["request_id"] = new_request_id
          request_path.write_text(
              json.dumps(request, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path("ops/deform360-official-pcd-source-pilot-request.json").read_text(
                  encoding="utf-8"
              )
          )
          assert request["request_id"].endswith("source-pilot-v3")
          workflow = Path(
              ".github/workflows/deform360-official-pcd-source-pilot.yml"
          ).read_text(encoding="utf-8")
          assert request["request_id"] in workflow
          PY

          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            .github/workflows/deform360-official-pcd-source-pilot.yml
            ops/deform360-official-pcd-source-pilot-request.json
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected patch diff: %s\n' "${changed[*]}" >&2
            exit 1
          fi

      - name: Commit the bounded operational fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/deform360-official-pcd-source-pilot.yml \
            ops/deform360-official-pcd-source-pilot-request.json
          git commit -m 'Correct the Deform360 pilot verification ordering'
          git push origin HEAD:fix/deform360-pcd-pilot-verification-v3
