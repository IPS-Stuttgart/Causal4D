name: Fix Deform360 official point-cloud pilot typing

on:
  push:
    branches:
      - science/deform360-official-pcd-source-pilot-v1
    paths:
      - "ops/fix-deform360-official-pcd-pilot-typing-request.json"

permissions:
  contents: write

concurrency:
  group: fix-deform360-official-pcd-pilot-typing
  cancel-in-progress: false

jobs:
  fix:
    name: Narrow validated optional values
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-official-pcd-source-pilot-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Apply exact typing patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/causal4d_public/deform360_official_pcd_pilot.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''    match = _FRAME_PATTERN.search(Path(name).stem)\n    _require(match is not None, f"point-cloud member lacks a frame index: {name}")\n    return int(match.group(1))\n''',
                  '''    match = _FRAME_PATTERN.search(Path(name).stem)\n    if match is None:\n        raise ValueError(f"point-cloud member lacks a frame index: {name}")\n    return int(match.group(1))\n''',
              ),
              (
                  '''        _require(members, f"archive contains no NPZ point-cloud frames: {path}")\n''',
                  '''        if not members:\n            raise ValueError(f"archive contains no NPZ point-cloud frames: {path}")\n''',
              ),
              (
                  '''            extracted = archive.extractfile(member)\n            _require(\n                extracted is not None,\n                f"failed to read archive member: {member.name}",\n            )\n            raw = extracted.read()\n''',
                  '''            extracted = archive.extractfile(member)\n            if extracted is None:\n                raise ValueError(f"failed to read archive member: {member.name}")\n            raw = extracted.read()\n''',
              ),
              (
                  '''    boundary = payload.get("information_boundary")\n    _require(isinstance(boundary, Mapping), "result boundary is missing")\n    _require(\n        boundary.get("source_only") is True\n''',
                  '''    boundary_raw = payload.get("information_boundary")\n    _require(isinstance(boundary_raw, Mapping), "result boundary is missing")\n    boundary = cast(Mapping[str, Any], boundary_raw)\n    _require(\n        boundary.get("source_only") is True\n''',
              ),
              (
                  '''    episodes = payload.get("episode_records")\n    _require(\n        isinstance(episodes, list) and len(episodes) >= 3,\n        "episode records are missing",\n    )\n    episode_ids = [\n        record.get("episode_id") for record in episodes if isinstance(record, Mapping)\n    ]\n''',
                  '''    episodes_raw = payload.get("episode_records")\n    _require(\n        isinstance(episodes_raw, list) and len(episodes_raw) >= 3,\n        "episode records are missing",\n    )\n    episodes = cast(list[Any], episodes_raw)\n    episode_ids = [\n        record.get("episode_id") for record in episodes if isinstance(record, Mapping)\n    ]\n''',
              ),
              (
                  '''    dataset = payload.get("dataset")\n    _require(isinstance(dataset, Mapping), "dataset record is missing")\n    _require(\n        episode_ids == dataset.get("source_episode_ids"),\n''',
                  '''    dataset_raw = payload.get("dataset")\n    _require(isinstance(dataset_raw, Mapping), "dataset record is missing")\n    dataset = cast(Mapping[str, Any], dataset_raw)\n    _require(\n        episode_ids == dataset.get("source_episode_ids"),\n''',
              ),
              (
                  '''    _require(\n        payload.get("decision", {}).get("paper_claim_authorized") is False,\n        "pilot result authorized a paper claim",\n    )\n''',
                  '''    decision_raw = payload.get("decision")\n    _require(isinstance(decision_raw, Mapping), "decision record is missing")\n    decision = cast(Mapping[str, Any], decision_raw)\n    _require(\n        decision.get("paper_claim_authorized") is False,\n        "pilot result authorized a paper claim",\n    )\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"typing patch expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and commit patch
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          files=(
            scripts/remote/run_deform360_official_pcd_pilot.py
            src/causal4d_public/deform360_official_pcd_pilot.py
            tests/test_deform360_official_pcd_pilot.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            scripts/remote/run_deform360_official_pcd_pilot.py \
            src/causal4d_public/deform360_official_pcd_pilot.py
          python -m pytest -q tests/test_deform360_official_pcd_pilot.py
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(src/causal4d_public/deform360_official_pcd_pilot.py)
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected typing-fix diff: %s\n' "${changed[*]}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/causal4d_public/deform360_official_pcd_pilot.py
          git commit -m 'Narrow validated Deform360 pilot values'
          git push origin HEAD:science/deform360-official-pcd-source-pilot-v1
