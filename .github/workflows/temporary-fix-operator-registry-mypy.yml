name: Apply exact operator-registry typing fix

on:
  push:
    branches:
      - agent/seal-operator-registry-workstation2

permissions:
  contents: write

concurrency:
  group: temporary-fix-operator-registry-mypy
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/seal-operator-registry-workstation2
          fetch-depth: 1

      - name: Apply the reviewed narrowing fix and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/ci/seal_self_hosted_operator_registry.py)" = \
            "3684d1baea7bfc3e41c8294a51a0357edac3dcfe"
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/ci/seal_self_hosted_operator_registry.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assignments = private_roster.get("assignments")
              _require(isinstance(assignments, list), "private operator assignments are missing")
              records: list[dict[str, Any]] = []
              for index, value in enumerate(assignments):
                  _require(isinstance(value, Mapping), f"private assignment {index} is invalid")
                  assignment = dict(cast(Mapping[str, Any], value))
                  operator_id = assignment.get("operator_id")
                  principal = assignment.get("canonical_principal")
                  roles = assignment.get("roles")
                  _require(isinstance(operator_id, str), "private operator id is invalid")
                  _require(isinstance(principal, str), "private principal is invalid")
                  _require(
                      isinstance(roles, list) and all(isinstance(role, str) for role in roles),
                      "private operator roles are invalid",
                  )
                  records.append(
                      {
                          "operator_id": operator_id,
                          "person_identity_sha256": _person_digest(secret, principal),
                          "active": True,
                          "roles": sorted(roles),
                      }
                  )
          '''.replace("          ", "")
          new = '''    assignments_value = private_roster.get("assignments")
              _require(
                  isinstance(assignments_value, list),
                  "private operator assignments are missing",
              )
              assignments = cast(list[Any], assignments_value)
              records: list[dict[str, Any]] = []
              for index, value in enumerate(assignments):
                  _require(isinstance(value, Mapping), f"private assignment {index} is invalid")
                  assignment = dict(cast(Mapping[str, Any], value))
                  operator_id_value = assignment.get("operator_id")
                  principal_value = assignment.get("canonical_principal")
                  roles_value = assignment.get("roles")
                  _require(
                      isinstance(operator_id_value, str),
                      "private operator id is invalid",
                  )
                  _require(
                      isinstance(principal_value, str),
                      "private principal is invalid",
                  )
                  _require(
                      isinstance(roles_value, list)
                      and all(isinstance(role, str) for role in roles_value),
                      "private operator roles are invalid",
                  )
                  operator_id = cast(str, operator_id_value)
                  principal = cast(str, principal_value)
                  roles = cast(list[str], roles_value)
                  records.append(
                      {
                          "operator_id": operator_id,
                          "person_identity_sha256": _person_digest(secret, principal),
                          "active": True,
                          "roles": sorted(roles),
                      }
                  )
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("reviewed operator-record block was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/temporary-fix-operator-registry-mypy.yml
          git diff --check
          python -m compileall -q \
            scripts/ci/seal_self_hosted_operator_registry.py \
            tests/test_self_hosted_operator_registry_seal.py \
            tests/test_operator_registry_seal_workflow.py
          python -m pip install "mypy>=1.11"
          python -m mypy --python-version 3.12 \
            scripts/ci/seal_self_hosted_operator_registry.py
          git diff --name-only | LC_ALL=C sort > /tmp/actual-files
          printf '%s\n' \
            scripts/ci/seal_self_hosted_operator_registry.py \
            .github/workflows/temporary-fix-operator-registry-mypy.yml \
            | LC_ALL=C sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files

      - name: Commit and push only the product fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/ci/seal_self_hosted_operator_registry.py \
            .github/workflows/temporary-fix-operator-registry-mypy.yml
          git commit -m "Narrow validated operator roster values"
          git push origin HEAD:agent/seal-operator-registry-workstation2
