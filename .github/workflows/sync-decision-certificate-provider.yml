name: Synchronize decision certificate provider

on:
  push:
    branches:
      - feature/decision-identifiable-intervention-v1
    paths:
      - .github/workflows/sync-decision-certificate-provider.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/decision-identifiable-intervention-v1
          persist-credentials: true
      - name: Register the versioned certificate and advance the pinned provider
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          old = "573ecd9b09a8145b680738c5e5f36415feefbfe3"
          new = "754a2a97a4a10369ad15236d84f4d2a81c454055"
          for name in (
              ".github/workflows/merge-gate.yml",
              ".github/workflows/ci.yml",
              "requirements/ci/bayesian-phystwin-provider-v1.sha",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one old BayesianPhysTwin pin in {name}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          registry_path = Path("ci/bayesian_phystwin_provider_registry.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          module = "bayesian_phystwin.query_decision_certificate_v1"
          entries = registry["modules"]
          matches = [entry for entry in entries if entry.get("module") == module]
          if matches:
              raise SystemExit("query decision certificate is already registered")
          entries.append(
              {
                  "module": module,
                  "api_version": 1,
                  "role": "exact_query_quotient_decision_certificate",
                  "lifecycle": "production_additive",
                  "local_contract_module": (
                      "causal4d.decision_identifiable_intervention"
                  ),
              }
          )
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/merge-gate.yml \
            .github/workflows/ci.yml \
            requirements/ci/bayesian-phystwin-provider-v1.sha \
            ci/bayesian_phystwin_provider_registry.json
          git diff --cached --check
          git commit -m "Register decision certificate provider and advance integration pin"
          git push origin HEAD:feature/decision-identifiable-intervention-v1
