name: Contact-prefix correlation diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/contact-prefix-correlation.yml"
      - "docs/contact_prefix_correlation.md"
      - "scripts/ci/run_contact_correlation_diagnostic.py"
      - "src/causal4d/contact_correlation_diagnostic.py"
      - "tests/test_contact_correlation_diagnostic.py"
      - "tests/test_contact_correlation_workflow_policy.py"
  workflow_dispatch:
    inputs:
      seeds:
        description: Untouched diagnostic seed range
        required: false
        default: "300:320"
        type: string
      frame_block_sizes:
        description: Predeclared temporal block sizes
        required: false
        default: "2,3,4"
        type: string
      whitening_shrinkages:
        description: Source-only correlation shrinkage grid
        required: false
        default: "0.10,0.25,0.50,0.75"
        type: string
      generalized_bayes_rates:
        description: Source-only likelihood learning-rate grid
        required: false
        default: "0.25,0.50,0.75,1.00"
        type: string

permissions:
  contents: read

concurrency:
  group: contact-prefix-correlation-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  DIAGNOSTIC_SEEDS: ${{ inputs.seeds || '300:320' }}
  FRAME_BLOCK_SIZES: ${{ inputs.frame_block_sizes || '2,3,4' }}
  WHITENING_SHRINKAGES: ${{ inputs.whitening_shrinkages || '0.10,0.25,0.50,0.75' }}
  GENERALIZED_BAYES_RATES: ${{ inputs.generalized_bayes_rates || '0.25,0.50,0.75,1.00' }}

jobs:
  evaluate:
    name: Fresh-panel source-only correlation evaluation
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install diagnostic environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
          mkdir -p outputs/contact-prefix-correlation
          python -m pip freeze --all \
            > outputs/contact-prefix-correlation/pip-freeze.txt
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "seeds=${DIAGNOSTIC_SEEDS}"
            echo "frame_block_sizes=${FRAME_BLOCK_SIZES}"
            echo "whitening_shrinkages=${WHITENING_SHRINKAGES}"
            echo "generalized_bayes_rates=${GENERALIZED_BAYES_RATES}"
            uname -a
          } > outputs/contact-prefix-correlation/environment.txt

      - name: Validate correlation contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check \
            src/causal4d/contact_correlation_diagnostic.py \
            scripts/ci/run_contact_correlation_diagnostic.py \
            tests/test_contact_correlation_diagnostic.py \
            tests/test_contact_correlation_workflow_policy.py
          python -m ruff format --check \
            src/causal4d/contact_correlation_diagnostic.py \
            scripts/ci/run_contact_correlation_diagnostic.py \
            tests/test_contact_correlation_diagnostic.py \
            tests/test_contact_correlation_workflow_policy.py
          python -m pytest -q \
            tests/test_contact_correlation_diagnostic.py \
            tests/test_contact_correlation_workflow_policy.py \
            tests/test_causal4d_contact_evaluation.py \
            tests/test_probability_support_invariants.py

      - name: Run untouched source-only comparison
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/run_contact_correlation_diagnostic.py \
            --output-dir outputs/contact-prefix-correlation/results \
            --seeds "${DIAGNOSTIC_SEEDS}" \
            --frame-block-sizes "${FRAME_BLOCK_SIZES}" \
            --whitening-shrinkages "${WHITENING_SHRINKAGES}" \
            --generalized-bayes-rates "${GENERALIZED_BAYES_RATES}" \
            | tee outputs/contact-prefix-correlation/console.json

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Contact-prefix correlation diagnostic"
            echo
            echo "- Runner: \`${RUNNER_NAME}\` (GitHub-hosted CPU)"
            echo "- Fresh seeds: \`${DIAGNOSTIC_SEEDS}\`"
            echo "- Pip download cache: enabled"
            if [[ -f outputs/contact-prefix-correlation/results/contact-correlation-diagnostic.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "outputs/contact-prefix-correlation/results/"
              "contact-correlation-diagnostic.json"
          )
          result = json.loads(path.read_text(encoding="utf-8"))
          for row in result["decision"]:
              print(
                  f"- {row['policy']}: "
                  f"promotion_candidate={row['promotion_candidate']}, "
                  f"interpretation={row['interpretation']}"
              )
          print(
              "- Any candidate meeting the joint rule: "
              f"{result['any_promotion_candidate']}"
          )
          PY
            else
              echo "- Diagnostic stopped before producing its summary."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: contact-prefix-correlation-${{ github.run_id }}
          path: outputs/contact-prefix-correlation/
          if-no-files-found: error
          retention-days: 30
