name: Causal4D merge gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  merge-gate:
    name: Causal4D merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pull-request merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record tested merge and head revisions
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          actual_merge_sha="$(git rev-parse HEAD)"
          test "$actual_merge_sha" = "$EXPECTED_MERGE_SHA"
          echo "Tested merge revision: $actual_merge_sha"
          if [[ -n "$PR_HEAD_SHA" ]]; then
            echo "Pull-request head revision: $PR_HEAD_SHA"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run repository quality checks
        run: |
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-syntax-cache" \
            python -W error::SyntaxWarning -m compileall -q -f src tests scripts
          python -m ruff check .
          python -m mypy --python-version 3.12 \
            scripts/ci \
            src/causal4d/atomic_io.py \
            src/causal4d/result_bundle_publication.py \
            src/causal4d/trusted_pickle.py \
            src/causal4d/immutable_array.py \
            src/causal4d/immutable_json.py \
            src/causal4d/provider_contract.py \
            src/causal4d/belief_provider_v2_contract.py \
            src/causal4d/replay_provider_contract.py

      - name: Run the complete default test suite
        run: python -m pytest --junitxml=pytest-merge-gate.xml

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Check out pinned Bayesian-PhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: 573ecd9b09a8145b680738c5e5f36415feefbfe3
          path: _bpt
          persist-credentials: false

      - name: Build installed-wheel integration pair
        run: |
          wheelhouse="$RUNNER_TEMP/merge-gate-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m build --wheel --outdir "$wheelhouse" .
          python -m build --wheel --outdir "$wheelhouse" ./_bpt
          test "$(find "$wheelhouse" -maxdepth 1 -name '*.whl' | wc -l)" -eq 2

      - name: Install integration pair in an isolated environment
        run: |
          wheelhouse="$RUNNER_TEMP/merge-gate-wheelhouse"
          venv="$RUNNER_TEMP/merge-gate-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --upgrade pip
          "$venv/bin/python" -m pip install "$wheelhouse"/*.whl pytest
          "$venv/bin/python" -m pip check

      - name: Run pinned-provider integration tests
        env:
          CAUSAL4D_REQUIRE_BPT_PROVIDER: "1"
        run: |
          "$RUNNER_TEMP/merge-gate-venv/bin/python" \
            scripts/ci/run_bpt_integration_tests.py

  publish-grouped-v3:
    name: Publish grouped-v3 implementation branch
    if: github.event.pull_request.head.ref == 'agent/grouped-v3-bootstrap'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the verified bootstrap ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch \
            --no-tags origin \
            "refs/heads/$HEAD_REF:refs/remotes/origin/bootstrap" \
            "refs/heads/main:refs/remotes/origin/main"
          git checkout --detach refs/remotes/origin/bootstrap

      - name: Verify content-addressed patch and publish clean branch
        env:
          BASE_SHA: 70b5e630c50b1a3702e1b5dc2d0309f530973c7d
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA256: d657c132d8bd0515f2ed5bb33fcf96e8ba1ea33e8db0a112d74537f51f83dfd3
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: agent/grouped-normalized-v3
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          echo "$PATCH_SHA256  .agent/grouped-v3.patch.gz" | \
            sha256sum --check --strict
          gzip --decompress --stdout .agent/grouped-v3.patch.gz > \
            "$RUNNER_TEMP/grouped-v3.patch"

          git checkout -B "$TARGET_BRANCH" "$BASE_SHA"
          git apply --check --whitespace=error-all \
            "$RUNNER_TEMP/grouped-v3.patch"
          git apply --index --whitespace=error-all \
            "$RUNNER_TEMP/grouped-v3.patch"
          git diff --cached --check
          python -m compileall -q src tests

          actual="$(git diff --cached --name-only | LC_ALL=C sort)"
          expected="$(cat <<'EOF'
docs/grouped_normalized_likelihood_v3.md
docs/structured_grouped_likelihood.md
src/causal4d/__init__.py
src/causal4d/cli/abduct_phystwin_intervention.py
src/causal4d/grouped_likelihood.py
src/causal4d/intervention_abduction.py
src/causal4d/observation_evidence.py
tests/test_factual_likelihood_semantics.py
tests/test_grouped_normalized_v3.py
EOF
)"
          test "$actual" = "$expected"

          git config user.name github-actions[bot]
          git config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add grouped covariance-normalized likelihood v3" \
            -m "Add an opt-in grouped full-covariance normalized score with contributor caps, reliability tempering, explicit likelihood power, source-covariance conditioning diagnostics, and invariant tests. Preserve legacy semantics and the registered physical-study artifact identity."
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push \
            --force-with-lease origin "HEAD:refs/heads/$TARGET_BRANCH"
