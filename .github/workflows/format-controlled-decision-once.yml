# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Format controlled decision files once

on:
  push:
    branches:
      - feature/controlled-decision-identification-v1
    paths:
      - ".github/workflows/format-controlled-decision-once.yml"

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/controlled-decision-identification-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format, validate, and remove this workflow
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            pytest==8.4.2 \
            ruff==0.16.5
          files=(
            src/causal4d/controlled_decision_identification.py
            tests/test_controlled_decision_identification.py
            scripts/experiments/controlled_decision_identification.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          pytest -q \
            tests/test_controlled_decision_identification.py \
            tests/test_sequential_decision_identification.py \
            tests/test_probe_quotient_audit.py
          mkdir -p build/controlled-decision-identification
          python scripts/experiments/controlled_decision_identification.py \
            --output build/controlled-decision-identification/result-a.json
          python scripts/experiments/controlled_decision_identification.py \
            --output build/controlled-decision-identification/result-b.json
          cmp \
            build/controlled-decision-identification/result-a.json \
            build/controlled-decision-identification/result-b.json
          git rm .github/workflows/format-controlled-decision-once.yml
          mapfile -t changed < <(git status --short | sed -E 's/^...//')
          for path in "${changed[@]}"; do
            case "$path" in
              src/causal4d/controlled_decision_identification.py|tests/test_controlled_decision_identification.py|scripts/experiments/controlled_decision_identification.py|.github/workflows/format-controlled-decision-once.yml)
                ;;
              *)
                echo "unexpected changed path: $path" >&2
                exit 1
                ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format and validate controlled decision-identification files"
          git push origin HEAD:feature/controlled-decision-identification-v1
