name: Fix Tracking Cloth type aliases

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-tracking-cloth-type-alias-pr.yml"
      - "src/causal4d_public/tracking_cloth_query_observation.py"

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'science/tracking-cloth-task-observation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Declare NumPy aliases explicitly and push only the focused module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/causal4d_public/tracking_cloth_query_observation.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from typing import Any, Iterable\n'
          new_import = 'from typing import Any, Iterable, TypeAlias\n'
          old_aliases = (
              'FloatArray = NDArray[np.float64]\n'
              'IntArray = NDArray[np.int64]\n'
          )
          new_aliases = (
              'FloatArray: TypeAlias = NDArray[np.float64]\n'
              'IntArray: TypeAlias = NDArray[np.int64]\n'
          )
          if text.count(old_import) != 1:
              raise SystemExit('typing import preimage changed')
          if text.count(old_aliases) != 1:
              raise SystemExit('array alias preimage changed')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_aliases, new_aliases, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/causal4d_public/tracking_cloth_query_observation.py
          git commit -m 'Declare Tracking Cloth NumPy array aliases explicitly'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
