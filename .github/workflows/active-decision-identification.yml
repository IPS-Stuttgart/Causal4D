name: Active decision identification

on:
  pull_request:
    paths:
      - ".github/workflows/active-decision-identification.yml"
      - "src/causal4d/active_decision_identification.py"
      - "src/causal4d/sequential_decision_identification.py"
      - "tests/test_active_decision_identification.py"
      - "tests/test_sequential_decision_identification.py"
      - "scripts/experiments/active_decision_identification.py"
      - "scripts/experiments/sequential_decision_identification.py"
      - "docs/active_decision_identification.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/active-decision-identification.yml"
      - "src/causal4d/active_decision_identification.py"
      - "src/causal4d/sequential_decision_identification.py"
      - "tests/test_active_decision_identification.py"
      - "tests/test_sequential_decision_identification.py"
      - "scripts/experiments/active_decision_identification.py"
      - "scripts/experiments/sequential_decision_identification.py"
      - "docs/active_decision_identification.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: active-decision-identification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            pytest==8.4.2 \
            ruff==0.16.5

      - name: Format only the registered decision files
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          files=(
            scripts/experiments/active_decision_identification.py
            scripts/experiments/sequential_decision_identification.py
            src/causal4d/sequential_decision_identification.py
            tests/test_sequential_decision_identification.py
          )
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            allowed=false
            for expected in "${files[@]}"; do
              if test "$path" = "$expected"; then
                allowed=true
              fi
            done
            test "$allowed" = true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "Format sequential decision-identification files"
            git push origin HEAD:"$HEAD_REF"
          fi

      - name: Lint and verify formatting
        run: |
          python -m ruff check \
            src/causal4d/active_decision_identification.py \
            src/causal4d/sequential_decision_identification.py \
            tests/test_active_decision_identification.py \
            tests/test_sequential_decision_identification.py \
            scripts/experiments/active_decision_identification.py \
            scripts/experiments/sequential_decision_identification.py
          python -m ruff format --check \
            src/causal4d/active_decision_identification.py \
            src/causal4d/sequential_decision_identification.py \
            tests/test_active_decision_identification.py \
            tests/test_sequential_decision_identification.py \
            scripts/experiments/active_decision_identification.py \
            scripts/experiments/sequential_decision_identification.py

      - name: Run focused tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_active_decision_identification.py \
            tests/test_sequential_decision_identification.py

      - name: Execute deterministic mechanism studies twice
        env:
          PYTHONPATH: src
        run: |
          mkdir -p build/active-decision-identification
          python scripts/experiments/active_decision_identification.py \
            --output build/active-decision-identification/one-step-a.json
          python scripts/experiments/active_decision_identification.py \
            --output build/active-decision-identification/one-step-b.json
          cmp \
            build/active-decision-identification/one-step-a.json \
            build/active-decision-identification/one-step-b.json
          python scripts/experiments/sequential_decision_identification.py \
            --output build/active-decision-identification/sequential-a.json
          python scripts/experiments/sequential_decision_identification.py \
            --output build/active-decision-identification/sequential-b.json
          cmp \
            build/active-decision-identification/sequential-a.json \
            build/active-decision-identification/sequential-b.json
          python -m json.tool \
            build/active-decision-identification/one-step-a.json >/dev/null
          python -m json.tool \
            build/active-decision-identification/sequential-a.json >/dev/null

      - name: Upload deterministic results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: active-decision-identification-${{ github.sha }}
          path: |
            build/active-decision-identification/one-step-a.json
            build/active-decision-identification/sequential-a.json
          if-no-files-found: error
          retention-days: 30
