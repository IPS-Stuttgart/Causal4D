name: One-shot format independent-sensor attribution

on:
  push:
    branches:
      - agent/independent-sensor-attribution-v1

permissions:
  contents: write

concurrency:
  group: one-shot-format-independent-sensor-attribution
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/independent-sensor-attribution-v1
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply repository formatter
        run: |
          python -m pip install 'ruff==0.16.2'
          python -m ruff format \
            src/causal4d/independent_sensor_ablation.py \
            tests/test_independent_sensor_ablation.py
          python -m ruff format --check \
            src/causal4d/independent_sensor_ablation.py \
            tests/test_independent_sensor_ablation.py
          git diff --check
      - name: Commit formatting result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/causal4d/independent_sensor_ablation.py \
            tests/test_independent_sensor_ablation.py
          if git diff --cached --quiet; then
            echo 'No formatting changes were needed.'
            exit 0
          fi
          git commit -m 'Apply Ruff formatting to sensor attribution diagnostics'
          git push origin HEAD:agent/independent-sensor-attribution-v1
