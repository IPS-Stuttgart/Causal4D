name: Format PR 337

on:
  push:
    branches: [agent/interventional-contrast-scm-v1]

permissions:
  contents: write

concurrency:
  group: format-pr337
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/interventional-contrast-scm-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Apply the exact CI formatter delta and remove this helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.2'
          python -m ruff format \
            src/causal4d/_interventional_contrast_build.py \
            src/causal4d/_interventional_contrast_common.py \
            src/causal4d/_interventional_contrast_posterior.py \
            tests/test_interventional_contrast.py
          rm -- .github/workflows/format-pr337.yml
          git diff --check

          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/workflows/format-pr337.yml \
            src/causal4d/_interventional_contrast_build.py \
            src/causal4d/_interventional_contrast_common.py \
            src/causal4d/_interventional_contrast_posterior.py \
            tests/test_interventional_contrast.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            .github/workflows/format-pr337.yml \
            src/causal4d/_interventional_contrast_build.py \
            src/causal4d/_interventional_contrast_common.py \
            src/causal4d/_interventional_contrast_posterior.py \
            tests/test_interventional_contrast.py
          git commit -m "Apply canonical Ruff formatting"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push \
            origin HEAD:refs/heads/agent/interventional-contrast-scm-v1
