name: One-shot fix posterior-scoring quality

on:
  push:
    branches:
      - fix/posterior-scoring-quality-current-main

permissions:
  contents: write

concurrency:
  group: one-shot-fix-posterior-scoring-quality
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/posterior-scoring-quality-current-main
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Replace reversible array freezing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/causal4d/_posterior_scoring_contracts.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'import numpy as np\n\n\nPOSTERIOR_SCORE_SCHEMA_VERSION = 1\n'
          import_replacement = (
              'import numpy as np\n\n'
              'from causal4d.immutable_array import readonly_array\n\n\n'
              'POSTERIOR_SCORE_SCHEMA_VERSION = 1\n'
          )
          helper = (
              'def _readonly_array(values: Any, *, dtype: Any) -> np.ndarray:\n'
              '    result = np.asarray(values, dtype=dtype).copy()\n'
              '    result.setflags(write=False)\n'
              '    return result\n'
          )
          helper_replacement = (
              'def _readonly_array(values: Any, *, dtype: Any) -> np.ndarray:\n'
              '    return readonly_array(values, dtype=dtype)\n'
          )
          if text.count(import_anchor) != 1:
              raise SystemExit('posterior-scoring import anchor changed')
          if text.count(helper) != 1:
              raise SystemExit('posterior-scoring readonly helper changed')
          text = text.replace(import_anchor, import_replacement)
          text = text.replace(helper, helper_replacement)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply repository formatter and focused validation
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format \
            src/causal4d/_posterior_scoring_contracts.py \
            src/causal4d/_posterior_scoring_metrics.py \
            src/causal4d/_posterior_scoring_results.py \
            tests/test_posterior_scoring.py
          python -m ruff check \
            src/causal4d/_posterior_scoring_contracts.py \
            src/causal4d/_posterior_scoring_metrics.py \
            src/causal4d/_posterior_scoring_results.py \
            src/causal4d/posterior_scoring.py \
            tests/test_posterior_scoring.py
          python -m ruff format --check \
            src/causal4d/_posterior_scoring_contracts.py \
            src/causal4d/_posterior_scoring_metrics.py \
            src/causal4d/_posterior_scoring_results.py \
            tests/test_posterior_scoring.py
          python -m pytest -q \
            tests/test_immutable_array.py \
            tests/test_posterior_scoring.py
          python -m compileall -q src/causal4d tests/test_posterior_scoring.py
          git diff --check
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/causal4d/_posterior_scoring_contracts.py \
            src/causal4d/_posterior_scoring_metrics.py \
            src/causal4d/_posterior_scoring_results.py \
            tests/test_posterior_scoring.py
          if git diff --cached --quiet; then
            echo 'No repair changes were needed.'
            exit 0
          fi
          git commit -m 'Fix posterior-scoring quality regressions'
          git push origin HEAD:fix/posterior-scoring-quality-current-main
