name: Temporary recursive provider contract formatter

on:
  push:
    branches:
      - agent/bpt-recursive-provider-contract

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.10"
      - name: Install exact formatter
        run: python -m pip install "ruff==0.16.2"
      - name: Format recursive provider contract files
        run: |
          python -m ruff format \
            src/causal4d/belief_provider_v2_recursive_contract.py \
            tests/test_belief_provider_v2_recursive_contract.py
          python -m ruff format --check \
            src/causal4d/belief_provider_v2_recursive_contract.py \
            tests/test_belief_provider_v2_recursive_contract.py
      - name: Upload canonical files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bpt-recursive-provider-contract-formatted-${{ github.run_id }}
          path: |
            src/causal4d/belief_provider_v2_recursive_contract.py
            tests/test_belief_provider_v2_recursive_contract.py
          if-no-files-found: error
          retention-days: 1
