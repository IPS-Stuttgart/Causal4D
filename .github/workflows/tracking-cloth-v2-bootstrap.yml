name: Bootstrap final Tracking Cloth V2 files

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tracking-cloth-v2-bootstrap.yml"
      - ".github/bootstrap/tracking-cloth-v2-final.tar.gz.b64.part-*"

permissions:
  contents: write

concurrency:
  group: tracking-cloth-v2-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the checksummed V2 archive and validate it
        shell: bash
        run: |
          set -euo pipefail
          parts=(.github/bootstrap/tracking-cloth-v2-final.tar.gz.b64.part-*)
          test "${#parts[@]}" -eq 8
          cat "${parts[@]}" > /tmp/tracking-cloth-v2-final.tar.gz.b64
          test "$(wc -c < /tmp/tracking-cloth-v2-final.tar.gz.b64)" -eq 29420
          test "$(sha256sum /tmp/tracking-cloth-v2-final.tar.gz.b64 | cut -d' ' -f1)" = \
            "a720bc73f93f3f37e12362dd81eb073a3d0da631035ebdcc1d30664664cf2e94"
          base64 --decode /tmp/tracking-cloth-v2-final.tar.gz.b64 \
            > /tmp/tracking-cloth-v2-final.tar.gz
          test "$(wc -c < /tmp/tracking-cloth-v2-final.tar.gz)" -eq 22065
          test "$(sha256sum /tmp/tracking-cloth-v2-final.tar.gz | cut -d' ' -f1)" = \
            "0c08cee137260a45896a02eb87da9714db4f2ddcdff3d03852f30149ca0db1d5"
          tar -tzf /tmp/tracking-cloth-v2-final.tar.gz | sort > /tmp/archive-paths.txt
          cat > /tmp/expected-paths.txt <<'EOF'
          .github/workflows/tracking-cloth-query-observation-v2-file-dispatch.yml
          .github/workflows/tracking-cloth-query-observation-v2.yml
          configs/causal4d_public/tracking_cloth_query_observation_v2.json
          ops/tracking-cloth-query-observation-v2-gpuserver4090-request.json
          src/causal4d_public/tracking_cloth_query_observation_v2.py
          tests/test_tracking_cloth_query_observation_v2.py
          EOF
          sort -o /tmp/expected-paths.txt /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/archive-paths.txt
          tar -xzf /tmp/tracking-cloth-v2-final.tar.gz
          rm -f "${parts[@]}" .github/workflows/tracking-cloth-v2-bootstrap.yml

          python -m pip install -e ".[dev]"
          python -m pip check
          files=(
            src/causal4d_public/tracking_cloth_query_observation_v2.py
            tests/test_tracking_cloth_query_observation_v2.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/causal4d_public/tracking_cloth_query_observation_v2.py
          python -m pytest -q tests/test_tracking_cloth_query_observation_v2.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys

          module_path = Path(
              "src/causal4d_public/tracking_cloth_query_observation_v2.py"
          ).resolve()
          module_name = "tracking_cloth_query_observation_v2_bootstrap"
          spec = importlib.util.spec_from_file_location(module_name, module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("failed to create V2 module specification")
          module = importlib.util.module_from_spec(spec)
          sys.modules[module_name] = module
          spec.loader.exec_module(module)
          request = module.load_request(
              Path(
                  "configs/causal4d_public/"
                  "tracking_cloth_query_observation_v2.json"
              )
          )
          expected = (
              "328737f73b038c81f0a9b7d4d1ed9a40e40d5cbad214e85812b69c6405f0277e"
          )
          if request["request_id"] != expected:
              raise SystemExit("unexpected frozen V2 request identity")
          if request["primary_target_statistical_unit"] != "material_size_specimen":
              raise SystemExit("target statistical unit changed")
          if request["target_models_refit_after_gate"] is not False:
              raise SystemExit("target refit boundary changed")
          PY

      - name: Commit only the final reviewed V2 files
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m "Install final Tracking Cloth V2 protocol"
          git push origin "HEAD:${HEAD_REF}"
