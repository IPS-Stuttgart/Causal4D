name: PokeFlex source active-probe panel v3

on:
  push:
    branches:
      - science/pokeflex-sequential-probe-source-v1
    paths:
      - ".github/requests/pokeflex-source-active-probe-panel-gpuserver4090-v3.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokeflex-source-active-probe-panel-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate source panel with recorded missingness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            scipy==1.15.3 \
            ruff==0.16.5

      - name: Validate missingness contract, compile, and lint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path(
                  ".github/requests/"
                  "pokeflex-source-active-probe-panel-gpuserver4090-v3.json"
              ).read_text(encoding="utf-8")
          )
          assert request["schema"] == (
              "causal4d/pokeflex-source-active-probe-panel-request"
          )
          assert request["technical_revision"] == 3
          assert request["scientific_contract_unchanged"] is True
          assert request["quality_gate"] == {
              "expected_invalid_drop_ids": [
                  "dropping:PlushDice_T2",
                  "dropping:PlushDice_T3",
              ],
              "minimum_total_valid_drop_records": 34,
              "minimum_valid_drops_per_object": 1,
          }
          assert request["drop_carrier_inspection"]["run_id"] == 33622286947
          assert request["continuous_action_interface"]["content_sha256"] == (
              "d94815f7bb832fc18350a6a42f624cf8bdced5e5914cf58977927bbbfd53e577"
          )
          assert set(request["source_and_calibration_objects"]).isdisjoint(
              request["target_objects_excluded"]
          )
          assert request["information_boundary"]["target_archive_open_allowed"] is False
          PY
          python -m py_compile \
            scripts/remote/audit_pokeflex_probe_action_classes_gpuserver4090.py \
            scripts/remote/extract_pokeflex_source_active_probe_panel.py \
            scripts/remote/extract_pokeflex_source_active_probe_panel_v2.py \
            scripts/remote/extract_pokeflex_source_active_probe_panel_v3.py \
            scripts/ci/verify_pokeflex_source_active_probe_panel_v3.py
          python -m ruff check \
            scripts/remote/audit_pokeflex_probe_action_classes_gpuserver4090.py \
            scripts/remote/extract_pokeflex_source_active_probe_panel.py \
            scripts/remote/extract_pokeflex_source_active_probe_panel_v2.py \
            scripts/remote/extract_pokeflex_source_active_probe_panel_v3.py \
            scripts/ci/verify_pokeflex_source_active_probe_panel_v3.py

  extract:
    name: Extract 12-object source panel on gpuserver4090
    needs: contract
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 240
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true

      - name: Create isolated numerical runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/pokeflex-source-panel-v3-venv"
          "$RUNNER_TEMP/pokeflex-source-panel-v3-venv/bin/python" \
            -m pip install --disable-pip-version-check \
              numpy==2.2.6 \
              scipy==1.15.3

      - name: Extract source-only panel with explicit invalid recordings
        run: |
          rm -rf build/pokeflex-source-active-probe-panel-v3
          mkdir -p build/pokeflex-source-active-probe-panel-v3
          "$RUNNER_TEMP/pokeflex-source-panel-v3-venv/bin/python" \
            scripts/remote/extract_pokeflex_source_active_probe_panel_v3.py \
            --root /mnt/seagate10tb/florianpfaff/datasets/pokeflex \
            --request \
              .github/requests/pokeflex-source-active-probe-panel-gpuserver4090-v3.json \
            --action-module \
              scripts/remote/audit_pokeflex_probe_action_classes_gpuserver4090.py \
            --output-dir build/pokeflex-source-active-probe-panel-v3/result \
            --cache-path \
              /home/github-runner/.cache/workflows/pokeflex-active-probe-source-v1/source_panel_v3.json

      - name: Independently verify compact panel
        run: |
          "$RUNNER_TEMP/pokeflex-source-panel-v3-venv/bin/python" \
            scripts/ci/verify_pokeflex_source_active_probe_panel_v3.py \
            build/pokeflex-source-active-probe-panel-v3/result/panel.json \
            --output-json \
              build/pokeflex-source-active-probe-panel-v3/verification.json

      - name: Record runner provenance
        if: always()
        run: |
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=${GITHUB_SHA}"
          } > build/pokeflex-source-active-probe-panel-v3/runner.txt

      - name: Publish panel summary
        if: always()
        run: |
          if test -f build/pokeflex-source-active-probe-panel-v3/result/panel.md; then
            cat build/pokeflex-source-active-probe-panel-v3/result/panel.md \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload source-only panel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokeflex-source-active-probe-panel-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pokeflex-source-active-probe-panel-v3/
            .github/requests/pokeflex-source-active-probe-panel-gpuserver4090-v3.json
          if-no-files-found: error
          retention-days: 90
