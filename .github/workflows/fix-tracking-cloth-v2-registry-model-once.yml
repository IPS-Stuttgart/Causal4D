name: Correct Tracking Cloth V2 registry model once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-tracking-cloth-v2-registry-model-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Correct the self-hosted authorization model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/self-hosted-jobs.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          matched = 0
          for entry in payload['jobs']:
              if (
                  entry['workflow'] == 'tracking-cloth-query-observation-v2.yml'
                  and entry['job'] == 'evaluate'
              ):
                  entry['authorization_model'] = 'main-only'
                  matched += 1
          if matched != 1:
              raise SystemExit(f'expected one Tracking Cloth V2 entry, found {matched}')
          payload['jobs'].sort(key=lambda item: (item['workflow'], item['job']))
          path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/fix-tracking-cloth-v2-registry-model-once.yml
          git diff --check

      - name: Commit the classification repair
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/self-hosted-jobs.json \
            .github/workflows/fix-tracking-cloth-v2-registry-model-once.yml
          git commit -m 'Classify Tracking Cloth V2 as main-only dispatch'
          git push origin "HEAD:${HEAD_REF}"
