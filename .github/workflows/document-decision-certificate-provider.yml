name: Document decision certificate provider

on:
  push:
    branches:
      - feature/decision-identifiable-intervention-v1
    paths:
      - .github/workflows/document-decision-certificate-provider.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/decision-identifiable-intervention-v1
          persist-credentials: true
      - name: Insert the registered certificate module and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/bayesian_phystwin_provider.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "- `bayesian_phystwin.causal4d_public_provider_v1` for source-locked public-data\n"
              "  diagnostics that still reuse BPT experiment semantics.\n"
          )
          new = old + (
              "- `bayesian_phystwin.query_decision_certificate_v1` for exact finite-action\n"
              "  worst-case-regret certificates over registered query quotients and prior\n"
              "  support.\n"
          )
          if text.count(old) != 1:
              raise SystemExit("provider documentation insertion point drifted")
          text = text.replace(old, new)
          marker = (
              "Registered tree-block covariance queries use their own additive provider and\n"
              "local validation contract."
          )
          replacement = marker + (
              " The decision-certificate module is an additive,\n"
              "versioned constructor owned by BayesianPhysTwin; Causal4D validates and\n"
              "consumes its output through `causal4d.decision_identifiable_intervention`\n"
              "without selecting an unsupported within-class physical representative."
          )
          if text.count(marker) != 1:
              raise SystemExit("provider prose insertion point drifted")
          path.write_text(
              text.replace(marker, replacement),
              encoding="utf-8",
              newline="\n",
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bayesian_phystwin_provider.md
          git diff --cached --check
          git commit -m "Document the query decision certificate provider"
          git push origin HEAD:feature/decision-identifiable-intervention-v1
