name: Apply bounded stable-core typing repairs

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: stable-core-typing-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.event.pull_request.head.ref == 'agent/stable-core-typing-ratchet'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/stable-core-typing-ratchet
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and apply the bounded repair set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/causal4d/contracts.py)" = \
            aa180e014500a017c6c4949e1abe805970f681d6
          test "$(git hash-object src/causal4d/intervention_abduction.py)" = \
            09794da61b88320dec7306c0d1f28ddda92ad299
          test "$(git hash-object src/causal4d/observation_evidence.py)" = \
            6d92d8063e2123441a7f3a534a371ef5c46b2da7
          test "$(git hash-object src/causal4d/grouped_likelihood.py)" = \
            a72f89663864f0097e8df7f282ddb5ffcc174ade
          test "$(git hash-object src/causal4d/counterfactual.py)" = \
            f37861687e1acc3cb7af6abd66d52ca0b6b77933
          python scripts/ci/_apply_stable_core_typing_repairs.py

      - name: Validate the repaired stable core
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            scripts/ci/run_stable_core_mypy.py \
            tests/test_stable_core_typing_policy.py \
            src/causal4d/contracts.py \
            src/causal4d/counterfactual.py \
            src/causal4d/grouped_likelihood.py \
            src/causal4d/intervention_abduction.py \
            src/causal4d/observation_evidence.py
          python -m ruff check \
            scripts/ci/run_stable_core_mypy.py \
            tests/test_stable_core_typing_policy.py \
            src/causal4d/contracts.py \
            src/causal4d/counterfactual.py \
            src/causal4d/grouped_likelihood.py \
            src/causal4d/intervention_abduction.py \
            src/causal4d/observation_evidence.py
          python scripts/ci/run_stable_core_mypy.py
          PYTHONPATH=src:. python -m pytest -q \
            tests/test_stable_core_typing_policy.py \
            tests/test_api_v1.py \
            tests/test_causal4d_contracts.py \
            tests/test_causal4d_counterfactual.py \
            tests/test_causal4d_intervention_abduction.py \
            tests/test_causal4d_grouped_abduction.py \
            tests/test_grouped_normalized_v3_batched.py
          python -m compileall -q \
            scripts/ci/run_stable_core_mypy.py \
            tests/test_stable_core_typing_policy.py \
            src/causal4d/contracts.py \
            src/causal4d/counterfactual.py \
            src/causal4d/grouped_likelihood.py \
            src/causal4d/intervention_abduction.py \
            src/causal4d/observation_evidence.py
          git diff --check

      - name: Commit the permanent repairs and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm \
            .github/workflows/apply-stable-core-typing-repairs.yml \
            scripts/ci/_apply_stable_core_typing_repairs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/merge-gate.yml \
            .github/workflows/apply-stable-core-typing-repairs.yml \
            docs/stable_core_typing.md \
            scripts/ci/run_stable_core_mypy.py \
            scripts/ci/_apply_stable_core_typing_repairs.py \
            src/causal4d/contracts.py \
            src/causal4d/counterfactual.py \
            src/causal4d/grouped_likelihood.py \
            src/causal4d/intervention_abduction.py \
            src/causal4d/observation_evidence.py \
            tests/test_stable_core_typing_policy.py
          git commit -m "Repair and ratchet stable-core typing"
          git push origin HEAD:agent/stable-core-typing-ratchet
