name: Apply bounded stable-core typing repairs

on:
  push:
    branches: [agent/stable-core-typing-ratchet]
    paths: [.github/workflows/apply-stable-core-typing-repairs.yml]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.actor == 'FlorianPfaff' &&
      github.event.head_commit.message == 'Bootstrap bounded stable-core typing repairs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/stable-core-typing-ratchet
          fetch-depth: 1
          persist-credentials: true

      - name: Verify and apply the finite repair set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/causal4d/contracts.py)" = \
            aa180e014500a017c6c4949e1abe805970f681d6
          test "$(git hash-object src/causal4d/intervention_abduction.py)" = \
            09794da61b88320dec7306c0d1f28ddda92ad299

          python - <<'PY'
          from pathlib import Path

          root = Path("src/causal4d")
          contracts = root / "contracts.py"
          text = contracts.read_text(encoding="utf-8")
          old_import = (
              "from typing import Any, BinaryIO, ClassVar, Literal, Mapping, "
              "Sequence\n"
          )
          new_import = (
              "from typing import Any, BinaryIO, Callable, ClassVar, Literal, "
              "Mapping, Sequence, cast\n"
          )
          if text.count(old_import) != 1:
              raise SystemExit("unexpected contracts typing import")
          text = text.replace(old_import, new_import)
          old_writer = '''    def write_archive(handle: BinaryIO) -> None:
              np.savez_compressed(
                  handle,
                  descriptor_json=np.asarray(
                      json.dumps(descriptor, sort_keys=True, separators=(",", ":"))
                  ),
                  **arrays,
              )
          '''
          new_writer = '''    def write_archive(handle: BinaryIO) -> None:
              # NumPy's stubs reserve ``allow_pickle`` as a Boolean keyword, while
              # the runtime accepts arbitrary named archive members through ``**kwds``.
              # Contract array names are schema-locked and cannot use that reserved name.
              savez_compressed = cast(Callable[..., None], np.savez_compressed)
              savez_compressed(
                  handle,
                  descriptor_json=np.asarray(
                      json.dumps(descriptor, sort_keys=True, separators=(",", ":"))
                  ),
                  **arrays,
              )
          '''
          if text.count(old_writer) != 1:
              raise SystemExit("unexpected contract archive writer")
          contracts.write_text(text.replace(old_writer, new_writer), encoding="utf-8")

          abduction = root / "intervention_abduction.py"
          text = abduction.read_text(encoding="utf-8")
          replacements = (
              (
                  "        flat_indices = np.arange(start, stop, dtype=np.int64)\n",
                  "        flat_indices: np.ndarray = np.arange("
                  "start, stop, dtype=np.int64)\n",
              ),
              (
                  "    for hypothesis_index, (hypothesis_id, metadata) in enumerate(\n"
                  "        zip(bank.hypothesis_ids, bank.hypothesis_metadata, "
                  "strict=True)\n"
                  "    ):\n"
                  "        action = metadata[\"action\"]\n",
                  "    for hypothesis_index, (hypothesis_id, hypothesis_metadata) "
                  "in enumerate(\n"
                  "        zip(bank.hypothesis_ids, bank.hypothesis_metadata, "
                  "strict=True)\n"
                  "    ):\n"
                  "        action = hypothesis_metadata[\"action\"]\n",
              ),
              (
                  "        contact = metadata[\"contact\"]\n"
                  "        persistent = (\n",
                  "        contact = hypothesis_metadata[\"contact\"]\n"
                  "        persistent = (\n",
              ),
              (
                  "    result = np.zeros((hypothesis_count, particle_count), "
                  "dtype=float)\n",
                  "    result: np.ndarray = np.zeros(\n"
                  "        (hypothesis_count, particle_count), dtype=float\n"
                  "    )\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected abduction source block: {old!r}")
              text = text.replace(old, new)
          abduction.write_text(text, encoding="utf-8")
          PY

          test "$(git hash-object src/causal4d/contracts.py)" = \
            1f473ad07dd4debc14bb754b4448040c5675491c
          test "$(git hash-object src/causal4d/intervention_abduction.py)" = \
            2861a0b79f8f563bb0ec28cbc822044800bd18c9
          python -m compileall -q \
            src/causal4d/contracts.py \
            src/causal4d/intervention_abduction.py
          git diff --check

      - name: Commit the exact repairs and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-stable-core-typing-repairs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/contracts.py \
            src/causal4d/intervention_abduction.py \
            .github/workflows/apply-stable-core-typing-repairs.yml
          git commit -m "Repair stable-core typing defects"
          git push origin HEAD:agent/stable-core-typing-ratchet
