name: Self-hosted operator registry correction

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: correct-operator-registry-${{ github.sha }}
  cancel-in-progress: false

jobs:
  correct:
    name: Correct the registered operator roster on workstation2
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' &&
          github.event.action == 'opened' &&
          github.event.issue.user.login == 'FlorianPfaff' &&
          github.event.issue.user.id == 6773539 &&
          github.event.issue.title ==
            '[self-hosted] correct Causal4D operator registry'
        )
      )
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 45
    outputs:
      already_corrected: ${{ steps.summary.outputs.already_corrected }}
      dataset_modified: ${{ steps.summary.outputs.dataset_modified }}
      registry_artifact_sha256: >-
        ${{ steps.summary.outputs.registry_artifact_sha256 }}
      registry_file_sha256: ${{ steps.summary.outputs.registry_file_sha256 }}
      correction_artifact_sha256: >-
        ${{ steps.summary.outputs.correction_artifact_sha256 }}
      operator_count: ${{ steps.summary.outputs.operator_count }}
      independent_verifier_available: >-
        ${{ steps.summary.outputs.independent_verifier_available }}
      next_action: ${{ steps.summary.outputs.next_action }}
      private_material_replaced: >-
        ${{ steps.summary.outputs.private_material_replaced }}
      physical_evidence_increment: >-
        ${{ steps.summary.outputs.physical_evidence_increment }}
    steps:
      - name: Check out exact reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify reviewed main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and install the exact Causal4D wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/operator-registry-correction/wheels
          python -m venv .operator-registry-correction-venv
          .operator-registry-correction-venv/bin/python -m pip install \
            --upgrade pip "build>=1.2"
          .operator-registry-correction-venv/bin/python -m build --wheel \
            --outdir outputs/operator-registry-correction/wheels .
          wheel="$(
            find outputs/operator-registry-correction/wheels -maxdepth 1 \
              -name 'causal4d-*.whl' -print -quit
          )"
          test -n "${wheel}"
          sha256sum "${wheel}" \
            | tee outputs/operator-registry-correction/wheel-sha256.txt
          .operator-registry-correction-venv/bin/python -m pip install "${wheel}"
          .operator-registry-correction-venv/bin/python -m pip check
          .operator-registry-correction-venv/bin/python - <<'PY'
          from pathlib import Path

          import causal4d

          source_root = (Path.cwd() / "src").resolve()
          origin = Path(causal4d.__file__).resolve()
          print("installed import", origin)
          if origin.is_relative_to(source_root):
              raise SystemExit(
                  "Causal4D resolved from the checkout instead of the wheel"
              )
          PY

      - name: Replace the unsupported roster with the single real participant
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="" .operator-registry-correction-venv/bin/python \
            scripts/ci/correct_self_hosted_operator_registry.py \
            --repository-root \
              /mnt/lexar4tb/causal4d-physical/causal4d-frozen \
            --dataset-root \
              /mnt/lexar4tb/causal4d-physical/causal4d-sloth-multi-action-v1 \
            --private-root \
              /mnt/lexar4tb/causal4d-physical/private/operator-registry-v1 \
            --output outputs/operator-registry-correction/report.json \
            | tee outputs/operator-registry-correction/report.txt

      - name: Export sanitized result fields
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          .operator-registry-correction-venv/bin/python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          report = json.loads(
              Path("outputs/operator-registry-correction/report.json").read_text(
                  encoding="utf-8"
              )
          )
          print(
              f"already_corrected={str(report['already_corrected']).lower()}"
          )
          print(f"dataset_modified={str(report['dataset_modified']).lower()}")
          print(
              "registry_artifact_sha256="
              f"{report['registry_artifact_sha256']}"
          )
          print(f"registry_file_sha256={report['registry_file_sha256']}")
          print(
              "correction_artifact_sha256="
              f"{report['correction_artifact_sha256']}"
          )
          print(f"operator_count={len(report['operator_ids'])}")
          print(
              "independent_verifier_available="
              f"{str(report['independent_verifier_available']).lower()}"
          )
          print(f"next_action={report['next_action']['action_id']}")
          print(
              "private_material_replaced="
              f"{str(report['private_material_replaced']).lower()}"
          )
          print(
              "physical_evidence_increment="
              f"{report['physical_evidence_increment']}"
          )
          PY

      - name: Record runner and GPU identity
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            uname -a
          } | tee outputs/operator-registry-correction/runner.txt
          nvidia-smi -L \
            | tee outputs/operator-registry-correction/nvidia-smi-L.txt

      - name: Upload sanitized correction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: causal4d-operator-registry-correction
          path: |
            outputs/operator-registry-correction/report.json
            outputs/operator-registry-correction/report.txt
            outputs/operator-registry-correction/runner.txt
            outputs/operator-registry-correction/nvidia-smi-L.txt
            outputs/operator-registry-correction/wheel-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated environment and wheel
        if: always()
        shell: bash
        run: |
          rm -rf \
            .operator-registry-correction-venv \
            outputs/operator-registry-correction/wheels

  report:
    name: Report the operator registry correction to the trigger issue
    if: >-
      always() &&
      github.event_name == 'issues' &&
      github.event.action == 'opened' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.user.login == 'FlorianPfaff' &&
      github.event.issue.user.id == 6773539 &&
      github.event.issue.title ==
        '[self-hosted] correct Causal4D operator registry'
    needs: correct
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      CORRECTION_RESULT: ${{ needs.correct.result }}
      ALREADY_CORRECTED: ${{ needs.correct.outputs.already_corrected }}
      DATASET_MODIFIED: ${{ needs.correct.outputs.dataset_modified }}
      REGISTRY_ARTIFACT_SHA256: >-
        ${{ needs.correct.outputs.registry_artifact_sha256 }}
      REGISTRY_FILE_SHA256: ${{ needs.correct.outputs.registry_file_sha256 }}
      CORRECTION_ARTIFACT_SHA256: >-
        ${{ needs.correct.outputs.correction_artifact_sha256 }}
      OPERATOR_COUNT: ${{ needs.correct.outputs.operator_count }}
      INDEPENDENT_VERIFIER_AVAILABLE: >-
        ${{ needs.correct.outputs.independent_verifier_available }}
      NEXT_ACTION: ${{ needs.correct.outputs.next_action }}
      PRIVATE_MATERIAL_REPLACED: >-
        ${{ needs.correct.outputs.private_material_replaced }}
      PHYSICAL_EVIDENCE_INCREMENT: >-
        ${{ needs.correct.outputs.physical_evidence_increment }}
    steps:
      - name: Comment with the sanitized correction result
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/"
          run_url+="${GITHUB_RUN_ID}"
          body="$(cat <<EOF
          Self-hosted Causal4D operator registry correction: **${CORRECTION_RESULT}**

          - Exact reviewed main commit: \`${GITHUB_SHA}\`
          - Already corrected before this run: \`${ALREADY_CORRECTED:-unknown}\`
          - Registered dataset modified: \`${DATASET_MODIFIED:-unknown}\`
          - Operator count: \`${OPERATOR_COUNT:-unknown}\`
          - Only operator ID: \`florianpfaff\`
          - Independent verifier available: \`${INDEPENDENT_VERIFIER_AVAILABLE:-unknown}\`
          - Registry artifact SHA-256: \`${REGISTRY_ARTIFACT_SHA256:-unavailable}\`
          - Registry file SHA-256: \`${REGISTRY_FILE_SHA256:-unavailable}\`
          - Correction artifact SHA-256: \`${CORRECTION_ARTIFACT_SHA256:-unavailable}\`
          - Private identity material replaced: \`${PRIVATE_MATERIAL_REPLACED:-unknown}\`
          - Derived next action: \`${NEXT_ACTION:-unavailable}\`
          - Workflow run: ${run_url}
          - Artifact: \`causal4d-operator-registry-correction\`
          - Target outcomes used: \`false\`
          - Device nodes opened: \`false\`
          - Physical command sent: \`false\`
          - Physical evidence increment: \`${PHYSICAL_EVIDENCE_INCREMENT:-0}\`
          EOF
          )"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --body "${body}"
