name: Publish per-view observation evidence

on:
  push:
    branches:
      - agent/per-view-observation-evidence
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      (
        (github.event_name == 'push' &&
         github.ref == 'refs/heads/agent/per-view-observation-evidence') ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.number == 270 &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         github.event.pull_request.head.ref == 'agent/per-view-observation-evidence')
      )
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply the checksum-bound patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python scripts/ci/apply_per_view_observation_evidence.py

      - name: Format and validate the reviewed source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m ruff check --fix \
            src/causal4d/per_view_observation_evidence.py \
            src/causal4d/real_protocol.py \
            tests/test_per_view_observation_evidence.py
          python -m ruff format \
            src/causal4d/per_view_observation_evidence.py \
            src/causal4d/real_protocol.py \
            tests/test_per_view_observation_evidence.py
          python -m ruff check \
            src/causal4d/per_view_observation_evidence.py \
            src/causal4d/real_protocol.py \
            tests/test_per_view_observation_evidence.py
          python -m ruff format --check \
            src/causal4d/per_view_observation_evidence.py \
            src/causal4d/real_protocol.py \
            tests/test_per_view_observation_evidence.py
          python -m py_compile \
            src/causal4d/per_view_observation_evidence.py \
            src/causal4d/real_protocol.py \
            tests/test_per_view_observation_evidence.py
          python -m pytest -q \
            tests/test_per_view_observation_evidence.py \
            tests/test_causal4d_real_protocol.py \
            tests/test_real_evidence_contract_v2.py \
            tests/test_real_evidence_status.py \
            tests/test_source_panel_template_completeness.py

      - name: Remove transport machinery and verify the final scope
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/per-view-observation.patch.b64 \
            .github/workflows/temporary-per-view-observation-evidence.yml \
            scripts/ci/apply_per_view_observation_evidence.py
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(
              ["git", "diff", "--name-only", "HEAD"],
              text=True,
          ).splitlines()
          untracked = subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard"],
              text=True,
          ).splitlines()
          changed = set(tracked) | set(untracked)
          expected = {
              ".github/per-view-observation.patch.b64",
              ".github/workflows/temporary-per-view-observation-evidence.yml",
              "CHANGELOG.md",
              "docs/per_view_observation_evidence.md",
              "docs/phystwin_discrepancy_localization.md",
              "scripts/ci/apply_per_view_observation_evidence.py",
              "src/causal4d/per_view_observation_evidence.py",
              "src/causal4d/real_protocol.py",
              "tests/test_per_view_observation_evidence.py",
          }
          if changed != expected:
              raise SystemExit(f"unexpected final scope: {sorted(changed)}")
          PY
          git diff --check

      - name: Publish the ordinary reviewable commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Retain per-view acquisition evidence"
          git push origin HEAD:refs/heads/agent/per-view-observation-evidence
