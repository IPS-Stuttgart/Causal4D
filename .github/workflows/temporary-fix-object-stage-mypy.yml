name: Temporary fix object-stage typing

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-fix-object-stage-mypy.yml"
      - "scripts/ci/stage_self_hosted_object_registration_inputs.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Apply exact type-narrowing patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "scripts/ci/stage_self_hosted_object_registration_inputs.py"
          )
          source = path.read_text(encoding="utf-8")

          def replace_function(
              text: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement.rstrip() + "\n\n" + text[end:]

          decision_summary = '''def _decision_summary(decision: Mapping[str, Any]) -> dict[str, Any]:
              action = decision.get("action")
              if not isinstance(action, Mapping):
                  raise ValueError("next-action decision has no action object")
              action_map = dict(action)
              valid = decision.get("valid") is True
              ready = decision.get("ready") is True
              verify_file_hashes = decision.get("verify_file_hashes") is True
              automatable = action_map.get("automatable") is True
              physical_acquisition_required = (
                  action_map.get("physical_acquisition_required") is True
              )
              target_outcomes_permitted = (
                  action_map.get("target_outcomes_permitted") is True
              )
              changes_registered_method = (
                  action_map.get("changes_registered_method") is True
              )
              summary: dict[str, Any] = {
                  "valid": valid,
                  "ready": ready,
                  "verify_file_hashes": verify_file_hashes,
                  "evidence_sha256": decision.get("evidence_sha256"),
                  "status_sha256": decision.get("status_sha256"),
                  "action_id": action_map.get("action_id"),
                  "operator_role": action_map.get("operator_role"),
                  "automatable": automatable,
                  "physical_acquisition_required": physical_acquisition_required,
                  "target_outcomes_permitted": target_outcomes_permitted,
                  "changes_registered_method": changes_registered_method,
              }
              _require(valid, "registered next-action decision is invalid")
              _require(verify_file_hashes, "file hashes were not verified")
              _require(
                  summary["action_id"] == EXPECTED_NEXT_ACTION,
                  "input staging is allowed only at complete_object_registration",
              )
              _require(
                  not automatable,
                  "object registration unexpectedly automatable",
              )
              _require(
                  not physical_acquisition_required,
                  "object registration unexpectedly requires acquisition",
              )
              _require(
                  not target_outcomes_permitted,
                  "object registration unexpectedly permits target outcomes",
              )
              _require(
                  not changes_registered_method,
                  "object registration unexpectedly changes the registered method",
              )
              return summary
          '''
          decision_summary = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in decision_summary.splitlines()
          )
          source = replace_function(
              source,
              "def _decision_summary(",
              "def _default_packet_builder(",
              decision_summary,
          )

          validate_packet = '''def _validate_packet(
              packet: Mapping[str, Any],
              requirements: Mapping[str, Mapping[str, Any]],
          ) -> dict[str, Any]:
              _require(
                  packet.get("artifact_kind")
                  == "Causal4DObjectRegistrationSealPacket",
                  "unexpected object-registration seal packet",
              )
              _require(
                  packet.get("phystwin_model_id") == MODEL_ID,
                  "PhysTwin model ID changed",
              )
              _require(
                  packet.get("phystwin_model_sha256") == MODEL_SHA256,
                  "PhysTwin model SHA-256 changed",
              )
              _require(
                  packet.get("missing_operator_inputs")
                  == ["physical_instance_serial"],
                  "pending packet is not blocked only by the physical serial",
              )
              _require(
                  packet.get("ready_to_seal_object_registration") is False,
                  "pending packet unexpectedly claims readiness",
              )
              regions = packet.get("contact_regions")
              if not isinstance(regions, Mapping):
                  raise ValueError("pending packet has no contact regions")
              _require(
                  set(regions) == set(requirements),
                  "pending packet region set changed",
              )
              for region_id, required in requirements.items():
                  descriptor = regions.get(region_id)
                  if not isinstance(descriptor, Mapping):
                      raise ValueError(f"{region_id} descriptor is missing")
                  for field in (
                      "path",
                      "node_count",
                      "sha256",
                      "bytes",
                      "selected_candidate_id",
                  ):
                      _require(
                          descriptor.get(field) == required[field],
                          f"{region_id} {field} changed",
                      )
              return dict(packet)
          '''
          validate_packet = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in validate_packet.splitlines()
          )
          source = replace_function(
              source,
              "def _validate_packet(",
              "def _fsync_directory(",
              validate_packet,
          )

          replacements = {
              '            relative = Path(str(required["path"]))\n': (
                  '            relative_path = Path(str(required["path"]))\n'
              ),
              '                evidence_root / relative,\n': (
                  '                evidence_root / relative_path,\n'
              ),
              '            destination = dataset / relative\n': (
                  '            destination = dataset / relative_path\n'
              ),
              '        for relative, descriptor in before_members.items():\n': (
                  '        for existing_relative, descriptor in '
                  'before_members.items():\n'
              ),
              '                after_members[relative] == descriptor,\n': (
                  '                after_members[existing_relative] == descriptor,\n'
              ),
              '                f"existing dataset file changed: {relative}",\n': (
                  '                f"existing dataset file changed: '
                  '{existing_relative}",\n'
              ),
          }
          for before, after in replacements.items():
              if source.count(before) != 1:
                  raise SystemExit(f"rename patch target changed: {before!r}")
              source = source.replace(before, after)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Format and type-check the patched script
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            scripts/ci/stage_self_hosted_object_registration_inputs.py
          python -m ruff check \
            scripts/ci/stage_self_hosted_object_registration_inputs.py
          python -m mypy --python-version 3.12 \
            scripts/ci/stage_self_hosted_object_registration_inputs.py
          pytest -q tests/test_self_hosted_object_registration_input_stage.py

      - name: Commit the patch and remove this temporary workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-fix-object-stage-mypy.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/stage_self_hosted_object_registration_inputs.py
          git commit -m "Fix object-stage typing"
          git push origin "HEAD:${HEAD_BRANCH}"
