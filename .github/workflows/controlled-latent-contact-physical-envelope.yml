name: Controlled latent-contact physical envelope

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/controlled-latent-contact-physical-envelope.yml"
      - "scripts/experiments/run_latent_contact_physical_envelope.py"
      - "tests/test_latent_contact_physical_envelope_experiment.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latent-contact-physical-envelope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-seed-envelope-shard:
    name: Physical envelope / seeds ${{ matrix.seeds }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "64-71"
            seeds: "64:72"
          - shard: "72-79"
            seeds: "72:80"
          - shard: "80-87"
            seeds: "80:88"
          - shard: "88-95"
            seeds: "88:96"
          - shard: "96-103"
            seeds: "96:104"
          - shard: "104-111"
            seeds: "104:112"
          - shard: "112-119"
            seeds: "112:120"
          - shard: "120-127"
            seeds: "120:128"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Materialize and validate formatter result
        run: |
          mkdir -p build/latent-contact-physical-envelope
          python -m ruff check --fix \
            scripts/experiments/run_latent_contact_physical_envelope.py \
            tests/test_latent_contact_physical_envelope_experiment.py
          python -m ruff format \
            scripts/experiments/run_latent_contact_physical_envelope.py \
            tests/test_latent_contact_physical_envelope_experiment.py
          python -m ruff check \
            scripts/experiments/run_latent_contact_physical_envelope.py \
            tests/test_latent_contact_physical_envelope_experiment.py
          python -m ruff format --check \
            scripts/experiments/run_latent_contact_physical_envelope.py \
            tests/test_latent_contact_physical_envelope_experiment.py
          python -m pytest -q \
            tests/test_latent_contact_physical_envelope_experiment.py
          cp scripts/experiments/run_latent_contact_physical_envelope.py \
            build/latent-contact-physical-envelope/formatted-experiment.py
          cp tests/test_latent_contact_physical_envelope_experiment.py \
            build/latent-contact-physical-envelope/formatted-test.py
          git diff -- \
            scripts/experiments/run_latent_contact_physical_envelope.py \
            tests/test_latent_contact_physical_envelope_experiment.py \
            > build/latent-contact-physical-envelope/format.patch
      - name: Run fresh seed shard
        run: |
          python scripts/experiments/run_latent_contact_physical_envelope.py \
            --output-dir build/latent-contact-physical-envelope \
            --seeds "${{ matrix.seeds }}" \
            --frames 56 \
            --training-repeats 2 \
            --parameter-grid-count 5 \
            --contact-parameter-particles 12 \
            --observation-fraction 0.20 \
            --observation-noise-mm 1.5 \
            --bootstrap-replicates 100000 \
            --bootstrap-seed 20260828
      - name: Verify deterministic result bundle
        run: |
          python scripts/ci/verify_result_bundle.py \
            build/latent-contact-physical-envelope/result/manifest.json
      - name: Record shard identity
        run: |
          printf '%s\n' '${{ matrix.seeds }}' \
            > build/latent-contact-physical-envelope/seed-range.txt
          printf '%s\n' '${{ matrix.shard }}' \
            > build/latent-contact-physical-envelope/shard.txt
      - name: Upload complete shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controlled-latent-contact-physical-envelope-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/latent-contact-physical-envelope/
          if-no-files-found: error
          retention-days: 30

  aggregate-fresh-seed-envelope:
    name: Aggregate fresh seeds 64:128
    needs: fresh-seed-envelope-shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Download exact-run shard artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: controlled-latent-contact-physical-envelope-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/latent-contact-physical-envelope-shards
      - name: Run one seed-clustered 64-seed analysis
        run: |
          mkdir -p build/latent-contact-physical-envelope-aggregate
          python - <<'PY'
          import csv
          import importlib.util
          import json
          from pathlib import Path

          root = Path("build/latent-contact-physical-envelope-shards")
          shard_dirs = sorted(
              path.parent.parent
              for path in root.glob("*/result/interventions.csv")
          )
          if len(shard_dirs) != 8:
              raise SystemExit(f"expected 8 shard artifacts, found {len(shard_dirs)}")

          fieldnames = None
          rows = []
          summaries = []
          protocols = []
          shard_labels = []
          for shard_dir in shard_dirs:
              interventions = shard_dir / "result" / "interventions.csv"
              with interventions.open(newline="", encoding="utf-8") as handle:
                  reader = csv.DictReader(handle)
                  current_fields = reader.fieldnames
                  if current_fields is None:
                      raise SystemExit(f"missing CSV header: {interventions}")
                  if fieldnames is None:
                      fieldnames = current_fields
                  elif current_fields != fieldnames:
                      raise SystemExit(f"CSV header drift in {interventions}")
                  rows.extend(reader)
              summaries.append(
                  json.loads((shard_dir / "result" / "summary.json").read_text())
              )
              protocols.append(
                  json.loads((shard_dir / "result" / "protocol.json").read_text())
              )
              shard_labels.append((shard_dir / "seed-range.txt").read_text().strip())

          assert fieldnames is not None
          seeds = sorted({int(row["seed"]) for row in rows})
          if seeds != list(range(64, 128)):
              raise SystemExit(
                  f"expected fresh seeds 64..127 exactly, found {seeds}"
              )
          if len(set(shard_labels)) != 8:
              raise SystemExit(f"duplicate shard identities: {shard_labels}")

          signatures = [tuple(row[name] for name in fieldnames) for row in rows]
          if len(signatures) != len(set(signatures)):
              raise SystemExit("duplicate intervention rows across shard artifacts")

          benchmark_configs = {
              json.dumps(summary["benchmark_config"], sort_keys=True)
              for summary in summaries
          }
          contact_configs = {
              json.dumps(summary["contact_config"], sort_keys=True)
              for summary in summaries
          }
          if len(benchmark_configs) != 1 or len(contact_configs) != 1:
              raise SystemExit("benchmark/contact configuration drift across shards")
          protocol_texts = {json.dumps(protocol, sort_keys=True) for protocol in protocols}
          if len(protocol_texts) != 1:
              raise SystemExit("protocol drift across shards")

          rows.sort(
              key=lambda row: (
                  int(row["seed"]),
                  row["object"],
                  row["world_condition"],
                  row["setting"],
                  row["method"],
              )
          )
          combined = Path(
              "build/latent-contact-physical-envelope-aggregate/interventions.csv"
          )
          with combined.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          module_path = Path(
              "scripts/experiments/run_latent_contact_physical_envelope.py"
          )
          spec = importlib.util.spec_from_file_location("physical_envelope", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load physical-envelope analysis module")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          result = {
              "interventions": rows,
              "success_gates": {
                  "scope": "per-shard original-method gates; not used for candidate decision",
                  "shards": [summary["success_gates"] for summary in summaries],
              },
              "protocol": protocols[0],
          }
          analysis = module._analyse(
              result,
              bootstrap_replicates=100000,
              bootstrap_seed=20260828,
              confidence_level=0.95,
          )
          analysis["aggregation"] = {
              "shard_count": 8,
              "shard_seed_ranges": sorted(shard_labels),
              "authoritative_inference_unit": "64 complete simulation seeds",
              "per_shard_bootstrap_is_non_authoritative": True,
          }
          output = Path(
              "build/latent-contact-physical-envelope-aggregate/physical-envelope-analysis.json"
          )
          output.write_text(
              json.dumps(analysis, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "seed_count": analysis["seed_count"],
                      "point_mean_identity_passed": analysis[
                          "point_mean_identity_passed"
                      ],
                      "shifted_nll_supported_against_both_references": analysis[
                          "shifted_nll_supported_against_both_references"
                      ],
                  },
                  sort_keys=True,
              )
          )
          PY
      - name: Verify aggregate evidence identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "build/latent-contact-physical-envelope-aggregate/physical-envelope-analysis.json"
          )
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("seed_count") != 64:
              raise SystemExit(
                  f"aggregate audit must contain 64 seeds, got {payload.get('seed_count')}"
              )
          if payload.get("fresh_seed_block") != list(range(64, 128)):
              raise SystemExit("aggregate fresh seed roster is not exactly 64..127")
          if payload.get("point_mean_identity_passed") is not True:
              raise SystemExit("physical envelope changed a point metric")
          PY
      - name: Upload aggregate fresh-seed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controlled-latent-contact-physical-envelope-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/latent-contact-physical-envelope-aggregate/
          if-no-files-found: error
          retention-days: 30
