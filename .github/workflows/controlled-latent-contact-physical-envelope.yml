name: Controlled latent-contact physical envelope

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/controlled-latent-contact-physical-envelope.yml"
      - "scripts/experiments/run_latent_contact_physical_envelope.py"
      - "tests/test_latent_contact_physical_envelope_experiment.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latent-contact-physical-envelope-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-seed-envelope:
    name: Fresh-seed physical uncertainty envelope
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development environment
        run: python -m pip install -e ".[dev]"
      - name: Validate experiment code
        run: |
          python -m ruff check \
            scripts/experiments/run_latent_contact_physical_envelope.py \
            tests/test_latent_contact_physical_envelope_experiment.py
          python -m ruff format --check \
            scripts/experiments/run_latent_contact_physical_envelope.py \
            tests/test_latent_contact_physical_envelope_experiment.py
          python -m pytest -q \
            tests/test_latent_contact_physical_envelope_experiment.py
      - name: Run fresh seed block
        run: |
          python scripts/experiments/run_latent_contact_physical_envelope.py \
            --output-dir build/latent-contact-physical-envelope \
            --seeds 64:128 \
            --frames 56 \
            --training-repeats 2 \
            --parameter-grid-count 5 \
            --contact-parameter-particles 12 \
            --observation-fraction 0.20 \
            --observation-noise-mm 1.5 \
            --bootstrap-replicates 100000 \
            --bootstrap-seed 20260828
      - name: Verify deterministic result bundle
        run: |
          python scripts/ci/verify_result_bundle.py \
            build/latent-contact-physical-envelope/result/manifest.json
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: controlled-latent-contact-physical-envelope-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/latent-contact-physical-envelope/
          if-no-files-found: error
          retention-days: 30
