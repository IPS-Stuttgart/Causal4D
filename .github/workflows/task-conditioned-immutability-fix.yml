name: Apply task-conditioned immutable-array policy

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/task-conditioned-immutability-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Replace reversible write flags with immutable byte-backed arrays
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/causal4d/task_conditioned_design.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = "from numpy.typing import NDArray\n"
          import_replacement = (
              "from numpy.typing import NDArray\n\n"
              "from .immutable_array import readonly_array\n"
          )
          if "from .immutable_array import readonly_array" not in text:
              if import_anchor not in text:
                  raise SystemExit("NumPy typing import anchor not found")
              text = text.replace(import_anchor, import_replacement, 1)

          replacements = {
              "    array.setflags(write=False)\n    return array\n": (
                  "    return readonly_array(array, dtype=np.float64)\n"
              ),
              "    weights.setflags(write=False)\n    return weights\n": (
                  "    return readonly_array(weights, dtype=np.float64)\n"
              ),
              "        result.setflags(write=False)\n        return result\n": (
                  "        return readonly_array(result, dtype=np.float64)\n"
              ),
              "    matrix.setflags(write=False)\n    return matrix\n": (
                  "    return readonly_array(matrix, dtype=np.float64)\n"
              ),
              "    result.setflags(write=False)\n    return result\n": (
                  "    return readonly_array(result, dtype=np.float64)\n"
              ),
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          if "setflags(write=False)" in text:
              raise SystemExit("not all reversible write-flag calls were removed")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format and run focused immutability checks
        run: |
          python -m pip install -e ".[dev]"
          python -m ruff format src/causal4d/task_conditioned_design.py
          python -m ruff check src/causal4d/task_conditioned_design.py
          python -m pytest -q \
            tests/test_task_conditioned_design.py \
            tests/test_immutable_array.py
      - name: Commit the policy correction to the PR branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causal4d/task_conditioned_design.py
          if git diff --cached --quiet; then
            echo "No correction required."
            exit 0
          fi
          git commit -m "Use irreversible immutable arrays in task-conditioned design"
          git push origin "HEAD:${BRANCH}"
