name: Optional integrations

on:
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:
    inputs:
      run_gpu:
        description: Run the self-hosted CUDA/Warp smoke job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: optional-integrations-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  vision:
    name: Vision / OpenCV CPU
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install vision dependencies
        run: |
          python -m pip install ".[dev,vision]"
          python -m pip check
      - name: Verify vision runtime
        run: |
          python - <<'PY'
          import cv2
          import PIL
          import torch

          print("OpenCV", cv2.__version__)
          print("Pillow", PIL.__version__)
          print("PyTorch", torch.__version__)
          PY
      - name: Run vision-facing Causal4D tests
        run: |
          python -m pytest -ra \
            tests/test_deform360_object_sam2.py \
            tests/test_deform360_sam2.py \
            tests/test_deform360_sam2_prefix.py \
            tests/test_deform360_sam2_suffix.py \
            tests/test_deform360_sam2_views.py \
            tests/test_deform360_splat_probe.py \
            tests/test_deform360_visual_hull.py

  bpt-vision:
    name: BayesianPhysTwin OpenCV collection
    runs-on: ubuntu-latest
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Read exact provider pin
        id: pin
        run: echo "sha=$(python scripts/ci/read_bpt_pin.py)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned public BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.pin.outputs.sha }}
          path: _bpt
          persist-credentials: false
      - name: Install BPT tests with explicit vision runtime
        run: |
          python -m pip install "./_bpt[dev]" opencv-python
          python -m pip check
      - name: Run BPT tests that collect OpenCV modules
        run: |
          python -m pytest -ra \
            _bpt/tests/test_deform360_prefix_cadence_repair.py \
            _bpt/tests/test_deform360_raw_camera_observation.py

  warp-cpu:
    name: Warp CPU boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out Causal4D
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Read exact provider pin
        id: pin
        run: echo "sha=$(python scripts/ci/read_bpt_pin.py)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned public BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.pin.outputs.sha }}
          path: _bpt
          persist-credentials: false
      - name: Install Warp CPU stack
        run: |
          python -m pip install ".[dev,warp]" ./_bpt
          python -m pip check
      - name: Verify Warp CPU runtime
        run: |
          python - <<'PY'
          import torch
          import warp as wp

          wp.init()
          print("PyTorch", torch.__version__)
          print("Warp", wp.__version__)
          print("Warp CPU", wp.get_device("cpu"))
          PY
      - name: Run Warp-boundary tests
        run: |
          python -m pytest -ra \
            tests/test_deform360_phystwin_feasibility.py \
            tests/test_deform360_replication_warp.py \
            tests/test_pokeflex_warp_source.py

  gpu:
    name: CUDA / Warp self-hosted smoke
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_gpu
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    steps:
      - name: Check out exact reviewed Causal4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Verify reviewed main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read exact provider pin
        id: pin
        run: echo "sha=$(python scripts/ci/read_bpt_pin.py)" >> "$GITHUB_OUTPUT"
      - name: Check out pinned public BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.pin.outputs.sha }}
          path: _bpt
          persist-credentials: false
      - name: Install GPU integration stack
        run: |
          python -m pip install ".[dev,vision,warp]" ./_bpt
          python -m pip check
      - name: Verify CUDA and Warp devices
        run: |
          python - <<'PY'
          import torch
          import warp as wp

          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot see CUDA")
          wp.init()
          cuda_devices = wp.get_cuda_devices()
          if not cuda_devices:
              raise SystemExit("Warp cannot see a CUDA device")
          print(torch.cuda.get_device_name(0))
          print(cuda_devices)
          PY
      - name: Run focused GPU-safe contract tests
        run: |
          python scripts/ci/run_bpt_integration_tests.py
          python -m pytest -ra \
            tests/test_deform360_phystwin_feasibility.py \
            tests/test_deform360_replication_warp.py
