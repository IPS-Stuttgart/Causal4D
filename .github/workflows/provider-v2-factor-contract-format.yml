name: Temporary provider-v2 factor formatter

on:
  push:
    branches:
      - agent/prob4d-provider-v2-factor-conformance

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/prob4d-provider-v2-factor-conformance
          persist-credentials: true
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Apply authoritative formatting and remove this workflow
        run: |
          python -m pip install "ruff==0.16.2"
          python -m ruff format \
            src/causal4d/provider_v2_factor_contract_bundle.py \
            tests/test_provider_v2_factor_contract_bundle.py
          rm .github/workflows/provider-v2-factor-contract-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/provider_v2_factor_contract_bundle.py \
            tests/test_provider_v2_factor_contract_bundle.py \
            .github/workflows/provider-v2-factor-contract-format.yml
          git diff --cached --check
          git commit -m "Apply authoritative provider-v2 formatting"
          git push origin HEAD:agent/prob4d-provider-v2-factor-conformance
