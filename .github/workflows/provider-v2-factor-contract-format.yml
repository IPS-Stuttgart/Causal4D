name: Temporary provider-v2 factor formatter

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/provider-v2-factor-contract-format.yml
      - src/causal4d/provider_v2_factor_contract_bundle.py
      - tests/test_provider_v2_factor_contract_bundle.py

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.10"
      - name: Install exact formatter
        run: python -m pip install "ruff==0.16.2"
      - name: Format and publish only the reviewed files
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python -m ruff format \
            src/causal4d/provider_v2_factor_contract_bundle.py \
            tests/test_provider_v2_factor_contract_bundle.py
          python -m ruff format --check \
            src/causal4d/provider_v2_factor_contract_bundle.py \
            tests/test_provider_v2_factor_contract_bundle.py
          if git diff --quiet -- \
            src/causal4d/provider_v2_factor_contract_bundle.py \
            tests/test_provider_v2_factor_contract_bundle.py; then
            exit 0
          fi
          changed="$(git diff --name-only)"
          expected="$(printf '%s\n' \
            src/causal4d/provider_v2_factor_contract_bundle.py \
            tests/test_provider_v2_factor_contract_bundle.py)"
          test "${changed}" = "${expected}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/provider_v2_factor_contract_bundle.py \
            tests/test_provider_v2_factor_contract_bundle.py
          git commit -m "Apply canonical provider-v2 contract formatting"
          git push origin "HEAD:${HEAD_BRANCH}"
