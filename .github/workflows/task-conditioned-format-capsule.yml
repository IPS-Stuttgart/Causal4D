name: Task-conditioned formatter capsule

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/task-conditioned-format-capsule.yml"
      - "src/causal4d/task_conditioned_design.py"
      - "scripts/experiments/task_conditioned_probe_value.py"
      - "scripts/ci/verify_task_conditioned_probe_value.py"
      - "tests/test_task_conditioned_design.py"

permissions:
  contents: read

jobs:
  format-capsule:
    name: Produce exact formatted source capsule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install "ruff==0.16.5"
      - name: Format only the new Python files
        run: |
          python -m ruff format \
            src/causal4d/task_conditioned_design.py \
            scripts/experiments/task_conditioned_probe_value.py \
            scripts/ci/verify_task_conditioned_probe_value.py \
            tests/test_task_conditioned_design.py
      - name: Upload exact formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: task-conditioned-formatted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/causal4d/task_conditioned_design.py
            scripts/experiments/task_conditioned_probe_value.py
            scripts/ci/verify_task_conditioned_probe_value.py
            tests/test_task_conditioned_design.py
          if-no-files-found: error
          retention-days: 1
