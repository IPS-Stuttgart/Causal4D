name: Task-conditioned formatter capsule

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/task-conditioned-format-capsule.yml"

permissions:
  contents: write

jobs:
  format-capsule:
    name: Apply exact formatted source capsule
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install "ruff==0.16.5"
      - name: Format only the new Python files
        run: |
          python -m ruff format \
            src/causal4d/task_conditioned_design.py \
            scripts/experiments/task_conditioned_probe_value.py \
            scripts/ci/verify_task_conditioned_probe_value.py \
            tests/test_task_conditioned_design.py
      - name: Commit exact formatter output to this PR branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/task_conditioned_design.py \
            scripts/experiments/task_conditioned_probe_value.py \
            scripts/ci/verify_task_conditioned_probe_value.py \
            tests/test_task_conditioned_design.py
          if git diff --cached --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git commit -m "Format task-conditioned probe-value sources"
          git push origin "HEAD:${BRANCH}"
