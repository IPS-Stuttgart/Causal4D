name: Deform360 filament graph support

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-filament-support.yml"
      - ".github/self-hosted-jobs.json"
      - "configs/causal4d_public/deform360_filament_support_v1.json"
      - "docs/causal4d_deform360_filament_support.md"
      - "docs/self_hosted_runner_security.md"
      - "milestones/deform360-reset-mechanics-v1/README.md"
      - "milestones/deform360-reset-mechanics-v1/summary.json"
      - "scripts/ci/resolve_locked_ancestor_fetch.py"
      - "scripts/remote/run_deform360_filament_support.py"
      - "scripts/remote/run_deform360_filament_support_workflow.sh"
      - "src/causal4d_public/deform360_filament_support.py"
      - "src/causal4d_public/deform360_replication_graph.py"
      - "src/causal4d_public/deform360_rope_graph.py"
      - "tests/test_deform360_filament_support.py"
      - "tests/test_deform360_filament_support_workflow_policy.py"
      - "tests/test_resolve_locked_ancestor_fetch.py"
      - "tests/test_self_hosted_workflow_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deform360-filament-support.yml"
      - ".github/self-hosted-jobs.json"
      - "configs/causal4d_public/deform360_filament_support_v1.json"
      - "scripts/ci/resolve_locked_ancestor_fetch.py"
      - "scripts/remote/run_deform360_filament_support.py"
      - "scripts/remote/run_deform360_filament_support_workflow.sh"
      - "src/causal4d_public/deform360_filament_support.py"
      - "src/causal4d_public/deform360_replication_graph.py"
      - "src/causal4d_public/deform360_rope_graph.py"
      - "tests/test_deform360_filament_support.py"
      - "tests/test_deform360_filament_support_workflow_policy.py"
      - "tests/test_resolve_locked_ancestor_fetch.py"
      - "tests/test_self_hosted_workflow_policy.py"
  workflow_dispatch:
    inputs:
      data_root:
        description: Optional exact derived Deform360 replication root
        required: false
        type: string
      run_source_diagnostic:
        description: Run the locked source-only structure diagnostic
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deform360-filament-support-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Lock, exact parity, boundary, formatting, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check the diagnostic surface
        run: |
          files=(
            scripts/ci/resolve_locked_ancestor_fetch.py
            scripts/remote/run_deform360_filament_support.py
            src/causal4d_public/deform360_filament_support.py
            src/causal4d_public/deform360_replication_graph.py
            src/causal4d_public/deform360_rope_graph.py
            tests/test_deform360_filament_support.py
            tests/test_deform360_filament_support_workflow_policy.py
            tests/test_resolve_locked_ancestor_fetch.py
            tests/test_self_hosted_workflow_policy.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            scripts/ci/resolve_locked_ancestor_fetch.py \
            src/causal4d_public/deform360_filament_support.py \
            src/causal4d_public/deform360_replication_graph.py \
            src/causal4d_public/deform360_rope_graph.py \
            scripts/remote/run_deform360_filament_support.py
          bash -n scripts/remote/run_deform360_filament_support_workflow.sh

      - name: Exercise the structure-only boundary
        run: |
          python -m pytest -q \
            tests/test_deform360_filament_support.py \
            tests/test_deform360_filament_support_workflow_policy.py \
            tests/test_resolve_locked_ancestor_fetch.py \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_deform360_rope_graph.py \
            tests/test_deform360_replication_graph.py \
            tests/test_deform360_reset_mechanics.py

  source-diagnostic:
    name: Locked source-only filament support evaluation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_source_diagnostic
    needs: contract
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 120
    env:
      DEFORM360_REPLICATION_ROOT: ${{ inputs.data_root }}
    steps:
      - name: Check out exact reviewed Causal4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Verify reviewed main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Initialize source-evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deform360-filament-support
          printf '%s\n' \
            '{"schema_version":1,"state":"initialized","head_sha":"'"${GITHUB_SHA}"'","run_id":"'"${GITHUB_RUN_ID}"'"}' \
            > deform360-filament-support/status.json

      - name: Resolve bounded exact ancestry fetch
        id: ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          depth="$(
            /usr/bin/python3 scripts/ci/resolve_locked_ancestor_fetch.py \
              --repository "${GITHUB_REPOSITORY}" \
              --head-sha "${GITHUB_SHA}" \
              --lock \
                configs/causal4d_public/deform360_filament_support_v1.json \
              --output \
                deform360-filament-support/locked-ancestor-fetch-plan.json
          )"
          [[ "${depth}" =~ ^[1-9][0-9]*$ ]]
          echo "fetch_depth=${depth}" >> "${GITHUB_OUTPUT}"

      - name: Fetch and verify only the locked ancestry
        env:
          FETCH_DEPTH: ${{ steps.ancestry.outputs.fetch_depth }}
        shell: bash
        run: |
          set -euo pipefail
          required_parent="$(
            /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path(
                  "deform360-filament-support/locked-ancestor-fetch-plan.json"
              ).read_text(encoding="utf-8")
          )
          print(payload["required_parent_commit"])
          PY
          )"
          ca_file=/etc/ssl/certs/ca-certificates.crt
          test -r "${ca_file}"
          git -c http.sslCAInfo="${ca_file}" fetch \
            --no-tags \
            --depth="${FETCH_DEPTH}" \
            origin "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git cat-file -e "${required_parent}^{commit}"
          git merge-base --is-ancestor "${required_parent}" HEAD
          test -z "$(git status --porcelain=v1)"

      - name: Select the conditional reproduction runtime
        shell: bash
        run: |
          set -euo pipefail
          selected="$(
            /usr/bin/python3 \
              scripts/remote/select_deform360_prefix_kinematics_python.py \
              --report deform360-filament-support/python-selection.json
          )"
          test -x "${selected}"
          echo "FILAMENT_SUPPORT_PYTHON=${selected}" >> "$GITHUB_ENV"

      - name: Run locked source structure diagnostic
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/remote/run_deform360_filament_support_workflow.sh \
            "$PWD" \
            "$PWD/deform360-filament-support" \
            2>&1 | tee deform360-filament-support/run.log
          "$FILAMENT_SUPPORT_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("deform360-filament-support/status.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "state": "completed",
                      "head_sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "python": os.environ["FILAMENT_SUPPORT_PYTHON"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deform360 filament graph support"
            echo
            echo "- Head: \`${GITHUB_SHA}\`"
            if [[ -f deform360-filament-support/result.json ]]; then
              "$FILAMENT_SUPPORT_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("deform360-filament-support/result.json").read_text(
                  encoding="utf-8"
              )
          )
          decision = result["decision"]
          print(f"- Classification: `{decision['classification']}`")
          print(f"- Passed: `{decision['passed']}`")
          print(f"- Resets: `{len(result['reset_records'])}`")
          print(f"- Registered failures: `{decision['registered_failure_reset_count']}`")
          print(f"- Candidate completions: `{decision['primary_completed_reset_count']}`")
          print(f"- Exact common parity: `{decision['exact_common_case_parity_count']}`")
          print(f"- Repaired resets: `{decision['repaired_reset_count']}`")
          print(f"- Result SHA-256: `{result['result_sha256']}`")
          PY
            else
              echo "- Diagnostic stopped before producing result.json."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-filament-support-${{ github.sha }}
          path: deform360-filament-support/
          if-no-files-found: error
          retention-days: 30
