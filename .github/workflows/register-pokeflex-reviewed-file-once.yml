# workflow-lifecycle: temporary
# workflow-owner: IPS-Stuttgart maintainers
name: Register PokeFlex reviewed-file trigger once

on:
  push:
    branches:
      - fix/pokeflex-audit-verifier-bool-type
    paths:
      - ".github/workflows/register-pokeflex-reviewed-file-once.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pokeflex-audit-verifier-bool-type
          persist-credentials: true
          fetch-depth: 0
          clean: true

      - name: Add the exact workflow/request allowlist entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_self_hosted_workflow_policy.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    "public-realworld-probe-gpuserver4090.yml": (
                  "ops/public-realworld-probe-gpuserver4090-request.json"
              ),
          '''
          insertion = anchor + '''    "pokeflex-probe-challenge-fold-audit-gpuserver4090.yml": (
                  ".github/requests/"
                  "pokeflex-probe-challenge-fold-audit-gpuserver4090-v1.json"
              ),
          '''
          if text.count(anchor) != 1:
              raise SystemExit("reviewed-file allowlist anchor changed")
          path.write_text(text.replace(anchor, insertion), encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check pytest==8.4.2 ruff==0.16.5
          python -m ruff format tests/test_self_hosted_workflow_policy.py
          python -m ruff check tests/test_self_hosted_workflow_policy.py
          pytest -q tests/test_self_hosted_workflow_policy.py
          git diff --check
          test "$(git diff --name-only)" = "tests/test_self_hosted_workflow_policy.py"

      - name: Commit only the policy registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_self_hosted_workflow_policy.py
          git commit -m "Register PokeFlex reviewed-file trigger"
          git push origin HEAD:fix/pokeflex-audit-verifier-bool-type
