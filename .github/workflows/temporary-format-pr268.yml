name: Bounded PR 268 formatter

on:
  push:
    branches:
      - agent/bind-installed-wheels-to-exact-bytes

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref == 'refs/heads/agent/bind-installed-wheels-to-exact-bytes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format the single reviewed source file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python -m pip install --disable-pip-version-check ruff==0.16.2
          python -m ruff format src/causal4d/acquisition_environment.py
          python -m ruff format --check src/causal4d/acquisition_environment.py
          python -m py_compile src/causal4d/acquisition_environment.py
          git rm .github/workflows/temporary-format-pr268.yml
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD"],
                  text=True,
              ).splitlines()
          )
          expected = {
              ".github/workflows/temporary-format-pr268.yml",
              "src/causal4d/acquisition_environment.py",
          }
          if changed != expected:
              raise SystemExit(f"unexpected formatter scope: {sorted(changed)}")
          PY
          git diff --check

      - name: Publish the ordinary formatted source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causal4d/acquisition_environment.py
          git commit -m "Format acquisition wheel binding"
          git push origin HEAD:refs/heads/agent/bind-installed-wheels-to-exact-bytes
