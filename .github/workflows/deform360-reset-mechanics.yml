name: Deform360 observed-reset mechanics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-reset-mechanics.yml"
      - "configs/causal4d_public/deform360_reset_mechanics_v1.json"
      - "docs/causal4d_deform360_reset_mechanics.md"
      - "scripts/remote/find_deform360_replication_root.py"
      - "scripts/remote/run_deform360_reset_mechanics.py"
      - "scripts/remote/run_deform360_reset_mechanics_workflow.sh"
      - "src/causal4d_public/deform360_reset_mechanics.py"
      - "tests/test_deform360_reset_mechanics.py"
      - "tests/test_deform360_reset_mechanics_workflow_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deform360-reset-mechanics.yml"
      - "configs/causal4d_public/deform360_reset_mechanics_v1.json"
      - "scripts/remote/find_deform360_replication_root.py"
      - "scripts/remote/run_deform360_reset_mechanics.py"
      - "scripts/remote/run_deform360_reset_mechanics_workflow.sh"
      - "src/causal4d_public/deform360_reset_mechanics.py"
      - "tests/test_deform360_reset_mechanics.py"
      - "tests/test_deform360_reset_mechanics_workflow_policy.py"
  workflow_dispatch:
    inputs:
      data_root:
        description: Optional exact derived Deform360 replication root
        required: false
        type: string
      run_source_diagnostic:
        description: Run the locked source-only GPU diagnostic
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deform360-reset-mechanics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Lock, aggregation, boundary, formatting, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check the diagnostic surface
        run: |
          files=(
            scripts/remote/find_deform360_replication_root.py
            scripts/remote/run_deform360_reset_mechanics.py
            src/causal4d_public/deform360_reset_mechanics.py
            tests/test_deform360_reset_mechanics.py
            tests/test_deform360_reset_mechanics_workflow_policy.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            scripts/remote/find_deform360_replication_root.py \
            src/causal4d_public/deform360_reset_mechanics.py \
            scripts/remote/run_deform360_reset_mechanics.py
          bash -n scripts/remote/run_deform360_reset_mechanics_workflow.sh

      - name: Exercise the lock and source-only boundary
        run: |
          python -m pytest -q \
            tests/test_deform360_reset_mechanics.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_replication_case.py \
            tests/test_deform360_replication_warp.py \
            tests/test_deform360_source_failure_attribution.py

  source-diagnostic:
    name: Locked source-only observed-reset evaluation
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_source_diagnostic
    needs: contract
    runs-on: [self-hosted, Linux, X64, nvidia-smi, gpuserver4090]
    timeout-minutes: 480
    env:
      DEFORM360_DOWNLOAD_ROOT: /mnt/seagate10tb/florianpfaff/datasets/deform360
      DEFORM360_REPLICATION_ROOT: ${{ inputs.data_root }}
    steps:
      - name: Check out exact reviewed Causal4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify reviewed main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Initialize source-evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deform360-reset-mechanics
          printf '%s\n' \
            '{"schema_version":1,"state":"initialized","head_sha":"'"${GITHUB_SHA}"'","run_id":"'"${GITHUB_RUN_ID}"'"}' \
            > deform360-reset-mechanics/status.json

      - name: Inventory mounted Deform360 data
        id: dataset
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import subprocess

          download_root = Path(os.environ["DEFORM360_DOWNLOAD_ROOT"]).resolve()
          raw_root = download_root / "raw"
          processed_root = download_root / "processed"
          cohort = (
              "002-rope-silk",
              "081-stripe-rope",
              "085-scarf-cloth",
              "083-blanket-cloth",
              "092-squirrel",
              "170-spider",
          )

          def directories(root: Path) -> list[str]:
              if not root.is_dir():
                  return []
              try:
                  return sorted(path.name for path in root.iterdir() if path.is_dir())
              except OSError:
                  return []

          configured = os.environ.get("DEFORM360_REPLICATION_ROOT", "").strip()
          command = [
              "/usr/bin/python3",
              "scripts/remote/find_deform360_replication_root.py",
          ]
          environment = dict(os.environ)
          if not configured:
              environment.pop("DEFORM360_REPLICATION_ROOT", None)
          resolution = subprocess.run(
              command,
              check=False,
              capture_output=True,
              text=True,
              env=environment,
          )
          resolved = resolution.stdout.strip() if resolution.returncode == 0 else ""

          raw_objects = directories(raw_root)
          processed_objects = directories(processed_root)
          report = {
              "schema_version": 1,
              "artifact_kind": "Causal4DDeform360MountedDataInventory",
              "download_root": str(download_root),
              "download_root_exists": download_root.is_dir(),
              "configured_derived_root": configured or None,
              "derived_root_ready": bool(resolved),
              "resolved_derived_root": resolved or None,
              "resolution_returncode": resolution.returncode,
              "resolution_stderr": resolution.stderr.strip() or None,
              "raw_object_count": len(raw_objects),
              "processed_object_count": len(processed_objects),
              "cohort_raw_presence": {name: name in raw_objects for name in cohort},
              "cohort_processed_presence": {
                  name: name in processed_objects for name in cohort
              },
              "top_level_directories": directories(download_root),
              "source_only": True,
              "future_outcomes_read": False,
              "dataset_modified": False,
          }
          Path("deform360-reset-mechanics/download-inventory.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"ready={'true' if resolved else 'false'}\n")
              if resolved:
                  stream.write(f"root={resolved}\n")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            uname -a
            nvidia-smi -L
            df -h "${DEFORM360_DOWNLOAD_ROOT}"
          } > deform360-reset-mechanics/runner.txt

      - name: Record derived-data readiness
        if: steps.dataset.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("deform360-reset-mechanics/status.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "state": "download_present_derived_layout_not_ready",
                      "head_sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "source_only": True,
                      "future_outcomes_read": False,
                      "dataset_modified": False,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Export resolved derived-data root
        if: steps.dataset.outputs.ready == 'true'
        shell: bash
        env:
          RESOLVED_ROOT: ${{ steps.dataset.outputs.root }}
        run: |
          set -euo pipefail
          test -n "${RESOLVED_ROOT}"
          echo "DEFORM360_REPLICATION_ROOT=${RESOLVED_ROOT}" >> "$GITHUB_ENV"

      - name: Select the conditional reproduction runtime
        if: steps.dataset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          selected="$(
            /usr/bin/python3 \
              scripts/remote/select_deform360_prefix_kinematics_python.py \
              --report deform360-reset-mechanics/python-selection.json
          )"
          test -x "${selected}"
          echo "RESET_MECHANICS_PYTHON=${selected}" >> "$GITHUB_ENV"

      - name: Read locked repository pins
        if: steps.dataset.outputs.ready == 'true'
        id: repository-pins
        shell: bash
        run: |
          set -euo pipefail
          "$RESET_MECHANICS_PYTHON" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "configs/causal4d_public/deform360_replication_v1.json"
              ).read_text(encoding="utf-8")
          )["config"]
          pins = {
              "bpt_sha": subprocess.check_output(
                  [sys.executable, "scripts/ci/read_bpt_pin.py"],
                  text=True,
              ).strip(),
              "deform360_sha": protocol["deform360_code_commit"],
              "official_phystwin_sha": protocol["official_phystwin_commit"],
          }
          for name, value in pins.items():
              if type(value) is not str or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"{name} is not a lowercase 40-hex commit")
              print(f"{name}={value}")
          PY

      - name: Check out pinned public BayesianPhysTwin
        if: steps.dataset.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.repository-pins.outputs.bpt_sha }}
          path: _bpt
          persist-credentials: false
          clean: true

      - name: Check out pinned Deform360 code
        if: steps.dataset.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ steps.repository-pins.outputs.deform360_sha }}
          path: _deform360
          persist-credentials: false
          clean: true

      - name: Check out pinned official PhysTwin
        if: steps.dataset.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jianghanxiao/PhysTwin
          ref: ${{ steps.repository-pins.outputs.official_phystwin_sha }}
          path: _official_phystwin
          persist-credentials: false
          clean: true

      - name: Run locked source diagnostic
        if: steps.dataset.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/remote/run_deform360_reset_mechanics_workflow.sh \
            "$PWD" \
            "$PWD/_bpt" \
            "$PWD/_deform360" \
            "$PWD/_official_phystwin" \
            "$PWD/deform360-reset-mechanics" \
            2>&1 | tee deform360-reset-mechanics/run.log
          "$RESET_MECHANICS_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("deform360-reset-mechanics/status.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "state": "completed",
                      "head_sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "python": os.environ["RESET_MECHANICS_PYTHON"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deform360 observed-reset mechanics"
            echo
            echo "- Head: \`${GITHUB_SHA}\`"
            /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          inventory_path = Path(
              "deform360-reset-mechanics/download-inventory.json"
          )
          if inventory_path.is_file():
              inventory = json.loads(inventory_path.read_text(encoding="utf-8"))
              print(
                  "- Download root: "
                  f"`{inventory['download_root']}` "
                  f"(exists={inventory['download_root_exists']})"
              )
              print(
                  "- Raw objects visible: "
                  f"`{inventory['raw_object_count']}`; "
                  "processed objects visible: "
                  f"`{inventory['processed_object_count']}`"
              )
              print(
                  "- Derived layout ready: "
                  f"`{inventory['derived_root_ready']}`"
              )
              if inventory["resolved_derived_root"]:
                  print(
                      "- Resolved derived root: "
                      f"`{inventory['resolved_derived_root']}`"
                  )
          PY
            if [[ -f deform360-reset-mechanics/result.json ]]; then
              "$RESET_MECHANICS_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(
              Path("deform360-reset-mechanics/result.json").read_text(
                  encoding="utf-8"
              )
          )
          decision = result["decision"]
          print(f"- Classification: `{decision['classification']}`")
          print(f"- Passed: `{decision['passed']}`")
          print(f"- Episodes: `{len(result['episode_records'])}`")
          print(f"- Result SHA-256: `{result['result_sha256']}`")
          for key, value in decision["horizon_summaries"].items():
              print(
                  f"- {key}: improvement="
                  f"{value['relative_improvement_vs_persistence']}, "
                  f"wins={value['episode_win_fraction']}, "
                  f"quality={value['mean_quality_valid_fraction']}, "
                  f"passed={value['passed']}"
              )
          PY
            else
              echo "- No derived-data result was produced in this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-reset-mechanics-${{ github.sha }}
          path: deform360-reset-mechanics/
          if-no-files-found: error
          retention-days: 30
