name: Temporary format support adequacy

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  push:
    branches:
      - agent/finite-support-adequacy-certificate

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'agent/finite-support-adequacy-certificate'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Install pinned formatter
        run: python -m pip install "ruff==0.16.2"
      - name: Apply canonical formatting
        run: |
          python -m ruff format \
            src/causal4d/_support_adequacy.py \
            src/causal4d/_support_adequacy_io.py \
            src/causal4d/support_adequacy.py \
            tests/test_support_adequacy.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Files already match canonical Ruff formatting."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/_support_adequacy.py \
            src/causal4d/_support_adequacy_io.py \
            src/causal4d/support_adequacy.py \
            tests/test_support_adequacy.py
          git commit -m "Apply canonical Ruff formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
