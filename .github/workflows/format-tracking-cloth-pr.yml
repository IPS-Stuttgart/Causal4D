name: Format Tracking Cloth PR branch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/format-tracking-cloth-pr.yml"
      - "src/causal4d_public/tracking_cloth_query_observation.py"
      - "tests/test_tracking_cloth_query_observation.py"

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'science/tracking-cloth-task-observation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Apply repository Ruff formatting and push only the two focused files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'ruff==0.16.5'
          python -m ruff format \
            src/causal4d_public/tracking_cloth_query_observation.py \
            tests/test_tracking_cloth_query_observation.py
          if git diff --quiet -- \
            src/causal4d_public/tracking_cloth_query_observation.py \
            tests/test_tracking_cloth_query_observation.py; then
            echo 'Files already match Ruff formatting.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/causal4d_public/tracking_cloth_query_observation.py \
            tests/test_tracking_cloth_query_observation.py
          git commit -m 'Format Tracking Cloth evaluation sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
