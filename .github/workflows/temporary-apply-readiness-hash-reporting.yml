name: Temporary apply readiness hash-reporting patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-readiness-hash-reporting-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the staged readiness reporting patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/report-readiness-hash-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply function-bounded source substitutions and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test -z "$(git status --porcelain=v1)"
          python - <<'PY'
          from pathlib import Path

          probe_path = Path("scripts/ci/probe_self_hosted_acquisition.py")
          probe = probe_path.read_text(encoding="utf-8")
          start_marker = "def _next_action_summary("
          end_marker = "\n\ndef _unselected_path_status"
          if probe.count(start_marker) != 1 or probe.count(end_marker) != 1:
              raise SystemExit("next-action function boundaries are not unique")
          start = probe.index(start_marker)
          end = probe.index(end_marker, start)
          block = probe[start:end]
          try_marker = (
              "    try:\n"
              "        decision = build_preacquisition_operator_next_action(\n"
          )
          if block.count(try_marker) != 1:
              raise SystemExit("next-action builder boundary is not unique")
          if block.count("            verify_file_hashes=True,\n") != 1:
              raise SystemExit("hash-verification argument boundary is not unique")
          old_field = (
              '            "verify_file_hashes": '
              'decision.get("verify_file_hashes") is True,\n'
          )
          if block.count(old_field) != 1:
              raise SystemExit("verification-report field boundary is not unique")
          block = block.replace(
              try_marker,
              "    verify_file_hashes = True\n" + try_marker,
          )
          block = block.replace(
              "            verify_file_hashes=True,\n",
              "            verify_file_hashes=verify_file_hashes,\n",
          )
          block = block.replace(
              old_field,
              '            "verify_file_hashes": verify_file_hashes,\n',
          )
          probe_path.write_text(probe[:start] + block + probe[end:], encoding="utf-8")

          test_path = Path("tests/test_self_hosted_acquisition_probe.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_build_report_derives_action_from_selected_pair(\n"
          inserted = '''def test_next_action_summary_reports_the_requested_hash_verification(
              tmp_path: Path,
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              repository, dataset = _complete_pair(tmp_path, "persistent")
              observed: dict[str, object] = {}

              def build_decision(
                  repository_root: Path,
                  dataset_root: Path,
                  *,
                  verify_file_hashes: bool,
              ) -> dict[str, object]:
                  observed["repository_root"] = repository_root
                  observed["dataset_root"] = dataset_root
                  observed["verify_file_hashes"] = verify_file_hashes
                  return {
                      "protocol_id": "protocol-v1",
                      "valid": True,
                      "ready": False,
                      "action": {
                          "action_id": "seal_operator_registry",
                          "category": "manual_evidence",
                          "operator_role": "principal_investigator",
                          "physical_acquisition_required": False,
                          "automatable": False,
                          "target_outcomes_permitted": False,
                          "blocking_items": [],
                      },
                  }

              monkeypatch.setattr(
                  probe,
                  "build_preacquisition_operator_next_action",
                  build_decision,
              )

              summary, error = probe._next_action_summary(repository, dataset)

              assert error is None
              assert observed["verify_file_hashes"] is True
              assert summary is not None
              assert summary["verify_file_hashes"] is True


          '''
          if "test_next_action_summary_reports_the_requested_hash_verification" in tests:
              raise SystemExit("hash-verification regression already exists")
          if tests.count(marker) != 1:
              raise SystemExit("test insertion boundary is not unique")
          test_path.write_text(tests.replace(marker, inserted + marker), encoding="utf-8")
          PY
          git rm \
            ci/temporary-readiness-hash-reporting.patch \
            .github/workflows/temporary-apply-readiness-hash-reporting.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the patched source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff format \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          python -m ruff check \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          python -m ruff format --check \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          python -m pytest -q \
            tests/test_self_hosted_acquisition_probe.py \
            tests/test_self_hosted_workflow_policy.py

      - name: Commit the validated patch to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          git diff --cached --check
          git commit -m 'Report readiness hash verification accurately'
          git push origin "HEAD:${HEAD_BRANCH}"
