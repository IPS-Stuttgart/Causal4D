name: Temporary apply readiness hash-reporting patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-readiness-hash-reporting-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the staged readiness reporting patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/report-readiness-hash-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Apply the staged patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test -z "$(git status --porcelain=v1)"
          patch=ci/temporary-readiness-hash-reporting.patch
          git apply --check "${patch}"
          git apply "${patch}"
          git rm \
            "${patch}" \
            .github/workflows/temporary-apply-readiness-hash-reporting.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the patched source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff format \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          python -m ruff check \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          python -m ruff format --check \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          python -m pytest -q \
            tests/test_self_hosted_acquisition_probe.py \
            tests/test_self_hosted_workflow_policy.py

      - name: Commit the validated patch to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/probe_self_hosted_acquisition.py \
            tests/test_self_hosted_acquisition_probe.py
          git diff --cached --check
          git commit -m 'Report readiness hash verification accurately'
          git push origin "HEAD:${HEAD_BRANCH}"
