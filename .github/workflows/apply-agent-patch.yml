name: Apply validated agent patch

on:
  push:
    branches:
      - agent/registered-cross-branch-stability-gate

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and validate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-patch/part-*.b64 | base64 --decode | xz --decompress > /tmp/agent.patch
          git apply --check /tmp/agent.patch
          git apply /tmp/agent.patch
          git diff --check
          python -m compileall -q src/causal4d/cross_branch_query_covariance.py src/causal4d/prequential_stability_gate.py

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs src tests
          git commit -m 'Add registered contrast covariance and stability gate [agent-patch-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
