name: Apply artifact and index hardening

on:
  push:
    branches:
      - agent/harden-artifact-index-boundaries

permissions:
  contents: write

concurrency:
  group: apply-artifact-index-hardening-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.ref == 'refs/heads/agent/harden-artifact-index-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: agent/harden-artifact-index-boundaries

      - name: Verify the bounded transport scope
        shell: bash
        run: |
          set -euo pipefail
          base=ef79adf7a6b5e00f489676b24108d80aeee42a3b
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t actual < <(git diff --name-only "$base"...HEAD | sort)
          expected=(
            .github/workflows/apply-artifact-index-hardening.yml
            scripts/ci/apply_artifact_index_hardening.py
            src/causal4d/numpy_archive.py
            src/causal4d/trusted_pickle.py
            tests/test_artifact_index_hardening.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual[@]}")

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply the exact source transformation
        run: python scripts/ci/apply_artifact_index_hardening.py

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Format and lint the final source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/causal4d/intervention_abduction.py
            src/causal4d/numpy_archive.py
            src/causal4d/phystwin_backend.py
            src/causal4d/prefix_likelihood.py
            src/causal4d/rollout_bank.py
            src/causal4d/trusted_pickle.py
            tests/test_artifact_index_hardening.py
          )
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            src/causal4d/intervention_abduction.py \
            src/causal4d/numpy_archive.py \
            src/causal4d/phystwin_backend.py \
            src/causal4d/prefix_likelihood.py \
            src/causal4d/rollout_bank.py \
            src/causal4d/trusted_pickle.py \
            tests/test_artifact_index_hardening.py

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_artifact_index_hardening.py \
            tests/test_trusted_pickle.py \
            tests/test_causal4d_rollout_bank.py

      - name: Run the complete core suite
        run: python -m pytest -q

      - name: Build the wheel
        run: python -m build --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Verify the final reviewable scope
        shell: bash
        run: |
          set -euo pipefail
          base=ef79adf7a6b5e00f489676b24108d80aeee42a3b
          test ! -e .github/workflows/apply-artifact-index-hardening.yml
          test ! -e scripts/ci/apply_artifact_index_hardening.py
          mapfile -t actual < <(git diff --name-only "$base" | sort)
          expected=(
            CHANGELOG.md
            src/causal4d/intervention_abduction.py
            src/causal4d/numpy_archive.py
            src/causal4d/phystwin_backend.py
            src/causal4d/prefix_likelihood.py
            src/causal4d/rollout_bank.py
            src/causal4d/trusted_pickle.py
            tests/test_artifact_index_hardening.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u \
            <(printf '%s\n' "${expected_sorted[@]}") \
            <(printf '%s\n' "${actual[@]}")
          git diff --check

      - name: Publish the ordinary source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden artifact and index boundaries"
          git push origin HEAD:refs/heads/agent/harden-artifact-index-boundaries
