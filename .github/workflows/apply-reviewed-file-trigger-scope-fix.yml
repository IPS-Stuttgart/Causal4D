name: Apply reviewed-file trigger scope fix

on:
  push:
    branches:
      - fix/deform360-gpuserver6000-four-object-policy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out policy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/deform360-gpuserver6000-four-object-policy
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply and validate trigger-scope correction
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_reviewed_file_trigger_scope_fix.py
          python -m pip install -e ".[dev]"
          python -m ruff check \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_deform360_gpuserver6000_workflow_policy.py
          python -m ruff format --check \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_deform360_gpuserver6000_workflow_policy.py
          python -m pytest -q \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_deform360_gpuserver6000_workflow_policy.py
          git diff --check

      - name: Commit validated policy correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_self_hosted_workflow_policy.py
          git diff --cached --check
          git commit -m "Scope reviewed request uniqueness to the push trigger"
          git push origin HEAD:fix/deform360-gpuserver6000-four-object-policy
