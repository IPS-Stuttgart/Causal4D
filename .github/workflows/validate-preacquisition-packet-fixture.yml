name: Repair and validate preacquisition packet fixtures

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: packet-fixture-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.actor == 'FlorianPfaff' &&
      github.event.pull_request.head.repo.full_name == 'IPS-Stuttgart/Causal4D' &&
      github.event.pull_request.head.ref == 'fix/preacquisition-packet-verifier-fixture'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/preacquisition-packet-verifier-fixture
          fetch-depth: 1
          persist-credentials: true

      - name: Apply the exact undefined-name repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object tests/test_preacquisition_next_action_packet.py)" = \
            fe2b78c5fd34adcc9176ce4000ab4fc3a7a89146
          perl -0pi -e 's/        readiness\.cli,/        readiness_cli,/' \
            tests/test_preacquisition_next_action_packet.py
          test "$(grep -c 'readiness\.cli' tests/test_preacquisition_next_action_packet.py)" = 0
          test "$(grep -c '        readiness_cli,' tests/test_preacquisition_next_action_packet.py)" = 1
          git diff --check

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Repair the isolated pip installation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sysconfig

          purelib = Path(sysconfig.get_paths()["purelib"])
          for candidate in purelib.glob("pip*"):
              if candidate.name == "pip" or candidate.name.startswith("pip-"):
                  if candidate.is_dir():
                      shutil.rmtree(candidate)
                  else:
                      candidate.unlink()
          PY
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip

      - name: Run the affected acquisition tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check tests/test_preacquisition_next_action_packet.py
          python -m ruff format --check tests/test_preacquisition_next_action_packet.py
          PYTHONPATH=src python -m pytest -q \
            tests/test_preacquisition_next_action_packet.py \
            tests/test_preacquisition_next_action.py
          git diff --check

      - name: Commit the validated undefined-name repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_preacquisition_next_action_packet.py
          git commit -m "Fix packet fixture readiness module reference"
          git push origin HEAD:fix/preacquisition-packet-verifier-fixture
