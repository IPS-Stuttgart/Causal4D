name: Validate preacquisition packet fixture repair

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: packet-fixture-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.repository == 'IPS-Stuttgart/Causal4D' &&
      github.actor == 'FlorianPfaff' &&
      github.event.pull_request.head.repo.full_name == 'IPS-Stuttgart/Causal4D' &&
      github.event.pull_request.head.ref == 'fix/preacquisition-packet-verifier-fixture'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out the exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/preacquisition-packet-verifier-fixture
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Repair the isolated pip installation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          import sysconfig

          purelib = Path(sysconfig.get_paths()["purelib"])
          for candidate in purelib.glob("pip*"):
              if candidate.name == "pip" or candidate.name.startswith("pip-"):
                  if candidate.is_dir():
                      shutil.rmtree(candidate)
                  else:
                      candidate.unlink()
          PY
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip

      - name: Run the affected acquisition tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff check tests/test_preacquisition_next_action_packet.py
          python -m ruff format --check tests/test_preacquisition_next_action_packet.py
          PYTHONPATH=src python -m pytest -q \
            tests/test_preacquisition_next_action_packet.py \
            tests/test_preacquisition_next_action.py
          git diff --check
