name: Sensor reveal canonicalization

on:
  pull_request:
    paths:
      - ".github/workflows/sensor-reveal-canonicalize.yml"
      - "src/causal4d/_sensor_reveal_case.py"
      - "src/causal4d/_sensor_reveal_execution.py"
      - "src/causal4d/_sensor_reveal_submission.py"
      - "src/causal4d/sensor_reveal_verifier.py"
      - "tests/test_sensor_reveal_challenge.py"
      - "scripts/experiments/proof_carrying_sensor_reveal.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            pytest==8.4.2 \
            ruff==0.16.5

      - name: Canonicalize sources
        run: |
          python -m ruff format \
            src/causal4d/_sensor_reveal_case.py \
            src/causal4d/_sensor_reveal_execution.py \
            src/causal4d/_sensor_reveal_submission.py \
            src/causal4d/sensor_reveal_verifier.py \
            tests/test_sensor_reveal_challenge.py \
            scripts/experiments/proof_carrying_sensor_reveal.py
          python -m ruff check \
            src/causal4d/_sensor_reveal_common.py \
            src/causal4d/_sensor_reveal_case.py \
            src/causal4d/_sensor_reveal_execution.py \
            src/causal4d/_sensor_reveal_submission.py \
            src/causal4d/sensor_reveal_challenge.py \
            src/causal4d/sensor_reveal_verifier.py \
            tests/test_sensor_reveal_challenge.py \
            scripts/experiments/proof_carrying_sensor_reveal.py

      - name: Run focused tests and deterministic study
        env:
          PYTHONPATH: src
        run: |
          pytest -q \
            tests/test_active_decision_identification.py \
            tests/test_probe_quotient_audit.py \
            tests/test_sequential_decision_identification.py \
            tests/test_sensor_reveal_challenge.py
          mkdir -p build/sensor-reveal-canonicalization
          python scripts/experiments/proof_carrying_sensor_reveal.py \
            --output build/sensor-reveal-canonicalization/result-a.json
          python scripts/experiments/proof_carrying_sensor_reveal.py \
            --output build/sensor-reveal-canonicalization/result-b.json
          cmp \
            build/sensor-reveal-canonicalization/result-a.json \
            build/sensor-reveal-canonicalization/result-b.json

      - name: Commit canonical formatting to the source branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/_sensor_reveal_case.py \
            src/causal4d/_sensor_reveal_execution.py \
            src/causal4d/_sensor_reveal_submission.py \
            src/causal4d/sensor_reveal_verifier.py \
            tests/test_sensor_reveal_challenge.py \
            scripts/experiments/proof_carrying_sensor_reveal.py
          if git diff --cached --quiet; then
            echo "Canonical formatting already committed."
            exit 0
          fi
          git commit -m "Apply canonical sensor-reveal formatting"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload canonical files and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: sensor-reveal-canonical-${{ github.sha }}
          path: |
            src/causal4d/_sensor_reveal_case.py
            src/causal4d/_sensor_reveal_execution.py
            src/causal4d/_sensor_reveal_submission.py
            src/causal4d/sensor_reveal_verifier.py
            tests/test_sensor_reveal_challenge.py
            scripts/experiments/proof_carrying_sensor_reveal.py
            build/sensor-reveal-canonicalization/result-a.json
          if-no-files-found: error
          retention-days: 7
