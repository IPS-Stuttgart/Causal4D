name: Format external bridge trust branch

on:
  push:
    branches:
      - agent/external-bridge-trust-gate
    paths:
      - .github/workflows/format-external-bridge-trust.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'IPS-Stuttgart/Causal4D'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/external-bridge-trust-gate
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install the repository-pinned Ruff range
        run: python -m pip install 'ruff>=0.15.22,<0.17'

      - name: Format the bridge trust changes
        run: |
          python -m ruff format \
            src/causal4d/_external_bridge_publication.py \
            src/causal4d/_external_bridge_trust_analysis.py \
            src/causal4d/_external_bridge_trust_calibration.py \
            src/causal4d/_external_bridge_trust_fit.py \
            src/causal4d/_external_bridge_trust_io.py \
            src/causal4d/_external_bridge_trust_validation.py \
            src/causal4d/cli/external_bridge_fit_trust.py

      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Ruff produced no changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/causal4d/_external_bridge_publication.py \
            src/causal4d/_external_bridge_trust_analysis.py \
            src/causal4d/_external_bridge_trust_calibration.py \
            src/causal4d/_external_bridge_trust_fit.py \
            src/causal4d/_external_bridge_trust_io.py \
            src/causal4d/_external_bridge_trust_validation.py \
            src/causal4d/cli/external_bridge_fit_trust.py
          git commit -m 'Format external bridge trust gate'
          git push origin HEAD:agent/external-bridge-trust-gate
