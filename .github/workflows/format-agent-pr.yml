name: Format agent PR once

on:
  push:
    branches:
      - agent/registered-cross-branch-stability-gate

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install exact CI formatter
        run: python -m pip install 'ruff==0.16.3'

      - name: Format changed Python files
        run: |
          python -m ruff format \
            src/causal4d/_interventional_contrast_bounds.py \
            src/causal4d/_interventional_contrast_build.py \
            src/causal4d/cross_branch_query_covariance.py \
            src/causal4d/prequential_stability_gate.py \
            tests/test_interventional_contrast.py \
            tests/test_interventional_contrast_bounds.py
          python -m ruff format --check \
            src/causal4d/_interventional_contrast_bounds.py \
            src/causal4d/_interventional_contrast_build.py \
            src/causal4d/cross_branch_query_covariance.py \
            src/causal4d/prequential_stability_gate.py \
            tests/test_interventional_contrast.py \
            tests/test_interventional_contrast_bounds.py
          git diff --check

      - name: Commit formatting and remove helper workflow
        run: |
          set -euo pipefail
          rm .github/workflows/format-agent-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests .github/workflows/format-agent-pr.yml
          git commit -m 'Format registered covariance and stability gate [format-applied]'
          git push origin HEAD:${GITHUB_REF_NAME}
