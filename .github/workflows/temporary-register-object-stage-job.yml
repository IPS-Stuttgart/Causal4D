name: Temporary register object-stage self-hosted job

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-register-object-stage-job.yml"
      - ".github/self-hosted-jobs.json"
      - "tests/test_self_hosted_workflow_policy.py"
      - "tests/test_issue_command_concurrency.py"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Register the exact authorization and concurrency policies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path(".github/self-hosted-jobs.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          registry["authorization_models"][
              "object-registration-input-stage-issue-main"
          ] = {
              "description": (
                  "Exact registered-maintainer issue trigger on reviewed "
                  "refs/heads/main for source-only object-registration node-set "
                  "staging, exact GITHUB_SHA checkout, clean-tree verification, "
                  "byte-accounted dataset additions with rollback, read-only "
                  "self-hosted token, no issue text execution, and no secrets."
              )
          }
          entry = {
              "workflow": "stage-object-registration-inputs-self-hosted.yml",
              "job": "stage",
              "authorization_model": (
                  "object-registration-input-stage-issue-main"
              ),
              "runner_labels": [
                  "self-hosted",
                  "Linux",
                  "X64",
                  "nvidia-smi",
                  "data-causal4d-physical-v1",
              ],
              "purpose": (
                  "Stage exact approved source-only node sets before manual "
                  "object registration"
              ),
              "dataset_access": (
                  "registered-local-preacquisition-object-registration-"
                  "node-set-stage"
              ),
              "secrets_allowed": False,
          }
          jobs = [
              item
              for item in registry["jobs"]
              if not (
                  item["workflow"]
                  == "stage-object-registration-inputs-self-hosted.yml"
                  and item["job"] == "stage"
              )
          ]
          jobs.append(entry)
          registry["jobs"] = sorted(
              jobs,
              key=lambda item: (item["workflow"], item["job"]),
          )
          registry_path.write_text(
              json.dumps(registry, indent=2, sort_keys=False) + "\n",
              encoding="utf-8",
          )

          policy_path = Path("tests/test_self_hosted_workflow_policy.py")
          policy = policy_path.read_text(encoding="utf-8")
          marker = '''def _authorization_errors(
              authorization_model: str,
              workflow_text: str,
              block: str,
          ) -> list[str]:
          '''
          marker = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in marker.splitlines()
          )
          helper = '''def _object_registration_input_stage_issue_main_errors(
              workflow_text: str,
              block: str,
          ) -> list[str]:
              return _exact_maintainer_issue_errors(
                  workflow_text,
                  block,
                  trigger_title=(
                      "[self-hosted] stage Causal4D object-registration inputs"
                  ),
              )


          '''
          helper = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in helper.splitlines()
          )
          if helper.strip() not in policy:
              if policy.count(marker) != 1:
                  raise SystemExit("authorization function marker changed")
              policy = policy.replace(marker, helper + marker)

          before = '''    if authorization_model == "v5-checkout-reprovision-issue-main":
              return _v5_checkout_reprovision_issue_main_errors(workflow_text, block)
              return [f"unsupported authorization model: {authorization_model}"]
          '''
          before = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in before.splitlines()
          )
          after = '''    if authorization_model == "v5-checkout-reprovision-issue-main":
              return _v5_checkout_reprovision_issue_main_errors(workflow_text, block)
              if authorization_model == "object-registration-input-stage-issue-main":
                  return _object_registration_input_stage_issue_main_errors(
                      workflow_text,
                      block,
                  )
              return [f"unsupported authorization model: {authorization_model}"]
          '''
          after = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in after.splitlines()
          )
          if (
              "object-registration-input-stage-issue-main" not in policy
              or "def _object_registration_input_stage_issue_main_errors" in policy
          ):
              if before in policy:
                  policy = policy.replace(before, after)
          if (
              '        "object-registration-input-stage-issue-main",\n'
              not in policy
          ):
              expected = '''        "main-only",
                  "maintainer-issue-main",
                  "single-operator-v5-issue-main",
                  "v5-checkout-reprovision-issue-main",
              '''
              expected = "\n".join(
                  line[12:] if line.startswith("            ") else line
                  for line in expected.splitlines()
              )
              replacement = '''        "main-only",
                  "maintainer-issue-main",
                  "object-registration-input-stage-issue-main",
                  "single-operator-v5-issue-main",
                  "v5-checkout-reprovision-issue-main",
              '''
              replacement = "\n".join(
                  line[12:] if line.startswith("            ") else line
                  for line in replacement.splitlines()
              )
              if policy.count(expected) != 1:
                  raise SystemExit("authorization-model set marker changed")
              policy = policy.replace(expected, replacement)
          policy_path.write_text(policy, encoding="utf-8")

          concurrency_path = Path("tests/test_issue_command_concurrency.py")
          concurrency = concurrency_path.read_text(encoding="utf-8")
          entry_text = '''    "stage-object-registration-inputs-self-hosted.yml": (
              "stage",
              "causal4d-object-registration-input-stage-${{ github.sha }}",
          ),
          '''
          entry_text = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in entry_text.splitlines()
          )
          if entry_text.strip() not in concurrency:
              marker = '''    "reprovision-v5-checkout-self-hosted.yml": (
                  "reprovision",
                  "causal4d-v5-checkout-reprovision-${{ github.sha }}",
              ),
          '''
              marker = "\n".join(
                  line[12:] if line.startswith("            ") else line
                  for line in marker.splitlines()
              )
              if concurrency.count(marker) != 1:
                  raise SystemExit("issue-concurrency marker changed")
              concurrency = concurrency.replace(marker, marker + entry_text)
          concurrency_path.write_text(concurrency, encoding="utf-8")
          PY

      - name: Format and verify policy registries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_issue_command_concurrency.py
          python -m ruff check \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_issue_command_concurrency.py
          pytest -q \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_issue_command_concurrency.py \
            tests/test_self_hosted_object_registration_input_stage.py

      - name: Commit the policy records and remove this workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary-register-object-stage-job.yml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/self-hosted-jobs.json \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_issue_command_concurrency.py
          git commit -m "Register object-stage self-hosted job"
          git push origin "HEAD:${HEAD_BRANCH}"
