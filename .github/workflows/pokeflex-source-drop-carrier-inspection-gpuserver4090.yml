name: PokeFlex source drop-carrier inspection

on:
  push:
    branches:
      - science/pokeflex-sequential-probe-source-v1
    paths:
      - ".github/requests/pokeflex-source-drop-carrier-inspection-gpuserver4090-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect source-only drop carriers on gpuserver4090
    runs-on: [self-hosted, Linux, X64, gpuserver4090]
    timeout-minutes: 90
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          clean: true

      - name: Validate request and script
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          request = json.loads(
              Path(
                  ".github/requests/"
                  "pokeflex-source-drop-carrier-inspection-gpuserver4090-v1.json"
              ).read_text(encoding="utf-8")
          )
          assert request["schema"] == (
              "causal4d/pokeflex-source-drop-state-carrier-inspection-request"
          )
          assert len(request["source_and_calibration_objects"]) == 12
          assert len(request["target_objects_excluded"]) == 6
          assert set(request["source_and_calibration_objects"]).isdisjoint(
              request["target_objects_excluded"]
          )
          assert request["dropping_take_indices"] == [1, 2, 3]
          PY
          python3 -m py_compile \
            scripts/remote/inspect_pokeflex_source_drop_state_carriers.py

      - name: Inspect bounded source-only carrier samples
        run: |
          rm -rf build/pokeflex-source-drop-carrier-inspection
          mkdir -p build/pokeflex-source-drop-carrier-inspection
          python3 scripts/remote/inspect_pokeflex_source_drop_state_carriers.py \
            --root /mnt/seagate10tb/florianpfaff/datasets/pokeflex \
            --request \
              .github/requests/pokeflex-source-drop-carrier-inspection-gpuserver4090-v1.json \
            --output build/pokeflex-source-drop-carrier-inspection/result.json

      - name: Summarize suffixes and representative headers
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(
              Path(
                  "build/pokeflex-source-drop-carrier-inspection/result.json"
              ).read_text(encoding="utf-8")
          )
          print("# PokeFlex source drop-carrier inspection")
          print()
          print("Suffix counts:", result["global_suffix_counts"])
          print()
          first = result["archives"][0]
          print("Representative archive:", first["archive_relative_path"])
          for row in first["representatives"]:
              print("-", row["member"], row["bytes"], row["printable_prefix"][:120])
          print()
          print("Target archive opens: 0")
          PY

      - name: Record provenance
        if: always()
        run: |
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "head_sha=${GITHUB_SHA}"
          } > build/pokeflex-source-drop-carrier-inspection/runner.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pokeflex-source-drop-carrier-inspection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/pokeflex-source-drop-carrier-inspection/
            .github/requests/pokeflex-source-drop-carrier-inspection-gpuserver4090-v1.json
          if-no-files-found: error
          retention-days: 30
