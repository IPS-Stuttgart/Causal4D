name: Self-hosted research evaluation

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Evaluation scale
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
          - full
      run_bpt:
        description: Run the pinned BayesianPhysTwin provider checks
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: self-hosted-evaluation-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  EVAL_PROFILE: ${{ inputs.profile || 'standard' }}

jobs:
  evaluate:
    name: Higher-powered controlled and GPU diagnostics
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 480
    steps:
      - name: Check out exact reviewed Causal4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify reviewed main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Create isolated environment
        shell: bash
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=${PWD}/.venv" >> "${GITHUB_ENV}"
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Record runner and GPU identity
        shell: bash
        run: |
          mkdir -p self-hosted-evaluation/wheels
          {
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "profile=${EVAL_PROFILE}"
            uname -a
            lscpu
          } | tee self-hosted-evaluation/runner-info.txt
          nvidia-smi | tee self-hosted-evaluation/nvidia-smi.txt

      - name: Build and install exact Causal4D wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip "build>=1.2"
          python -m build --wheel --outdir self-hosted-evaluation/wheels .
          causal4d_wheel="$(
            find self-hosted-evaluation/wheels -maxdepth 1 \
              -name 'causal4d-*.whl' -print -quit
          )"
          test -n "${causal4d_wheel}"
          sha256sum "${causal4d_wheel}" \
            | tee self-hosted-evaluation/wheel-sha256.txt
          python -m pip install \
            "${causal4d_wheel}" \
            "pytest>=8" \
            "torch>=2.0" \
            "warp-lang>=1.0"
          python -m pip check
          python - <<'PY'
          from pathlib import Path

          import causal4d

          source_root = (Path.cwd() / "src").resolve()
          origin = Path(causal4d.__file__).resolve()
          print("Causal4D import", origin)
          if origin.is_relative_to(source_root):
              raise SystemExit("Causal4D resolved from the checkout instead of the wheel")
          PY

      - name: Verify CUDA and run a Warp parity probe
        shell: bash
        run: |
          cat > self-hosted-evaluation/warp_parity_probe.py <<'PY'
          import json
          from pathlib import Path
          import time

          import numpy as np
          import torch
          import warp as wp

          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot see CUDA")
          wp.init()
          devices = wp.get_cuda_devices()
          if not devices:
              raise SystemExit("Warp cannot see a CUDA device")

          @wp.kernel
          def affine(
              source: wp.array(dtype=wp.float32),
              target: wp.array(dtype=wp.float32),
          ):
              index = wp.tid()
              target[index] = source[index] * 1.0001 + 0.001

          values = np.linspace(-1.0, 1.0, 1_000_000, dtype=np.float32)

          def run(device: str) -> tuple[np.ndarray, float]:
              source = wp.array(values, dtype=wp.float32, device=device)
              target = wp.empty(values.size, dtype=wp.float32, device=device)
              for _ in range(3):
                  wp.launch(
                      affine,
                      dim=values.size,
                      inputs=[source, target],
                      device=device,
                  )
              wp.synchronize()
              started = time.perf_counter()
              for _ in range(20):
                  wp.launch(
                      affine,
                      dim=values.size,
                      inputs=[source, target],
                      device=device,
                  )
              wp.synchronize()
              return target.numpy(), time.perf_counter() - started

          cpu_values, cpu_seconds = run("cpu")
          gpu_values, gpu_seconds = run("cuda:0")
          max_difference = float(np.max(np.abs(cpu_values - gpu_values)))
          payload = {
              "torch_version": torch.__version__,
              "torch_cuda_version": torch.version.cuda,
              "gpu_name": torch.cuda.get_device_name(0),
              "warp_version": getattr(wp, "__version__", None),
              "warp_cuda_devices": [str(device) for device in devices],
              "element_count": int(values.size),
              "launch_count": 20,
              "cpu_seconds": cpu_seconds,
              "gpu_seconds": gpu_seconds,
              "gpu_speedup": cpu_seconds / max(gpu_seconds, 1e-12),
              "maximum_cpu_gpu_absolute_difference": max_difference,
          }
          output = Path("self-hosted-evaluation/warp-parity.json")
          output.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          if max_difference > 1e-6:
              raise SystemExit("Warp CPU/CUDA parity tolerance exceeded")
          PY
          python self-hosted-evaluation/warp_parity_probe.py

      - name: Run focused evaluation-contract tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -ra \
            tests/test_causal4d_benchmark.py \
            tests/test_causal4d_contact_evaluation.py \
            tests/test_dynamic_contact.py \
            tests/test_deform360_phystwin_feasibility.py \
            tests/test_deform360_replication_warp.py \
            | tee self-hosted-evaluation/focused-tests.log

      - name: Run higher-powered diagnostic evaluation
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci/run_self_hosted_evaluation.py \
            --profile "${EVAL_PROFILE}" \
            --output-dir self-hosted-evaluation/results \
            | tee self-hosted-evaluation/evaluation.log

      - name: Read exact BayesianPhysTwin provider pin
        if: ${{ inputs.run_bpt }}
        id: pin
        run: echo "sha=$(python scripts/ci/read_bpt_pin.py)" >> "${GITHUB_OUTPUT}"

      - name: Check out pinned public BayesianPhysTwin
        if: ${{ inputs.run_bpt }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.pin.outputs.sha }}
          path: _bpt
          persist-credentials: false

      - name: Build and install exact BayesianPhysTwin wheel
        if: ${{ inputs.run_bpt }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _bpt rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          test -z "$(git -C _bpt status --porcelain=v1)"
          python -m build --wheel \
            --outdir self-hosted-evaluation/wheels \
            ./_bpt
          bpt_wheel="$(
            find self-hosted-evaluation/wheels -maxdepth 1 \
              -name 'bayesian_phystwin-*.whl' -print -quit
          )"
          test -n "${bpt_wheel}"
          sha256sum "${bpt_wheel}" \
            | tee -a self-hosted-evaluation/wheel-sha256.txt
          python -m pip install "${bpt_wheel}"
          python -m pip check
          {
            echo "repository=IPS-Stuttgart/BayesianPhysTwin"
            echo "sha=$(git -C _bpt rev-parse HEAD)"
            echo "wheel=${bpt_wheel}"
          } | tee self-hosted-evaluation/bpt-provider-info.txt
          python - <<'PY'
          from pathlib import Path

          import bayesian_phystwin

          checkout = (Path.cwd() / "_bpt").resolve()
          origin = Path(bayesian_phystwin.__file__).resolve()
          print("BayesianPhysTwin import", origin)
          if origin.is_relative_to(checkout):
              raise SystemExit(
                  "BayesianPhysTwin resolved from the checkout instead of the wheel"
              )
          PY

      - name: Run pinned provider integration tests
        if: ${{ inputs.run_bpt }}
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci/run_bpt_integration_tests.py \
            | tee self-hosted-evaluation/bpt-integration.log

      - name: Record resolved environment
        if: always()
        shell: bash
        run: |
          python -m pip freeze --all \
            | tee self-hosted-evaluation/pip-freeze.txt
          git status --short \
            | tee self-hosted-evaluation/git-status.txt

      - name: Upload evaluation bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: causal4d-self-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: self-hosted-evaluation
          if-no-files-found: error
          retention-days: 30
