name: Temporary fix self-hosted policy model coverage

on:
  push:
    branches:
      - feat/deform360-gpuserver6000-public-holdings
    paths:
      - ".github/workflows/tmp-fix-self-hosted-policy-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/deform360-gpuserver6000-public-holdings
          persist-credentials: true

      - name: Add validator for the registered object-input staging model
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_self_hosted_workflow_policy.py")
          text = path.read_text(encoding="utf-8")

          marker = '''def _single_operator_v5_issue_main_errors(
              workflow_text: str,
              block: str,
          ) -> list[str]:
          '''
          insertion = '''def _object_registration_input_stage_issue_main_errors(
              workflow_text: str,
              block: str,
          ) -> list[str]:
              return _exact_maintainer_issue_errors(
                  workflow_text,
                  block,
                  trigger_title=(
                      "[self-hosted] stage Causal4D object-registration inputs"
                  ),
              )
          
          
          def _single_operator_v5_issue_main_errors(
              workflow_text: str,
              block: str,
          ) -> list[str]:
          '''
          marker = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in marker.splitlines()
          ) + "\n"
          insertion = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in insertion.splitlines()
          ) + "\n"
          if marker not in text:
              raise SystemExit("validator insertion marker changed")
          text = text.replace(marker, insertion, 1)

          old = '''    if authorization_model == "maintainer-issue-main":
              return _maintainer_issue_main_errors(workflow_text, block)
              if authorization_model == "single-operator-v5-issue-main":
          '''
          new = '''    if authorization_model == "maintainer-issue-main":
              return _maintainer_issue_main_errors(workflow_text, block)
              if authorization_model == "object-registration-input-stage-issue-main":
                  return _object_registration_input_stage_issue_main_errors(
                      workflow_text,
                      block,
                  )
              if authorization_model == "single-operator-v5-issue-main":
          '''
          old = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old.splitlines()
          ) + "\n"
          new = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new.splitlines()
          ) + "\n"
          if old not in text:
              old = '''    if authorization_model == "maintainer-issue-main":
              return _maintainer_issue_main_errors(workflow_text, block)
              if authorization_model == "single-operator-v5-issue-main":
          '''
              old = old.replace("              return", "        return").replace(
                  "              if", "    if"
              )
              new = new.replace("              return", "        return").replace(
                  "              if", "    if"
              ).replace("                  return", "        return").replace(
                  "                      workflow_text", "            workflow_text"
              ).replace("                      block", "            block").replace(
                  "                  )", "        )"
              )
          if old not in text:
              raise SystemExit("authorization branch marker changed")
          text = text.replace(old, new, 1)

          old = '''        "main-only",
              "maintainer-issue-main",
              "single-operator-v5-issue-main",
          '''
          new = '''        "main-only",
              "maintainer-issue-main",
              "object-registration-input-stage-issue-main",
              "single-operator-v5-issue-main",
          '''
          old = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old.splitlines()
          ) + "\n"
          new = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new.splitlines()
          ) + "\n"
          if old not in text:
              old = old.replace("              ", "        ")
              new = new.replace("              ", "        ")
          if old not in text:
              raise SystemExit("authorization set marker changed")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format, test, and commit
        run: |
          python3 -m pip install ruff==0.16.5 pytest
          python3 -m ruff format tests/test_self_hosted_workflow_policy.py
          python3 -m pytest -q tests/test_self_hosted_workflow_policy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_self_hosted_workflow_policy.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No policy test change required"
            exit 0
          fi
          git commit -m "Cover registered object-input authorization model"
          git push origin HEAD:feat/deform360-gpuserver6000-public-holdings
