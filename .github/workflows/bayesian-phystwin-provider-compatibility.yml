  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bayesian-phystwin-provider-compatibility.yml"
      - "ci/three_repository_*.py"
      - "requirements/ci/bayesian-phystwin-three-repository.sha"
      - "requirements/ci/prob4d-three-repository.sha"
      - "docs/ci.md"
      - "docs/molmo_visual_inputs_v2.md"
      - "docs/prob4d_provider_attestation.md"
      - "docs/stack_lock.md"
      - "docs/decision_trace.md"
      - "pyproject.toml"
      - "src/causal4d/__init__.py"
      - "src/causal4d/artifact_io.py"
      - "src/causal4d/atomic_io.py"
