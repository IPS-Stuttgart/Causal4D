name: Publish public real-world dataset probe result

on:
  workflow_run:
    workflows:
      - Public real-world dataset probe on gpuserver4090
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-public-realworld-probe-result
  cancel-in-progress: false

jobs:
  publish:
    name: Publish deterministic dataset-probe snapshot
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Download probe artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _published_probe
          artifact_json="$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/artifacts")"
          artifact_url="$(printf '%s' "${artifact_json}" | jq -r '
            [.artifacts[] | select(.name | startswith("public-realworld-probe-gpuserver4090-"))]
            | if length == 1 then .[0].archive_download_url else error("expected one artifact") end
          ')"
          gh api "${artifact_url}" > _published_probe/artifact.zip
          unzip -q _published_probe/artifact.zip -d _published_probe/unpacked
          test -f _published_probe/unpacked/probe.json
          test -f _published_probe/unpacked/probe.md

      - name: Validate and stage snapshot
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          destination="evidence/automated/public-realworld-probe"
          mkdir -p "${destination}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path("_published_probe/unpacked/probe.json")
          probe = json.loads(source.read_text(encoding="utf-8"))
          assert probe["artifact_kind"] == "Causal4DPublicRealWorldDatasetProbeV1"
          assert probe["information_boundary"]["public_data_only"] is True
          assert probe["information_boundary"]["new_physical_data_collected"] is False
          destination = Path("evidence/automated/public-realworld-probe")
          (destination / "latest.json").write_text(
              json.dumps(probe, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          (destination / "latest.md").write_text(
              Path("_published_probe/unpacked/probe.md").read_text(encoding="utf-8"),
              encoding="utf-8",
          )
          metadata = {
              "schema_version": 1,
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_url": os.environ["RUN_URL"],
              "probed_revision": os.environ["HEAD_SHA"],
              "ranking": probe["ranking"],
          }
          (destination / "latest-run.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit probe snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/automated/public-realworld-probe/
          if git diff --cached --quiet; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          git commit -m "Publish public real-world dataset probe [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
