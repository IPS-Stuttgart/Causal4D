name: Execute reviewed agent branch cleanup

"on":
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Reviewed manifest below ci/branch-cleanup-manifests/.
        required: true
        type: string
      manifest_sha256:
        description: Exact SHA-256 of the reviewed manifest bytes.
        required: true
        type: string
      approval_phrase:
        description: Type delete-reviewed-agent-branches to authorize this tranche.
        required: true
        type: string

permissions: {}

concurrency:
  group: reviewed-agent-branch-cleanup
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: Validate reviewed cleanup inputs without mutation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify dispatch source and reviewed manifest path
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          case "$MANIFEST_PATH" in
            ci/branch-cleanup-manifests/*.json) ;;
            *) echo "manifest must be a reviewed JSON file" >&2; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate committed manifest and source report
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          python scripts/ci/reviewed_agent_branch_cleanup.py \
            --manifest "$MANIFEST_PATH" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --validate-only \
            --output-json reviewed-branch-cleanup-validation.json

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            reviewed-agent-branch-cleanup-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewed-branch-cleanup-validation.json
          if-no-files-found: warn
          retention-days: 90

  cleanup:
    name: Delete one reviewed, SHA-bound tranche
    needs: validate
    if: >-
      ${{
        needs.validate.result == 'success' &&
        github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the exact validated main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify source, path, and explicit authorization
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$APPROVAL_PHRASE" = "delete-reviewed-agent-branches"
          case "$MANIFEST_PATH" in
            ci/branch-cleanup-manifests/*.json) ;;
            *) echo "manifest must be a reviewed JSON file" >&2; exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Recheck live refs and execute the exact reviewed tranche
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        run: |
          python scripts/ci/reviewed_agent_branch_cleanup.py \
            --manifest "$MANIFEST_PATH" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --approval-phrase "$APPROVAL_PHRASE" \
            --output-json reviewed-branch-cleanup-execution.json

      - name: Publish available execution receipt in the summary
        if: always()
        run: |
          if [[ -s reviewed-branch-cleanup-execution.json ]]; then
            python -m json.tool reviewed-branch-cleanup-execution.json \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload success or partial-failure execution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: >-
            reviewed-agent-branch-cleanup-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: reviewed-branch-cleanup-execution.json
          if-no-files-found: warn
          retention-days: 90
