name: Apply single-operator remediation v2

on:
  push:
    branches:
      - agent/correct-single-operator-registry
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-single-operator-remediation-v2
  cancel-in-progress: true

jobs:
  patch:
    if: >-
      github.actor == 'FlorianPfaff' &&
      (
        github.event_name == 'push' ||
        github.event.pull_request.head.ref ==
          'agent/correct-single-operator-registry'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/correct-single-operator-registry
          fetch-depth: 1

      - name: Apply the exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/apply_single_operator_remediation.py
          python scripts/ci/remove_unsupported_operator_name_literals.py

      - name: Format and validate the correction
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m ruff format \
            scripts/ci/correct_self_hosted_operator_registry.py \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py \
            tests/test_self_hosted_operator_registry_correction.py \
            tests/test_operator_registry_correction_workflow.py
          python -m ruff check .
          python -m mypy --python-version 3.12 \
            scripts/ci/correct_self_hosted_operator_registry.py
          python -m pytest -q \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py \
            tests/test_self_hosted_operator_registry_correction.py \
            tests/test_operator_registry_correction_workflow.py \
            tests/test_self_hosted_workflow_policy.py
          git diff --check
          if grep -R -n -E \
            'Anna Seel|Markus Rummel|Michael Feurer' \
            --exclude-dir=.git \
            --exclude='apply-single-operator-remediation*.yml' .; then
            echo "Unsupported person names remain in the product tree" >&2
            exit 1
          fi

      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent/apply-single-operator-remediation \
            .github/workflows/apply-single-operator-remediation.yml \
            .github/workflows/apply-single-operator-remediation-v2.yml \
            scripts/ci/apply_single_operator_remediation.py \
            scripts/ci/remove_unsupported_operator_name_literals.py
          git diff --check

      - name: Commit and push the product correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Correct the operator registry to FlorianPfaff only"
          git push origin HEAD:agent/correct-single-operator-registry
