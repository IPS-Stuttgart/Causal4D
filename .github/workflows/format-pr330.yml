name: Format PR 330

on:
  push:
    branches: [agent/registered-query-structured-abduction]

permissions:
  contents: write

concurrency:
  group: format-pr330
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/registered-query-structured-abduction
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Apply the CI formatter and publish only its three-file delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.2'
          python -m ruff format \
            src/causal4d/cli/abduct_phystwin_intervention.py \
            src/causal4d/factual_abduction_uncertainty.py \
            tests/test_causal4d_grouped_abduction.py
          git diff --check

          actual="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            src/causal4d/cli/abduct_phystwin_intervention.py \
            src/causal4d/factual_abduction_uncertainty.py \
            tests/test_causal4d_grouped_abduction.py | LC_ALL=C sort)"
          test "$actual" = "$expected"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            src/causal4d/cli/abduct_phystwin_intervention.py \
            src/causal4d/factual_abduction_uncertainty.py \
            tests/test_causal4d_grouped_abduction.py
          git commit -m "Apply canonical Ruff formatting"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push \
            origin HEAD:refs/heads/agent/registered-query-structured-abduction
