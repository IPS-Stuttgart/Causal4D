name: One-shot format PR 418

"on":
  push:
    branches:
      - science/intervention-equivalence-certificate-v1

permissions:
  contents: write

concurrency:
  group: one-shot-format-pr-418
  cancel-in-progress: false

jobs:
  format:
    name: Apply exact Ruff formatting
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/intervention-equivalence-certificate-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Format only the two new Python files
        run: |
          python -m pip install "ruff==0.16.4"
          python -m ruff format \
            src/causal4d/intervention_equivalence_v1.py \
            tests/test_intervention_equivalence_v1.py
          python -m ruff format --check \
            src/causal4d/intervention_equivalence_v1.py \
            tests/test_intervention_equivalence_v1.py

      - name: Commit a formatter-only change when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/causal4d/intervention_equivalence_v1.py \
            tests/test_intervention_equivalence_v1.py
          if git diff --cached --quiet; then
            echo "Files already match Ruff formatting."
          else
            git commit -m "Apply Ruff formatting [autoformat]"
            git push origin HEAD:science/intervention-equivalence-certificate-v1
          fi
