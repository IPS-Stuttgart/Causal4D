name: Format Deform360 official point-cloud pilot

on:
  push:
    branches:
      - science/deform360-official-pcd-source-pilot-v1
    paths:
      - "ops/format-deform360-official-pcd-pilot-request.json"

permissions:
  contents: write

concurrency:
  group: format-deform360-official-pcd-pilot
  cancel-in-progress: false

jobs:
  format:
    name: Apply the repository formatter to the pilot
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: science/deform360-official-pcd-source-pilot-v1
          fetch-depth: 1
          persist-credentials: true
          clean: true

      - name: Apply pinned Ruff formatter
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'ruff==0.16.5'
          files=(
            src/causal4d_public/deform360_official_pcd_pilot.py
            tests/test_deform360_official_pcd_pilot.py
          )
          python -m ruff format "${files[@]}"
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            src/causal4d_public/deform360_official_pcd_pilot.py
            tests/test_deform360_official_pcd_pilot.py
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected formatter diff: %s\n' "${changed[*]}" >&2
            exit 1
          fi
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/causal4d_public/deform360_official_pcd_pilot.py \
            tests/test_deform360_official_pcd_pilot.py
          git commit -m 'Format the Deform360 point-cloud pilot'
          git push origin HEAD:science/deform360-official-pcd-source-pilot-v1
