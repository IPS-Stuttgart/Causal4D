name: One-shot complete PokeFlex audit policy

on:
  push:
    branches:
      - fix/pokeflex-audit-workflow-policy
    paths:
      - .github/workflows/one-shot-complete-pokeflex-audit-policy.yml

permissions:
  contents: write

concurrency:
  group: one-shot-complete-pokeflex-audit-policy
  cancel-in-progress: true

jobs:
  update-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pokeflex-audit-workflow-policy
          persist-credentials: true
          clean: true

      - name: Register the self-hosted audit and reviewed-file trigger
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          registry_path = Path(".github/self-hosted-jobs.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          entry = {
              "authorization_model": "reviewed-file-main",
              "dataset_access": (
                  "verified-public-pokeflex-zip-central-directory-metadata-only"
              ),
              "job": "audit",
              "purpose": (
                  "Metadata-only PokeFlex probe/challenge fold feasibility audit"
              ),
              "runner_labels": ["self-hosted", "Linux", "X64", "gpuserver4090"],
              "secrets_allowed": False,
              "workflow": "pokeflex-probe-challenge-fold-audit-gpuserver4090.yml",
          }
          key = (entry["workflow"], entry["job"])
          jobs = [
              item
              for item in registry["jobs"]
              if (item["workflow"], item["job"]) != key
          ]
          jobs.append(entry)
          registry["jobs"] = sorted(
              jobs,
              key=lambda item: (item["workflow"], item["job"]),
          )
          registry_path.write_text(
              json.dumps(registry, indent=2) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_self_hosted_workflow_policy.py")
          text = test_path.read_text(encoding="utf-8")
          addition = (
              "    \"pokeflex-probe-challenge-fold-audit-gpuserver4090.yml\": (\n"
              "        \".github/requests/\"\n"
              "        \"pokeflex-probe-challenge-fold-audit-gpuserver4090-v1.json\"\n"
              "    ),\n"
          )
          anchor = (
              "    \"public-realworld-probe-gpuserver4090.yml\": (\n"
              "        \"ops/public-realworld-probe-gpuserver4090-request.json\"\n"
              "    ),\n"
          )
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("reviewed-file trigger mapping anchor missing")
              text = text.replace(anchor, addition + anchor, 1)
          test_path.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate the exact policy changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -e ".[dev]"
          python3 -m ruff format tests/test_self_hosted_workflow_policy.py
          python3 -m ruff check tests/test_self_hosted_workflow_policy.py
          python3 -m ruff format --check tests/test_self_hosted_workflow_policy.py
          python3 -m pytest -q \
            tests/test_github_action_pins.py \
            tests/test_self_hosted_workflow_policy.py \
            tests/test_pokeflex_probe_challenge_fold_audit.py

      - name: Commit the policy registry updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/self-hosted-jobs.json tests/test_self_hosted_workflow_policy.py
          git diff --cached --check
          git commit -m "Register the reviewed PokeFlex fold audit"
          git push origin HEAD:fix/pokeflex-audit-workflow-policy
