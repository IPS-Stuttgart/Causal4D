name: Deform360 source prefix kinematics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deform360-prefix-kinematics.yml"
      - "configs/causal4d_public/deform360_prefix_kinematics_v1.json"
      - "configs/causal4d_public/deform360_source_backend_reproduction_runtime_v1.json"
      - "docs/causal4d_deform360_prefix_kinematics.md"
      - "scripts/remote/find_deform360_replication_root.py"
      - "scripts/remote/run_deform360_prefix_kinematics.py"
      - "scripts/remote/run_deform360_prefix_kinematics_workflow.sh"
      - "scripts/remote/select_deform360_prefix_kinematics_python.py"
      - "src/causal4d_public/deform360_prefix_kinematics.py"
      - "src/causal4d_public/deform360_prefix_kinematics_diagnostic.py"
      - "tests/test_deform360_prefix_kinematics.py"
      - "tests/test_deform360_prefix_kinematics_diagnostic.py"
      - "tests/test_deform360_prefix_kinematics_python_selector.py"
      - "tests/test_deform360_prefix_kinematics_runner.py"
      - "tests/test_deform360_prefix_kinematics_workflow_policy.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/deform360-prefix-kinematics.yml"
      - "configs/causal4d_public/deform360_prefix_kinematics_v1.json"
      - "configs/causal4d_public/deform360_source_backend_reproduction_runtime_v1.json"
      - "scripts/remote/find_deform360_replication_root.py"
      - "scripts/remote/run_deform360_prefix_kinematics.py"
      - "scripts/remote/run_deform360_prefix_kinematics_workflow.sh"
      - "scripts/remote/select_deform360_prefix_kinematics_python.py"
      - "src/causal4d_public/deform360_prefix_kinematics.py"
      - "src/causal4d_public/deform360_prefix_kinematics_diagnostic.py"
      - "tests/test_deform360_prefix_kinematics.py"
      - "tests/test_deform360_prefix_kinematics_diagnostic.py"
      - "tests/test_deform360_prefix_kinematics_python_selector.py"
      - "tests/test_deform360_prefix_kinematics_runner.py"
      - "tests/test_deform360_prefix_kinematics_workflow_policy.py"
  workflow_dispatch:
    inputs:
      data_root:
        description: Optional exact derived Deform360 replication root
        required: false
        type: string
      run_source_diagnostic:
        description: Run the locked source-only GPU diagnostic
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: deform360-prefix-kinematics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Lock, causal boundary, formatting, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development environment
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Check the diagnostic surface
        run: |
          files=(
            scripts/remote/find_deform360_replication_root.py
            scripts/remote/run_deform360_prefix_kinematics.py
            scripts/remote/select_deform360_prefix_kinematics_python.py
            src/causal4d_public/deform360_prefix_kinematics.py
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics.py
            tests/test_deform360_prefix_kinematics_diagnostic.py
            tests/test_deform360_prefix_kinematics_python_selector.py
            tests/test_deform360_prefix_kinematics_runner.py
            tests/test_deform360_prefix_kinematics_workflow_policy.py
          )
          python -m ruff check "${files[@]}"
          python -m ruff format --check "${files[@]}"
          python -m mypy --no-site-packages \
            src/causal4d_public/deform360_prefix_kinematics.py \
            src/causal4d_public/deform360_prefix_kinematics_diagnostic.py \
            scripts/remote/find_deform360_replication_root.py \
            scripts/remote/run_deform360_prefix_kinematics.py \
            scripts/remote/select_deform360_prefix_kinematics_python.py
          bash -n scripts/remote/run_deform360_prefix_kinematics_workflow.sh

      - name: Exercise the lock and causal boundary
        run: |
          python -m pytest -q \
            tests/test_deform360_prefix_kinematics.py \
            tests/test_deform360_prefix_kinematics_diagnostic.py \
            tests/test_deform360_prefix_kinematics_python_selector.py \
            tests/test_deform360_prefix_kinematics_runner.py \
            tests/test_deform360_prefix_kinematics_workflow_policy.py \
            tests/test_deform360_replication_case.py \
            tests/test_deform360_source_failure_attribution.py

  source-diagnostic:
    name: Locked source-only GPU diagnostic
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.run_source_diagnostic
    needs: contract
    runs-on: [self-hosted, Linux, X64, nvidia-smi, data-deform360-v1]
    timeout-minutes: 360
    env:
      DEFORM360_REPLICATION_ROOT: ${{ inputs.data_root }}
    steps:
      - name: Check out exact reviewed Causal4D revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify reviewed main revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Initialize source-evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deform360-prefix-kinematics
          printf '%s\n' \
            '{"schema_version":1,"state":"initialized","head_sha":"'"${GITHUB_SHA}"'","run_id":"'"${GITHUB_RUN_ID}"'"}' \
            > deform360-prefix-kinematics/status.json

      - name: Select the conditional reproduction runtime
        shell: bash
        run: |
          set -euo pipefail
          selected="$(
            /usr/bin/python3 \
              scripts/remote/select_deform360_prefix_kinematics_python.py \
              --report deform360-prefix-kinematics/python-selection.json
          )"
          test -x "${selected}"
          echo "PREFIX_KINEMATICS_PYTHON=${selected}" >> "$GITHUB_ENV"

      - name: Read locked repository pins
        id: repository-pins
        shell: bash
        run: |
          set -euo pipefail
          "$PREFIX_KINEMATICS_PYTHON" - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          protocol = json.loads(
              Path(
                  "configs/causal4d_public/deform360_replication_v1.json"
              ).read_text(encoding="utf-8")
          )["config"]
          pins = {
              "bpt_sha": subprocess.check_output(
                  [sys.executable, "scripts/ci/read_bpt_pin.py"],
                  text=True,
              ).strip(),
              "deform360_sha": protocol["deform360_code_commit"],
              "official_phystwin_sha": protocol["official_phystwin_commit"],
          }
          for name, value in pins.items():
              if type(value) is not str or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit(f"{name} is not a lowercase 40-hex commit")
              print(f"{name}={value}")
          PY

      - name: Check out pinned public BayesianPhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: ${{ steps.repository-pins.outputs.bpt_sha }}
          path: _bpt
          persist-credentials: false
          clean: true

      - name: Check out pinned Deform360 code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lhy0807/deform360
          ref: ${{ steps.repository-pins.outputs.deform360_sha }}
          path: _deform360
          persist-credentials: false
          clean: true

      - name: Check out pinned official PhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Jianghanxiao/PhysTwin
          ref: ${{ steps.repository-pins.outputs.official_phystwin_sha }}
          path: _official_phystwin
          persist-credentials: false
          clean: true

      - name: Run locked source diagnostic
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/remote/run_deform360_prefix_kinematics_workflow.sh \
            "$PWD" \
            "$PWD/_bpt" \
            "$PWD/_deform360" \
            "$PWD/_official_phystwin" \
            "$PWD/deform360-prefix-kinematics" \
            2>&1 | tee deform360-prefix-kinematics/run.log
          "$PREFIX_KINEMATICS_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("deform360-prefix-kinematics/status.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "state": "completed",
                      "head_sha": os.environ["GITHUB_SHA"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                      "python": os.environ["PREFIX_KINEMATICS_PYTHON"],
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deform360-prefix-kinematics-${{ github.sha }}
          path: deform360-prefix-kinematics/
          if-no-files-found: error
          retention-days: 30
