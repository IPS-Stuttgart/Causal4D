name: Repair recent public-data self-hosted registrations

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/repair-recent-public-data-registry-pr.yml"
      - ".github/self-hosted-jobs.json"
      - "tests/test_self_hosted_workflow_policy.py"

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'science/tracking-cloth-task-observation-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          clean: true

      - name: Register exact legacy reviewed-file jobs without changing their workflows
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path

          policy_path = Path('tests/test_self_hosted_workflow_policy.py')
          policy = policy_path.read_text(encoding='utf-8')

          anchor = 'PINNED_ACTION = re.compile(r"[0-9a-f]{40}")\n'
          trigger_block = '''PINNED_ACTION = re.compile(r"[0-9a-f]{40}")
          REVIEWED_FILE_MAIN_TRIGGERS = {
              "deform-dlo45-public-gpuserver4090.yml": (
                  "ops/deform-dlo45-public-gpuserver4090-request.json"
              ),
              "deform360-official-pcd-source-pilot.yml": (
                  "ops/deform360-official-pcd-source-pilot-request.json"
              ),
              "deform360-official-pcd-source-pilot-v3.yml": (
                  "ops/deform360-official-pcd-source-pilot-v3-request.json"
              ),
              "deform360-official-pcd-source-pilot-v4.yml": (
                  "ops/deform360-official-pcd-source-pilot-v4-request.json"
              ),
              "deform360-official-pcd-source-pilot-v5.yml": (
                  "ops/deform360-official-pcd-source-pilot-v5-request.json"
              ),
              "public-realworld-probe-gpuserver4090.yml": (
                  "ops/public-realworld-probe-gpuserver4090-request.json"
              ),
          }
          '''
          if 'REVIEWED_FILE_MAIN_TRIGGERS' not in policy:
              if policy.count(anchor) != 1:
                  raise SystemExit('policy constant insertion anchor changed')
              policy = policy.replace(anchor, trigger_block, 1)

          function_anchor = '''def _exact_maintainer_issue_errors(
          '''
          reviewed_function = '''def _reviewed_file_main_errors(
              workflow_name: str,
              workflow_text: str,
              block: str,
          ) -> list[str]:
              errors = _common_self_hosted_errors(block)
              request_path = REVIEWED_FILE_MAIN_TRIGGERS.get(workflow_name)
              if request_path is None:
                  errors.append("workflow is not an exact reviewed-file exception")
                  return errors
              prefix = workflow_text.split("permissions:", maxsplit=1)[0]
              required = {
                  "  push:": "workflow lacks the reviewed push trigger",
                  "  workflow_dispatch:": "workflow lacks manual reviewed dispatch",
                  "    branches: [main]": "push trigger is not bound to main",
                  request_path: "workflow is not bound to its exact reviewed request file",
              }
              for fragment, message in required.items():
                  if fragment not in prefix:
                      errors.append(message)
              if prefix.count(request_path) != 1:
                  errors.append("reviewed request path must occur exactly once in trigger block")
              for forbidden_event in ("  issues:", "  schedule:", "  workflow_call:"):
                  if forbidden_event in prefix:
                      errors.append(f"reviewed-file workflow also exposes {forbidden_event.strip()}")
              if "  pull_request:" in prefix and "github.event_name != 'pull_request'" not in block:
                  errors.append("self-hosted job is not excluded from pull requests")
              for forbidden_payload in (
                  "github.event.head_commit.message",
                  "github.event.commits",
                  "github.event.pull_request.body",
              ):
                  if forbidden_payload in block:
                      errors.append(
                          f"untrusted push or pull-request payload reaches self-hosted job: "
                          f"{forbidden_payload}"
                      )
              return errors


          def _exact_maintainer_issue_errors(
          '''
          if 'def _reviewed_file_main_errors(' not in policy:
              if policy.count(function_anchor) != 1:
                  raise SystemExit('reviewed validator insertion anchor changed')
              policy = policy.replace(function_anchor, reviewed_function, 1)

          old_signature = '''def _authorization_errors(
              authorization_model: str,
              workflow_text: str,
              block: str,
          ) -> list[str]:
          '''
          new_signature = '''def _authorization_errors(
              authorization_model: str,
              workflow_name: str,
              workflow_text: str,
              block: str,
          ) -> list[str]:
          '''
          if old_signature in policy:
              policy = policy.replace(old_signature, new_signature, 1)
          elif new_signature not in policy:
              raise SystemExit('authorization signature preimage changed')

          old_branch = '''    if authorization_model == "maintainer-issue-main":
                  return _maintainer_issue_main_errors(workflow_text, block)
          '''
          new_branch = '''    if authorization_model == "reviewed-file-main":
                  return _reviewed_file_main_errors(workflow_name, workflow_text, block)
              if authorization_model == "maintainer-issue-main":
                  return _maintainer_issue_main_errors(workflow_text, block)
          '''
          if old_branch in policy:
              policy = policy.replace(old_branch, new_branch, 1)
          elif 'authorization_model == "reviewed-file-main"' not in policy:
              raise SystemExit('authorization branch preimage changed')

          old_models = '''        "main-only",
                  "maintainer-issue-main",
          '''
          new_models = '''        "main-only",
                  "reviewed-file-main",
                  "maintainer-issue-main",
          '''
          if old_models in policy:
              policy = policy.replace(old_models, new_models, 1)
          elif '        "reviewed-file-main",\n' not in policy:
              raise SystemExit('authorization-model expectation preimage changed')

          old_call = '''            _authorization_errors(
                          entry["authorization_model"],
                          workflow_text,
                          block,
                      )
          '''
          new_call = '''            _authorization_errors(
                          entry["authorization_model"],
                          entry["workflow"],
                          workflow_text,
                          block,
                      )
          '''
          if old_call in policy:
              policy = policy.replace(old_call, new_call, 1)
          elif '                entry["workflow"],\n' not in policy:
              raise SystemExit('authorization call preimage changed')

          policy_path.write_text(policy, encoding='utf-8')

          registry_path = Path('.github/self-hosted-jobs.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          registry['authorization_models']['reviewed-file-main'] = {
              'description': (
                  'Exact frozen public-data workflow triggered only by a reviewed '
                  'main-branch request-file change or manual main dispatch; exact '
                  'GITHUB_SHA checkout, clean-tree verification, read-only token, '
                  'no issue/PR payload execution, and no secrets.'
              )
          }
          additions = [
              {
                  'authorization_model': 'reviewed-file-main',
                  'dataset_access': 'verified-public-deform-dlo45-source-gate-and-conditional-target',
                  'job': 'evaluate',
                  'purpose': 'Target-closed DEFORM DLO4/DLO5 public evaluation',
                  'runner_labels': ['self-hosted', 'Linux', 'X64', 'nvidia-smi', 'gpuserver4090'],
                  'secrets_allowed': False,
                  'workflow': 'deform-dlo45-public-gpuserver4090.yml',
              },
              {
                  'authorization_model': 'reviewed-file-main',
                  'dataset_access': 'approved-source-only-deform360-official-pcd',
                  'job': 'evaluate',
                  'purpose': 'Original Deform360 official point-cloud source pilot',
                  'runner_labels': ['self-hosted', 'Linux', 'X64', 'nvidia-smi', 'gpuserver4090'],
                  'secrets_allowed': False,
                  'workflow': 'deform360-official-pcd-source-pilot.yml',
              },
              {
                  'authorization_model': 'reviewed-file-main',
                  'dataset_access': 'approved-source-only-deform360-official-pcd',
                  'job': 'evaluate',
                  'purpose': 'V3 Deform360 official point-cloud source pilot',
                  'runner_labels': ['self-hosted', 'Linux', 'X64', 'nvidia-smi', 'gpuserver4090'],
                  'secrets_allowed': False,
                  'workflow': 'deform360-official-pcd-source-pilot-v3.yml',
              },
              {
                  'authorization_model': 'reviewed-file-main',
                  'dataset_access': 'approved-source-only-deform360-official-pcd',
                  'job': 'evaluate',
                  'purpose': 'V4 Deform360 official point-cloud source pilot',
                  'runner_labels': ['self-hosted', 'Linux', 'X64', 'nvidia-smi', 'gpuserver4090'],
                  'secrets_allowed': False,
                  'workflow': 'deform360-official-pcd-source-pilot-v4.yml',
              },
              {
                  'authorization_model': 'reviewed-file-main',
                  'dataset_access': 'approved-source-only-deform360-official-pcd',
                  'job': 'evaluate',
                  'purpose': 'V5 standalone Deform360 official point-cloud source pilot',
                  'runner_labels': ['self-hosted', 'Linux', 'X64', 'nvidia-smi', 'gpuserver4090'],
                  'secrets_allowed': False,
                  'workflow': 'deform360-official-pcd-source-pilot-v5.yml',
              },
              {
                  'authorization_model': 'reviewed-file-main',
                  'dataset_access': 'verified-public-dataset-read-only-probe',
                  'job': 'probe',
                  'purpose': 'Read-only inventory of complete public real-world holdings',
                  'runner_labels': ['self-hosted', 'Linux', 'X64', 'nvidia-smi', 'gpuserver4090'],
                  'secrets_allowed': False,
                  'workflow': 'public-realworld-probe-gpuserver4090.yml',
              },
          ]
          jobs = registry['jobs']
          by_key = {(item['workflow'], item['job']): item for item in jobs}
          for item in additions:
              key = (item['workflow'], item['job'])
              if key in by_key and by_key[key] != item:
                  raise SystemExit(f'conflicting existing registry entry for {key}')
              by_key[key] = item
          registry['jobs'] = [by_key[key] for key in sorted(by_key)]
          registry_path.write_text(
              json.dumps(registry, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          python -m py_compile tests/test_self_hosted_workflow_policy.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/self-hosted-jobs.json tests/test_self_hosted_workflow_policy.py
          git commit -m 'Register bounded reviewed-file public-data workflows'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
