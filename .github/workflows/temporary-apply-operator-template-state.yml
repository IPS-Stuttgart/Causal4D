name: Temporary apply operator registry template state patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: temporary-operator-template-state-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the staged reviewed patch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref ==
        'agent/recognize-operator-registry-template'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Verify and apply the staged patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test -z "$(git status --porcelain=v1)"
          patch=ci/temporary-recognize-operator-template.patch
          doc=docs/causal4d_preacquisition_next_action.md
          git apply --check --exclude="${doc}" "${patch}"
          git apply --exclude="${doc}" "${patch}"
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/causal4d_preacquisition_next_action.md")
          text = path.read_text(encoding="utf-8")
          paragraph = (
              "Operator-registry scaffolding is proposed only when both the sealed "
              "registry and its\nregistered draft template are absent. When the "
              "sealed registry is missing but a\nvalid unsealed template is already "
              "present, the action advances to\n`seal_operator_registry` and remains "
              "nonautomatable. A present malformed or\nsymlinked template yields "
              "`stop_and_repair_invalid_evidence`; it is never silently\nreplaced or "
              "treated as a fresh scaffold target.\n\n"
          )
          needle = (
              "12. validate the freeze and begin only the first registered "
              "confirmatory session.\n\nThe source-panel action includes"
          )
          replacement = (
              "12. validate the freeze and begin only the first registered "
              "confirmatory session.\n\n" + paragraph + "The source-panel action includes"
          )
          if paragraph in text:
              raise SystemExit("documentation paragraph already exists")
          if text.count(needle) != 1:
              raise SystemExit("documentation insertion boundary is not unique")
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
          git rm \
            ci/temporary-recognize-operator-template.patch \
            .github/workflows/temporary-apply-operator-template-state.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the patched source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py
          python -m ruff format --check \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py
          python -m mypy \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py
          python -m pytest -q \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py \
            tests/test_self_hosted_preacquisition_action.py \
            tests/test_self_hosted_workflow_policy.py

      - name: Commit the validated patch to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py \
            docs/causal4d_preacquisition_next_action.md
          git diff --cached --check
          git commit -m 'Recognize existing operator registry templates'
          git push origin "HEAD:${HEAD_BRANCH}"
