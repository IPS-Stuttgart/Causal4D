name: Temporary apply operator registry template state patch

on:
  push:
    branches:
      - agent/recognize-operator-registry-template

permissions:
  contents: write

concurrency:
  group: temporary-operator-template-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply the staged reviewed patch
    if: >-
      github.event.head_commit.message ==
      '[apply-template-state-patch] Apply staged operator template state patch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify and apply the staged patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"
          git apply --check ci/temporary-recognize-operator-template.patch
          git apply ci/temporary-recognize-operator-template.patch
          rm ci/temporary-recognize-operator-template.patch

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the patched source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m ruff check \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py
          python -m ruff format --check \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py
          python -m mypy \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py
          python -m pytest -q \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py \
            tests/test_self_hosted_preacquisition_action.py \
            tests/test_self_hosted_workflow_policy.py

      - name: Commit the validated patch to the branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py \
            tests/test_operator_registry.py \
            tests/test_preacquisition_next_action.py \
            docs/causal4d_preacquisition_next_action.md \
            ci/temporary-recognize-operator-template.patch
          git diff --cached --check
          git commit -m 'Recognize existing operator registry templates'
          git push origin "HEAD:${GITHUB_REF_NAME}"
