name: Observation clock-offset prior contracts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/observation-clock-offset-prior.yml"
      - "src/causal4d/observation_clock_offset_prior.py"
      - "tests/test_observation_clock_offset_prior.py"
      - "docs/observation-clock-offset-prior.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observation-clock-offset-prior-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  contracts:
    name: Source-only aggregation, lineage, and no-clobber contracts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true

      - name: Provision Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Create isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/clock-offset-prior-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${root}"
          python -m venv "${root}/venv"
          {
            echo "CLOCK_PRIOR_RUN_ROOT=${root}"
            echo "CLOCK_PRIOR_VENV=${root}/venv"
          } >> "${GITHUB_ENV}"
          echo "${root}/venv/bin" >> "${GITHUB_PATH}"

      - name: Install exact source and development checks
        run: |
          python -m pip install \
            "pip==25.2" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"
          python -m pip install -e ".[dev]"
          python -m pip install "numpy>=1.24,<2.3"
          python -m pip check

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${CLOCK_PRIOR_RUN_ROOT}"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "revision=$(git rev-parse HEAD)"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            python --version
            python -m pip --version
            python -m pip freeze --all
          } | tee "${CLOCK_PRIOR_RUN_ROOT}/environment.txt"

      - name: Check focused source quality
        run: |
          python -m ruff check \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m ruff format --check \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py
          python -m mypy \
            src/causal4d/observation_clock_offset_prior.py

      - name: Run focused source-only contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -p no:cacheprovider \
            tests/test_observation_clock_offset_prior.py \
            | tee "${CLOCK_PRIOR_RUN_ROOT}/pytest.txt"
          python -m py_compile \
            src/causal4d/actuator_realization.py \
            src/causal4d/observation_clock_offset_prior.py \
            tests/test_observation_clock_offset_prior.py

      - name: Verify clean repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"

      - name: Upload compact validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: observation-clock-offset-prior-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CLOCK_PRIOR_RUN_ROOT }}/environment.txt
            ${{ env.CLOCK_PRIOR_RUN_ROOT }}/pytest.txt
          if-no-files-found: warn
          retention-days: 30
