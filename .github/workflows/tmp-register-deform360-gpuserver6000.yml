name: Temporary register Deform360 gpuserver6000 job

on:
  push:
    branches:
      - feat/deform360-gpuserver6000-public-holdings
    paths:
      - ".github/workflows/tmp-register-deform360-gpuserver6000.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/deform360-gpuserver6000-public-holdings
          persist-credentials: true

      - name: Register job and repair Python 3.10 timestamp compatibility
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import copy
          import json
          from pathlib import Path

          registry_path = Path(".github/self-hosted-jobs.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))

          if isinstance(registry, list):
              entries = registry
          elif isinstance(registry, dict):
              candidates = [
                  value
                  for value in registry.values()
                  if isinstance(value, list)
                  and all(
                      isinstance(item, dict)
                      and "workflow" in item
                      and "job" in item
                      for item in value
                  )
              ]
              if len(candidates) != 1:
                  raise SystemExit("cannot identify self-hosted job list")
              entries = candidates[0]
          else:
              raise SystemExit("unexpected self-hosted registry shape")

          workflow = "deform360-public-holdings-gpuserver6000.yml"
          job = "evaluate"
          if not any(
              item.get("workflow") == workflow and item.get("job") == job
              for item in entries
          ):
              template = next(
                  (
                      item
                      for item in entries
                      if item.get("workflow") == "deform360-reset-mechanics.yml"
                      and item.get("authorization_model") == "main-only"
                  ),
                  None,
              )
              if template is None:
                  template = next(
                      item
                      for item in entries
                      if item.get("authorization_model") == "main-only"
                  )
              new_entry = copy.deepcopy(template)
              new_entry["workflow"] = workflow
              new_entry["job"] = job
              new_entry["authorization_model"] = "main-only"
              if "runner_labels" in new_entry:
                  new_entry["runner_labels"] = [
                      "self-hosted",
                      "Linux",
                      "X64",
                      "nvidia-smi",
                      "gpuserver6000",
                  ]
              if "purpose" in new_entry:
                  new_entry["purpose"] = (
                      "Qualify and preprocess mounted public Deform360 holdings "
                      "on gpuserver6000"
                  )
              if "dataset_access" in new_entry:
                  new_entry["dataset_access"] = (
                      "approved-public-deform360-read-only-sources-and-"
                      "isolated-derived-output"
                  )
              for key in tuple(new_entry):
                  if "secret" in key.lower() and isinstance(new_entry[key], bool):
                      new_entry[key] = False
              entries.append(new_entry)
              entries.sort(key=lambda item: (item["workflow"], item["job"]))
              registry_path.write_text(
                  json.dumps(registry, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          inventory_path = Path("scripts/remote/inventory_deform360_download.py")
          inventory = inventory_path.read_text(encoding="utf-8")
          inventory = inventory.replace(
              "from datetime import UTC, datetime",
              "from datetime import datetime, timezone",
          )
          inventory = inventory.replace(
              "datetime.now(tz=UTC)",
              "datetime.now(tz=timezone.utc)",
          )
          inventory_path.write_text(inventory, encoding="utf-8")
          PY

      - name: Commit registry update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/self-hosted-jobs.json \
            scripts/remote/inventory_deform360_download.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Registry already contains the requested job"
            exit 0
          fi
          git commit -m "Register gpuserver6000 Deform360 holdings job"
          git push origin HEAD:feat/deform360-gpuserver6000-public-holdings
