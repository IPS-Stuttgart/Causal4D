name: Fix decision-identifiable import

on:
  push:
    branches:
      - feature/decision-identifiable-intervention-v1
    paths:
      - .github/workflows/fix-decision-identifiable-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/decision-identifiable-intervention-v1
          persist-credentials: true
      - name: Remove the exact unused import and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/causal4d/decision_identifiable_intervention.py")
          text = path.read_text(encoding="utf-8")
          before = "from typing import Any, Final, Literal, TypeAlias"
          after = "from typing import Final, Literal, TypeAlias"
          if text.count(before) != 1:
              raise SystemExit("exact import preimage not found once")
          path.write_text(text.replace(before, after), encoding="utf-8", newline="\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causal4d/decision_identifiable_intervention.py
          git diff --cached --check
          git commit -m "Remove unused decision consumer import"
          git push origin HEAD:feature/decision-identifiable-intervention-v1
