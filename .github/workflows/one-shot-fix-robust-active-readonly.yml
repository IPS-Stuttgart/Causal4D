name: One-shot repair for robust active calibration immutability

on:
  push:
    branches:
      - feature/robust-active-decision-identification-v1
    paths:
      - .github/workflows/one-shot-fix-robust-active-readonly.yml

permissions:
  contents: write

concurrency:
  group: one-shot-fix-robust-active-readonly
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/robust-active-decision-identification-v1
          persist-credentials: true
          clean: true

      - name: Replace reversible NumPy write flag with immutable backing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/causal4d/active_decision_calibration.py")
          text = path.read_text(encoding="utf-8")

          import_old = "import numpy as np\n\nACTIVE_DECISION_CALIBRATION_VERSION = 1"
          import_new = (
              "import numpy as np\n\n"
              "from .immutable_array import readonly_array\n\n"
              "ACTIVE_DECISION_CALIBRATION_VERSION = 1"
          )
          if import_old not in text:
              raise SystemExit("expected NumPy import anchor not found")
          text = text.replace(import_old, import_new, 1)

          body_old = '''    result = np.asarray(
        structural + calibration.require_finite_margin(),
        dtype=np.float64,
    )
    result.setflags(write=False)
    return result
'''
          body_new = '''    return readonly_array(
        structural + calibration.require_finite_margin(),
        dtype=np.float64,
    )
'''
          if body_old not in text:
              raise SystemExit("expected reversible write-flag block not found")
          text = text.replace(body_old, body_new, 1)
          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/one-shot-fix-robust-active-readonly.yml")
          workflow.unlink()
          PY

      - name: Validate focused and repository immutability tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -e ".[dev]"
          python3 -m ruff check src/causal4d/active_decision_calibration.py
          python3 -m ruff format --check src/causal4d/active_decision_calibration.py
          python3 -m pytest -q \
            tests/test_active_decision_calibration.py \
            tests/test_immutable_array.py

      - name: Commit repaired source and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/causal4d/active_decision_calibration.py
          git add -u .github/workflows/one-shot-fix-robust-active-readonly.yml
          git diff --cached --check
          git commit -m "Use irreversibly readonly arrays in active calibration"
          git push origin HEAD:feature/robust-active-decision-identification-v1
