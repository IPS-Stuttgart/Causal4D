name: Register Tracking Cloth V2 self-hosted job once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tracking-cloth-v2-register-once.yml"

permissions:
  contents: write

concurrency:
  group: tracking-cloth-v2-register-once-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  register:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Add the reviewed job to the self-hosted registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.github/self-hosted-jobs.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          entry = {
              'authorization_model': 'reviewed-file-main',
              'dataset_access': 'verified-public-tracking-cloth-source-gate-and-conditional-target',
              'job': 'evaluate',
              'purpose': 'V2 query-conditioned sparse-marker evaluation on real cloth recordings',
              'runner_labels': [
                  'self-hosted',
                  'Linux',
                  'X64',
                  'nvidia-smi',
                  'gpuserver4090',
              ],
              'secrets_allowed': False,
              'workflow': 'tracking-cloth-query-observation-v2.yml',
          }
          key = (entry['workflow'], entry['job'])
          matches = [
              item for item in payload['jobs']
              if (item['workflow'], item['job']) == key
          ]
          if matches and matches != [entry]:
              raise SystemExit('conflicting Tracking Cloth V2 registry entry')
          if not matches:
              payload['jobs'].append(entry)
          payload['jobs'].sort(key=lambda item: (item['workflow'], item['job']))
          path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          PY
          rm .github/workflows/tracking-cloth-v2-register-once.yml
          git diff --check

      - name: Commit the registry repair and remove this one-shot workflow
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/self-hosted-jobs.json \
            .github/workflows/tracking-cloth-v2-register-once.yml
          git commit -m 'Register Tracking Cloth V2 self-hosted evaluation'
          git push origin "HEAD:${HEAD_REF}"
