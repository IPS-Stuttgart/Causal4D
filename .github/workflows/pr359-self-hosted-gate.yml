name: PR 359 self-hosted merge gate

on:
  push:
    branches:
      - agent/correct-single-operator-registry

permissions:
  contents: read

concurrency:
  group: pr359-self-hosted-gate
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor == 'FlorianPfaff'
    name: Validate the complete correction on workstation2
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/correct-single-operator-registry
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify exact branch head and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1)"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create an isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .pr359-gate-venv
          py=.pr359-gate-venv/bin/python
          "${py}" -m ensurepip --upgrade
          "${py}" -m pip install --upgrade pip
          "${py}" -m pip install -e ".[dev]"

      - name: Run repository quality checks
        shell: bash
        run: |
          set -euo pipefail
          py=.pr359-gate-venv/bin/python
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pr359-syntax-cache" \
            "${py}" -W error::SyntaxWarning -m compileall -q -f src tests scripts
          "${py}" -m ruff check .
          "${py}" -m ruff format --check \
            scripts/ci/correct_self_hosted_operator_registry.py \
            src/causal4d/operator_registry.py \
            src/causal4d/preacquisition_next_action.py \
            tests/test_operator_registry.py \
            tests/test_operator_registry_correction_workflow.py \
            tests/test_preacquisition_next_action.py \
            tests/test_self_hosted_operator_registry_correction.py
          "${py}" -m mypy --python-version 3.12 \
            scripts/ci \
            src/causal4d/atomic_io.py \
            src/causal4d/result_bundle_publication.py \
            src/causal4d/trusted_pickle.py \
            src/causal4d/immutable_array.py \
            src/causal4d/immutable_json.py \
            src/causal4d/provider_contract.py \
            src/causal4d/belief_provider_v2_contract.py \
            src/causal4d/replay_provider_contract.py
          if grep -R -n -E \
            'Anna Seel|Markus Rummel|Michael Feurer' \
            --exclude-dir=.git .; then
            echo "Unsupported person names remain in the product tree" >&2
            exit 1
          fi

      - name: Run the complete default test suite
        shell: bash
        run: |
          set -euo pipefail
          .pr359-gate-venv/bin/python -m pytest \
            --junitxml=pytest-pr359-self-hosted.xml

      - name: Build and validate distributions
        shell: bash
        run: |
          set -euo pipefail
          py=.pr359-gate-venv/bin/python
          "${py}" -m build
          "${py}" -m twine check dist/*

      - name: Check out pinned Bayesian-PhysTwin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IPS-Stuttgart/BayesianPhysTwin
          ref: 573ecd9b09a8145b680738c5e5f36415feefbfe3
          path: _bpt
          persist-credentials: false

      - name: Build and validate the installed-wheel integration pair
        shell: bash
        run: |
          set -euo pipefail
          py=.pr359-gate-venv/bin/python
          wheelhouse="$RUNNER_TEMP/pr359-wheelhouse"
          integration="$RUNNER_TEMP/pr359-integration"
          mkdir -p "$wheelhouse"
          "${py}" -m build --wheel --outdir "$wheelhouse" .
          "${py}" -m build --wheel --outdir "$wheelhouse" ./_bpt
          test "$(find "$wheelhouse" -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
          "${py}" -m venv "$integration"
          "$integration/bin/python" -m ensurepip --upgrade
          "$integration/bin/python" -m pip install --upgrade pip
          "$integration/bin/python" -m pip install "$wheelhouse"/*.whl pytest
          "$integration/bin/python" -m pip check
          CAUSAL4D_REQUIRE_BPT_PROVIDER=1 \
            "$integration/bin/python" scripts/ci/run_bpt_integration_tests.py

      - name: Record validated revision
        if: always()
        shell: bash
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "validated_head=${GITHUB_SHA}"
            echo "runner=${RUNNER_NAME}"
            echo "target_outcomes_used=false"
            echo "physical_evidence_increment=0"
          } | tee pr359-self-hosted-validation.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr359-self-hosted-validation
          path: |
            pr359-self-hosted-validation.txt
            pytest-pr359-self-hosted.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Remove isolated environment
        if: always()
        shell: bash
        run: rm -rf .pr359-gate-venv dist build _bpt
