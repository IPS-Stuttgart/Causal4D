name: Materialize PokeFlex replica discovery formatting

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temporary-format-pokeflex-replica-discovery.yml"
      - "scripts/remote/discover_pokeflex_development_replica_gpuserver4090.py"
      - "src/causal4d_public/pokeflex_replica_discovery.py"
      - "tests/test_pokeflex_replica_discovery.py"

permissions:
  contents: read

jobs:
  format:
    name: Materialize canonical Ruff output
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact formatter
        run: python -m pip install "ruff==0.16.5"
      - name: Materialize canonical formatting
        run: |
          python -m ruff format \
            scripts/remote/discover_pokeflex_development_replica_gpuserver4090.py \
            src/causal4d_public/pokeflex_replica_discovery.py \
            tests/test_pokeflex_replica_discovery.py
      - name: Upload canonical files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: pokeflex-replica-discovery-canonical-${{ github.run_id }}
          path: |
            scripts/remote/discover_pokeflex_development_replica_gpuserver4090.py
            src/causal4d_public/pokeflex_replica_discovery.py
            tests/test_pokeflex_replica_discovery.py
          if-no-files-found: error
          retention-days: 2
