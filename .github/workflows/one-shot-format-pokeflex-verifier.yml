name: One-shot format PokeFlex verifier

on:
  push:
    branches:
      - fix/pokeflex-audit-workflow-policy
    paths:
      - .github/workflows/one-shot-format-pokeflex-verifier.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/pokeflex-audit-workflow-policy
          persist-credentials: true
          clean: true
      - name: Format and validate verifier
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.16.5 mypy==2.3.1
          python3 -m ruff format scripts/ci/verify_pokeflex_probe_challenge_fold_audit.py
          python3 -m ruff check scripts/ci/verify_pokeflex_probe_challenge_fold_audit.py
          python3 -m ruff format --check scripts/ci/verify_pokeflex_probe_challenge_fold_audit.py
          python3 -m mypy --python-version 3.12 scripts/ci/verify_pokeflex_probe_challenge_fold_audit.py
      - name: Commit canonical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/verify_pokeflex_probe_challenge_fold_audit.py
          git diff --cached --check
          git commit -m "Format the PokeFlex audit verifier"
          git push origin HEAD:fix/pokeflex-audit-workflow-policy
